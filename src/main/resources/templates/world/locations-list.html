<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Locations',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Locations',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" class="btn btn-primary"
   th:href="@{/campaigns/{cid}/world/locations/new(cid=${campaignId})}">+ New Location</a>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
<th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${locations.empty}" class="empty-state">No locations yet.</div>
            <div th:unless="${locations.empty}" class="card-grid">
                <div th:each="loc : ${locations}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/world/locations/{lid}(cid=${campaignId},lid=${loc.id})}"
                           th:text="${loc.name}">Location Name</a>
                        <span class="badge" th:text="${#enums.label(loc.kind)}">KIND</span>
                    </div>
                    <div th:if="${loc.summary}" class="card-body" th:text="${loc.summary}">Summary</div>
                    <div class="card-footer">
                        <span th:if="${loc.parentLocation != null}" class="u-text-xs text-muted"
                              th:text="|Parent: ${loc.parentLocation.name}|">Parent</span>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
