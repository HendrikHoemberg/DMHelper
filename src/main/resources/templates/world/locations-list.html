<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="|Locations — ${campaign.name}|">Locations</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <h1>Locations</h1>
                <div class="page-header-actions">
                    <a class="btn btn-primary"
                       th:href="@{/campaigns/{cid}/world/locations/new(cid=${campaignId})}">+ New Location</a>
                </div>
            </div>
            <th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${locations.empty}" class="empty-state">No locations yet.</div>
            <div th:unless="${locations.empty}" class="card-grid">
                <div th:each="loc : ${locations}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/world/locations/{lid}(cid=${campaignId},lid=${loc.id})}"
                           th:text="${loc.name}">Location Name</a>
                        <span class="badge" th:text="${loc.kind.name()}">KIND</span>
                    </div>
                    <div th:if="${loc.summary}" class="card-body" th:text="${loc.summary}">Summary</div>
                    <div class="card-footer">
                        <span th:if="${loc.parentLocation != null}" class="u-text-xs text-muted"
                              th:text="|Parent: ${loc.parentLocation.name}|">Parent</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
