<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Factions',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Factions',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" class="btn btn-primary"
   th:href="@{/campaigns/{cid}/world/factions/new(cid=${campaignId})}">+ New Faction</a>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
<th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${factions.empty}" class="empty-state">No factions yet.</div>
            <div th:unless="${factions.empty}" class="card-grid">
                <div th:each="faction : ${factions}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/world/factions/{fid}(cid=${campaignId},fid=${faction.id})}"
                           th:text="${faction.name}">Faction Name</a>
                    </div>
                    <div th:if="${faction.goals}" class="card-body" th:text="${faction.goals}">Goals</div>
                    <div class="card-footer">
                        <span class="u-text-xs text-muted" th:text="|Resources: ${faction.resources}|">Resources</span>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
