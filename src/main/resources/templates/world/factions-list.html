<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="|Factions — ${campaign.name}|">Factions</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <div>
                    <div class="page-header-eyebrow" th:text="${campaign.name}">Campaign</div>
                    <h1>Factions</h1>
                    <div class="rule-taper rule-taper--gold"></div>
                </div>
                <div class="page-header-actions">
                    <a th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>
                    <a class="btn btn-primary"
                       th:href="@{/campaigns/{cid}/world/factions/new(cid=${campaignId})}">+ New Faction</a>
                </div>
            </div>
            <th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${factions.empty}" class="empty-state">No factions yet.</div>
            <div th:unless="${factions.empty}" class="card-grid">
                <div th:each="faction : ${factions}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/world/factions/{fid}(cid=${campaignId},fid=${faction.id})}"
                           th:text="${faction.name}">Faction Name</a>
                    </div>
                    <div th:if="${faction.goals}" class="card-body dm-only" th:text="${faction.goals}">Goals</div>
                    <div class="card-footer">
                        <span class="u-text-xs text-muted" th:text="|Resources: ${faction.resources}|">Resources</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
