<div th:fragment="relationshipRow(relationships, campaignId, factionId)" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${relationships.empty}" class="u-text-sm text-muted">No relationships.</div>
    <table th:unless="${relationships.empty}" class="data-table relationship-table">
        <thead>
            <tr>
                <th scope="col">Role</th>
                <th scope="col">Subject</th>
                <th scope="col">Object</th>
                <th scope="col">Knowledge</th>
                <th scope="col">Status</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <!-- Subject and Object name the thing, not its (type, id) pair: raw graph
                 identifiers are an implementation detail, never DM-facing copy (spec 11.7). -->
            <tr th:each="rel : ${relationships}">
                <td><span class="badge" th:text="${#enums.label(rel.kind)}">Role</span></td>
                <td th:with="key=|${rel.fromType}:${rel.fromId}|">
                    <span th:text="${relationshipNames != null and relationshipNames.containsKey(key)
                                     ? relationshipNames.get(key)
                                     : #strings.capitalize(#strings.toLowerCase(rel.fromType))}">Subject</span>
                    <span class="badge badge--neutral u-text-xs"
                          th:text="${#strings.capitalize(#strings.toLowerCase(rel.fromType))}">Type</span>
                </td>
                <td th:with="key=|${rel.toType}:${rel.toId}|">
                    <span th:text="${relationshipNames != null and relationshipNames.containsKey(key)
                                     ? relationshipNames.get(key)
                                     : #strings.capitalize(#strings.toLowerCase(rel.toType))}">Object</span>
                    <span class="badge badge--neutral u-text-xs"
                          th:text="${#strings.capitalize(#strings.toLowerCase(rel.toType))}">Type</span>
                </td>
                <td th:text="${#enums.label(rel.knowledge)}">Knowledge</td>
                <td th:text="${#enums.label(rel.status)}">Status</td>
                <td>
                    <form th:action="@{/campaigns/{cid}/world/factions/{fid}/relationships/{rid}(cid=${campaignId},fid=${factionId},rid=${rel.id})}"
                          method="post" style="display:inline">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger btn-xs action-row__destructive"
                                onclick="return confirm('Delete this relationship?')">&times;</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
