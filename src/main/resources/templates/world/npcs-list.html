<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='NPCs',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='NPCs',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" class="btn btn-primary"
   th:href="@{/campaigns/{cid}/world/npcs/new(cid=${campaignId})}">+ New NPC</a>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
<th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${npcs.empty}" class="empty-state">No NPCs yet.</div>
            <div th:unless="${npcs.empty}" class="card-grid">
                <div th:each="npc : ${npcs}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/world/npcs/{nid}(cid=${campaignId},nid=${npc.id})}"
                           th:text="${npc.name}">NPC Name</a>
                        <span class="badge" th:text="${#enums.label(npc.status)}">STATUS</span>
                    </div>
                    <div th:if="${npc.role}" class="card-body" th:text="${npc.role}">Role</div>
                    <div class="card-footer">
                        <span th:if="${npc.faction != null}" class="u-text-xs text-muted"
                              th:text="|${npc.faction.name}|">Faction</span>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
