<th:block th:fragment="tracker(mode)">

<div x-data="combatTracker({ campaignId: '', trackerMode: '' })"
     th:attr="x-data=|combatTracker({ campaignId: '${campaignId}', trackerMode: '${mode}' })|,
              data-tracker-mode=${mode}"
     x-init="init()"
     @encounter-end-confirmed.window="endEncounter()"
     class="tracker-panel">

    <template x-if="!encounter">
        <div class="empty-state" style="padding: var(--space-lg);">
            <p>No active encounter</p>
            <span class="tracker-empty-hint" style="color: var(--color-text-muted);">Create an encounter to start tracking combat</span>
        </div>
    </template>

    <template x-if="encounter">
        <div style="display: flex; flex-direction: column; height: 100%;">
            <!-- Encounter header -->
            <div class="tracker-header">
                <span class="tracker-heading__name"><h3 data-encounter-name x-text="encounter?.name || 'Combat'"></h3></span>
                <span class="tracker-heading__round">Round <strong class="round-counter" x-ref="roundCounter"
                                    x-text="encounter?.round || 0"></strong></span>
                <span class="badge badge-warning" x-show="pendingWaves.length > 0"
                      x-text="'(' + pendingWaves.length + ' wave' + (pendingWaves.length !== 1 ? 's' : '') + ' pending)'"></span>
                <button class="btn btn-danger action-row__destructive tracker-small-button"
                        data-end-encounter style="padding: 2px 8px;"
                        @click="$dispatch('request-encounter-end')">End</button>
            </div>

            <!-- Initiative setup panel -->
            <section class="initiative-setup"
                     data-initiative-setup
                     x-show="encounter?.combatPhase === 'SETUP'"
                     x-cloak>
                <div class="initiative-setup__header">
                    <div>
                        <strong>Set initiative</strong>
                        <p>Enter party rolls, then roll any remaining NPCs.</p>
                    </div>
                    <button type="button"
                            class="btn btn-ghost btn-xs"
                            data-add-party-to-encounter
                            :disabled="setupBusy || setupSaveCount > 0"
                            @click="addPartyToEncounter()">
                        Add party
                    </button>
                    <button type="button"
                            class="btn btn-ghost btn-xs"
                            data-roll-unset-initiative
                            :disabled="setupBusy || setupSaveCount > 0 || unsetNpcCount === 0"
                            @click="rollUnsetNpcs()">
                        Roll unset NPCs
                    </button>
                </div>

                <ol class="initiative-setup__order" aria-label="Resulting initiative order">
                    <template x-for="(c, index) in combatants" :key="c.id">
                        <li class="initiative-setup__row"
                            :class="{ 'initiative-setup__row--unset': c.initiative == null }">
                            <span class="initiative-setup__position" x-text="index + 1"></span>
                            <span class="initiative-setup__name" x-text="c.name"></span>
                            <span class="badge" x-text="c.kind"></span>
                            <span class="badge"
                                  x-show="waveLabel(c)"
                                  x-text="waveLabel(c)"></span>
                            <span class="badge badge-warning"
                                  x-show="initiativeTies.has(c.initiative)">Tie</span>
                            <input type="number" data-initiative-input
                                   inputmode="numeric"
                                   :value="c.initiative ?? ''"
                                   :aria-label="'Initiative for ' + c.name"
                                   placeholder="Unset"
                                   :disabled="setupBusy || setupSaveCount > 0"
                                   @change="saveSetupInitiative(c.id, $event.target.value)">
                        </li>
                    </template>
                </ol>

                <p class="initiative-setup__tie-help">
                    Ties keep the displayed order: higher tie-breaker first, then prior order, then name.
                    Accepted unset combatants act after resolved initiatives.
                </p>

                <label class="initiative-setup__accept" x-show="unsetCombatants.length > 0">
                    <input type="checkbox" x-model="acceptUnset">
                    Start with <span x-text="unsetCombatants.length"></span> unset
                    <span>— they remain last in the displayed order</span>
                </label>

                <button type="button"
                        class="btn btn-primary"
                        data-action="start-combat"
                        data-start-combat
                        :disabled="setupBusy || setupSaveCount > 0 || !canStartCombat"
                        @click="startCombat()">
                    Start combat
                </button>
            </section>

            <!-- Turn controls -->
            <div class="tracker-turns"
                 data-running-turn-controls
                 x-show="encounter?.combatPhase === 'RUNNING'">
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="previousTurn()"
                        data-action="previous-turn">◀ Prev</button>
                <span class="tracker-turns__active">
                    Active: <strong x-text="activeCombatant?.name || '—'"></strong>
                </span>
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="nextTurn()"
                        data-action="next-turn">Next ▶</button>
            </div>

            <!-- Active threat mechanics card (TRAP/HAZARD turn only) -->
            <div class="active-threat-card threat-mechanics-card"
                 x-show="activeThreatCard"
                 x-cloak
                 data-active-threat-card>
                <div class="detail-meta" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                    <strong x-text="activeThreatCard?.name"></strong>
                    <span class="badge" x-text="activeThreatCard?.kind"></span>
                    <span class="badge" x-show="activeThreatMechanics?.severity"
                          x-text="activeThreatMechanics?.severity"></span>
                </div>

                <!-- Trap mechanics -->
                <template x-if="activeThreatCard?.trap">
                    <div class="u-mt-sm">
                        <div x-show="activeThreatMechanics.triggerDescription">
                            <strong>Trigger</strong>
                            <p x-text="activeThreatMechanics.triggerDescription"></p>
                        </div>
                        <div x-show="activeThreatMechanics.detectionCheck">
                            <strong>Detection</strong>
                            <p>
                                <span x-text="activeThreatMechanics.detectionCheck?.mode"></span>
                                <span x-text="activeThreatMechanics.detectionCheck?.ability"></span>
                                <span x-show="activeThreatMechanics.detectionCheck?.dc"
                                      x-text="'DC ' + activeThreatMechanics.detectionCheck?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Detection' + (activeThreatMechanics.detectionCheck?.dc != null ? ' DC ' + activeThreatMechanics.detectionCheck.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.attackBonus != null">
                            <strong>Attack</strong>
                            <p>
                                <span x-text="signedBonus(activeThreatMechanics.attackBonus)"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20' + signedBonus(activeThreatMechanics.attackBonus), 'Attack ' + signedBonus(activeThreatMechanics.attackBonus))">
                                    Prefill attack
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.save">
                            <strong>Save</strong>
                            <p>
                                <span x-text="activeThreatMechanics.save?.mode"></span>
                                <span x-text="activeThreatMechanics.save?.ability"></span>
                                <span x-show="activeThreatMechanics.save?.dc"
                                      x-text="'DC ' + activeThreatMechanics.save?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Save' + (activeThreatMechanics.save?.dc != null ? ' DC ' + activeThreatMechanics.save.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.damageExpression">
                            <strong>Damage</strong>
                            <p>
                                <span x-text="activeThreatMechanics.damageExpression"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice(activeThreatMechanics.damageExpression, 'Damage ' + activeThreatMechanics.damageExpression)">
                                    Prefill damage
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.additionalEffect">
                            <strong>Additional Effect</strong>
                            <p x-text="activeThreatMechanics.additionalEffect"></p>
                        </div>
                        <template x-if="activeThreatMechanics.disarmMethods && activeThreatMechanics.disarmMethods.length">
                            <div>
                                <strong>Disarm</strong>
                                <ul>
                                    <template x-for="m in activeThreatMechanics.disarmMethods" :key="m.id || m.key || m.label">
                                        <li>
                                            <span x-text="m.label"></span>
                                            <span x-show="m.dc != null" x-text="' (DC ' + m.dc + ')'"></span>
                                            <button type="button" class="btn btn-sm btn-ghost"
                                                    @click="prefillDice('1d20', (m.label || 'Disarm') + (m.dc != null ? ' DC ' + m.dc : ''))">
                                                Prefill 1d20
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Hazard mechanics -->
                <template x-if="activeThreatCard?.hazard">
                    <div class="u-mt-sm">
                        <div x-show="activeThreatMechanics.exposureMode">
                            <strong>Exposure</strong>
                            <p x-text="activeThreatMechanics.exposureMode"></p>
                        </div>
                        <div x-show="activeThreatMechanics.exposureText">
                            <strong>Exposure Details</strong>
                            <p x-text="activeThreatMechanics.exposureText"></p>
                        </div>
                        <div x-show="activeThreatMechanics.check">
                            <strong>Check / Save</strong>
                            <p>
                                <span x-text="activeThreatMechanics.check?.mode"></span>
                                <span x-text="activeThreatMechanics.check?.ability"></span>
                                <span x-show="activeThreatMechanics.check?.dc"
                                      x-text="'DC ' + activeThreatMechanics.check?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Check/Save' + (activeThreatMechanics.check?.dc != null ? ' DC ' + activeThreatMechanics.check.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.damageExpression">
                            <strong>Damage</strong>
                            <p>
                                <span x-text="activeThreatMechanics.damageExpression"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice(activeThreatMechanics.damageExpression, 'Damage ' + activeThreatMechanics.damageExpression)">
                                    Prefill damage
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.escalationText">
                            <strong>Escalation</strong>
                            <p x-text="activeThreatMechanics.escalationText"></p>
                        </div>
                        <div x-show="activeThreatMechanics.endingConditions">
                            <strong>Ending Conditions</strong>
                            <p x-text="activeThreatMechanics.endingConditions"></p>
                        </div>
                    </div>
                </template>
                <p class="text-muted u-text-sm u-mt-xs">
                    Prefills only — log damage/conditions with the existing tracker controls.
                </p>
                <!-- Focused mode: expanded mechanics -->
                <div class="focused-mechanics" x-show="trackerMode === 'FOCUSED' && activeThreatCard"
                     x-cloak>
                    <template x-if="activeThreatCard?.trap">
                        <div class="u-mt-sm">
                            <div x-show="activeThreatMechanics?.initiativeBonus != null">
                                <strong>Initiative Bonus</strong>
                                <span x-text="signedBonus(activeThreatMechanics.initiativeBonus)"></span>
                            </div>
                            <div x-show="activeThreatMechanics?.stealthBonus != null">
                                <strong>Stealth Modifier</strong>
                                <span x-text="signedBonus(activeThreatMechanics.stealthBonus)"></span>
                            </div>
                            <div x-show="activeThreatMechanics?.resetDescription">
                                <strong>Reset</strong>
                                <p x-text="activeThreatMechanics.resetDescription"></p>
                            </div>
                            <div x-show="activeThreatMechanics?.countermeasures && activeThreatMechanics.countermeasures.length">
                                <strong>Countermeasures</strong>
                                <template x-for="cm in activeThreatMechanics.countermeasures" :key="cm.label || cm.key">
                                    <div class="u-text-xs">
                                        <span x-text="cm.label"></span>
                                        <span x-show="cm.dc != null" x-text="' (DC ' + cm.dc + ')'"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="activeThreatCard?.hazard">
                        <div class="u-mt-sm">
                            <div x-show="activeThreatMechanics?.duration">
                                <strong>Duration</strong>
                                <span x-text="activeThreatMechanics.duration"></span>
                            </div>
                            <div x-show="activeThreatMechanics?.initiativeBehavior">
                                <strong>Initiative</strong>
                                <span x-text="activeThreatMechanics.initiativeBehavior"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Recharge banner -->
            <div class="recharge-banner" x-show="rechargePrompts.length > 0">
                <template x-for="prompt in rechargePrompts" :key="prompt.abilityName">
                    <div class="recharge-prompt">
                        <span>🔄 <strong x-text="prompt.abilityName"></strong></span>
                        <button class="btn" @click="resolveRecharge(activeCombatantId, prompt.abilityName, Math.floor(Math.random() * (prompt.maxRoll || 6)) + 1)">Roll d<span x-text="prompt.maxRoll || 6"></span></button>
                        <button class="btn" @click="resolveRecharge(activeCombatantId, prompt.abilityName, null)">Skip</button>
                    </div>
                </template>
            </div>

            <!-- Wave banner -->
            <div class="wave-banner" x-show="pendingWaves.length > 0" style="background: var(--color-warning); padding: 8px 12px; border-radius: 4px; margin: 8px 0;">
                <template x-for="wave in pendingWaves" :key="wave.id">
                    <div style="display: flex; align-items: center; gap: 8px; margin: 4px 0;">
                        <span style="color: var(--color-bg); font-weight: 600;" x-text="'Wave ready: ' + wave.name"></span>
                        <span class="text-muted" x-text="wave.triggerKind + (wave.triggerValue ? ' @ ' + wave.triggerValue : '')"></span>
                        <span class="text-muted" x-text="wave.combatantCount + ' combatants'"></span>
                        <button class="btn btn-sm btn-warning" @click="spawnWave(wave.id)">Spawn</button>
                    </div>
                </template>
                <div x-show="spawnError" class="u-text-danger" x-text="spawnError"></div>
            </div>

            <!-- Add combatant -->
            <details class="tracker-add" x-show="encounter?.combatPhase === 'RUNNING'">
                <summary>Add combatant</summary>
                <form @submit.prevent="quickAdd()" class="tracker-add-form">
                    <input type="text" x-model="addForm.name" placeholder="Name" required>
                    <input type="number" x-model="addForm.maxHp" placeholder="HP" min="1">
                    <select x-model="addForm.kind">
                        <option value="NPC">NPC</option>
                        <option value="MONSTER">Monster</option>
                        <option value="PC">PC</option>
                    </select>
                    <button class="btn btn-sm" type="submit">Add</button>
                </form>
                <button class="btn btn-ghost btn-sm" @click="addMissingParty()">Add missing party members</button>
            </details>

            <!-- Initiative list -->
            <div class="tracker-list">
                <div class="turn-marker" x-ref="turnMarker" aria-hidden="true"></div>
                <template x-for="(c, idx) in combatants" :key="c.id">
                    <div class="combatant-row"
                         :data-cid="c.id"
                         :class="{ active: c.id === activeCombatantId, defeated: c.defeated, hidden: c.hidden, bloodied: c.bloodied }"
                         x-show="!c.hidden"
                         @click="selectCombatant(c.id)">
                        <!-- Initiative badge -->
                        <span class="init-badge" x-text="c.initiative ?? '—'"></span>

                        <!-- Name + group indicator -->
                        <span class="combatant-name">
                            <template x-if="c.groupId && !c.groupLeader"><span class="group-branch">├ </span></template>
                            <span x-text="c.name"></span>
                            <template x-if="c.groupId && c.groupLeader">
                                <span class="group-count" x-text="'(' + groupCount(c.groupId) + ')'"></span>
                            </template>
                        </span>

                        <!-- Numeric HP — DM only, and the number the log will agree with -->
                        <span class="combatant-hp u-num" x-text="hpLabel(c)"></span>

                        <!-- HP bar mini -- DM only -->
                        <div class="hp-mini">
                            <div class="hp-mini-fill"
                                 :style="{ width: hpPercent(c) + '%' }"
                                 :class="{ bloodied: c.bloodied, dead: c.defeated }"></div>
                        </div>

                        <!-- HP delta quick-entry -- DM only -->
                        <input type="text" class="hp-delta-input"
                               placeholder="±HP"
                               @keydown.enter="applyHpDelta(c.id)"
                               x-model="hpDelta">

                        <!-- Condition icons (always visible) -->
                        <div class="condition-icons">
                            <template x-for="cond in c.conditions" :key="cond.sourceKey">
                                <span class="cond-icon"
                                      :style="{ background: conditionColor(cond.sourceKey) }"
                                      :title="getConditionText(cond.sourceKey)"
                                      x-text="cond.durationRounds > 0 ? cond.durationRounds : '∞'"></span>
                            </template>
                            <button class="btn btn-ghost tracker-small-button" style="padding: 0 2px; line-height: 1;"
                                    @click.stop="openConditionMenu(c.id)">＋</button>
                        </div>

                        <!-- Concentration badge -->
                        <span x-show="c.concentratingOn" class="conc-badge"
                              :title="c.concentratingOn">⏀</span>
                    </div>
                </template>

                <!-- Lair action slot (initiative 20) -->
                <div class="lair-action-row" x-show="lairActionRowVisible">
                    <span class="init-badge lair-init">20</span>
                    <span class="combatant-name" x-text="encounter?.lairActionName || 'Lair Action'"></span>
                    <span class="tracker-lair-status" style="color: var(--color-text-muted); margin-left: auto;"
                          x-show="!encounter?.lairActionAvailable">✓ this round</span>
                    <button class="btn btn-ghost tracker-small-button" style="padding: 1px 6px;"
                            x-show="encounter?.lairActionAvailable"
                            @click="activateLairAction()">Activate</button>
                </div>
            </div>

            <!-- Selected combatant detail — DM only -->
            <div class="combatant-detail" x-show="selectedCombatantId && selected" x-effect="tickNumber($refs.hpDisplay, selected?.currentHp || 0, 300)">
                <!-- HP section -->
                <div class="detail-hp">
                    <label>HP</label>
                    <input type="number" x-model.number="editHp" @change="setHp()">
                    <span class="hp-display" x-ref="hpDisplay" x-text="selected?.currentHp || 0"></span>
                    <span>/</span>
                    <span x-text="selected?.maxHp || '?'"></span>
                    <template x-if="selected?.tempHp > 0">
                        <span class="tracker-temp-hp" style="color: var(--color-warning);">+<span x-text="selected.tempHp"></span> temp</span>
                    </template>
                    <span class="hp-flag bloodied" x-show="selected?.bloodied">Bloodied</span>
                    <span class="hp-flag dead" x-show="selected?.defeated">Defeated</span>
                </div>

                <!-- Quick math buttons -->
                <div class="hp-quick">
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -5)">-5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -1)">-1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 1)">+1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 5)">+5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, (selected.maxHp - selected.currentHp))">Max</button>
                </div>

                <!-- Statblock link -->
                <div class="detail-statblock-link" style="margin: var(--space-sm) 0;">
                    <button class="btn btn-ghost btn-sm"
                            x-show="selected?.statblockId"
                            @click="showStatblock(selected.id)">
                        Statblock
                    </button>
                </div>

                <!-- Conditions panel -->
                <div class="detail-conditions" x-data="{ condFilter: '', commonKeys: ['prone','grappled','restrained','frightened','poisoned','unconscious'] }">
                    <h4>Conditions</h4>
                    <div class="condition-quick" style="display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px;">
                        <template x-for="key in commonKeys" :key="key">
                            <button class="btn btn-xs"
                                    :class="hasCondition(selected, key) ? 'is-active' : 'btn-ghost'"
                                    @click="toggleCondition(selected.id, key, 1)"
                                    x-text="key.charAt(0).toUpperCase() + key.slice(1)"></button>
                        </template>
                    </div>
                    <input type="search" class="form-input" x-model="condFilter"
                           placeholder="Filter conditions..." style="margin-bottom: 4px;">
                    <template x-for="cond in conditionsCatalog.filter(c => !condFilter || c.name.toLowerCase().includes(condFilter.toLowerCase()))" :key="cond.sourceKey">
                        <label class="condition-toggle">
                            <input type="checkbox"
                                   :checked="hasCondition(selected, cond.sourceKey)"
                                   @change="toggleCondition(selected.id, cond.sourceKey, cond.defaultDuration || 1)">
                            <span x-text="cond.name"></span>
                            <span class="cond-help" :title="cond.description" style="cursor: help; color: var(--color-text-muted);">ⓘ</span>
                        </label>
                    </template>
                </div>

                <!-- Concentration -->
                <div class="detail-concentration" x-show="selected?.concentratingOn || selected?.concentrationCheckPending">
                    <template x-if="selected?.concentratingOn">
                        <div class="tracker-concentration" style="margin-bottom: var(--space-xs);">
                            Concentrating: <strong x-text="selected.concentratingOn"></strong>
                            <button class="btn btn-ghost tracker-small-button" style="padding: 1px 6px;" @click="setConcentration(selected.id, null)">Drop</button>
                        </div>
                    </template>
                    <template x-if="selected?.concentrationCheckPending">
                        <div class="conc-check" style="background: rgba(155, 89, 182, 0.15); padding: var(--space-xs); border-radius: 4px; margin-bottom: var(--space-xs);">
                            <span class="tracker-concentration-check">Concentration check!</span>
                            <button class="btn tracker-small-button" style="padding: 1px 6px;" @click="resolveConcentrationCheck(selected.id, true)">Passed</button>
                            <button class="btn tracker-small-button" style="padding: 1px 6px;" @click="resolveConcentrationCheck(selected.id, false)">Failed</button>
                        </div>
                    </template>
                </div>

                <!-- Legendary section -->
                <div class="detail-legendary" x-show="(selected?.legendaryActionsMax || 0) > 0">
                    <h4 class="tracker-legendary" style="margin: var(--space-xs) 0; color: var(--color-text-muted);">Legendary</h4>
                    <div class="tracker-legendary" style="margin-bottom: 2px;">
                        Actions: <span x-text="selected?.legendaryActionsUsed || 0"></span> / <span x-text="selected?.legendaryActionsMax || 0"></span>
                        <button class="btn btn-ghost tracker-small-button" style="padding: 1px 6px;" @click="useLegendaryAction(selected.id)">Use</button>
                    </div>
                    <div class="tracker-legendary">
                        Resistances: <span x-text="selected?.legendaryResistancesUsed || 0"></span> / <span x-text="selected?.legendaryResistancesMax || 0"></span>
                        <button class="btn btn-ghost tracker-small-button" style="padding: 1px 6px;" @click="useLegendaryResistance(selected.id)">Use</button>
                    </div>
                </div>

                <!-- Focused mode: expanded statblock -->
                <div class="detail-focused-statblock" x-show="trackerMode === 'FOCUSED'">
                    <h4>Statblock</h4>
                    <div class="tracker-statblock-loading" x-show="focusedStatblockLoading" style="color: var(--color-text-muted);">Loading...</div>
                    <template x-if="!focusedStatblockLoading && focusedStatblock">
                      <div class="tracker-statblock">
                        <div x-show="focusedStatblock.size" class="u-text-xs">
                            <span>Size: </span><span x-text="focusedStatblock.size"></span>
                        </div>
                        <div x-show="focusedStatblock.type" class="u-text-xs">
                            <span>Type: </span><span x-text="focusedStatblock.type"></span>
                        </div>
                        <div x-show="focusedStatblock.armorClass" class="u-text-xs">
                            <span>AC: </span><span x-text="focusedStatblock.armorClass"></span>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.abilityScores">
                            <strong class="u-text-xs">Abilities</strong>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
                                <template x-for="(score, key) in focusedStatblock.abilityScores" :key="key">
                                    <span class="badge tracker-statblock-badge" x-text="key.toUpperCase() + ' ' + score"></span>
                                </template>
                            </div>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.savingThrows && focusedStatblock.savingThrows.length">
                            <strong class="u-text-xs">Saving Throws</strong>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
                                <template x-for="st in focusedStatblock.savingThrows" :key="st.ability">
                                    <span class="badge tracker-statblock-badge" x-text="st.ability.toUpperCase() + ' +' + st.modifier"></span>
                                </template>
                            </div>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.skills && focusedStatblock.skills.length">
                            <strong class="u-text-xs">Skills</strong>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
                                <template x-for="skill in focusedStatblock.skills" :key="skill.name">
                                    <span class="badge tracker-statblock-badge" x-text="skill.name + ' +' + skill.modifier"></span>
                                </template>
                            </div>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.speed">
                            <span class="u-text-xs">Speed: </span><span class="u-text-xs" x-text="focusedStatblock.speed"></span>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.senses">
                            <span class="u-text-xs">Senses: </span><span class="u-text-xs" x-text="focusedStatblock.senses"></span>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.languages">
                            <span class="u-text-xs">Languages: </span><span class="u-text-xs" x-text="focusedStatblock.languages"></span>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.traits && focusedStatblock.traits.length">
                            <strong class="u-text-xs">Traits</strong>
                            <template x-for="trait in focusedStatblock.traits" :key="trait.name">
                                <div style="margin-top: 2px;">
                                    <span class="u-text-xs" style="font-weight: 600;" x-text="trait.name + '.'"></span>
                                    <span class="u-text-xs" x-text="trait.description"></span>
                                </div>
                            </template>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.actions && focusedStatblock.actions.length">
                            <strong class="u-text-xs">Actions</strong>
                            <template x-for="action in focusedStatblock.actions" :key="action.name">
                                <div style="margin-top: 2px;">
                                    <span class="u-text-xs" style="font-weight: 600;" x-text="action.name + '.'"></span>
                                    <span class="u-text-xs" x-text="action.description"></span>
                                    <span class="badge tracker-statblock-badge"
                                          x-show="action.attackBonus != null"
                                          x-text="'Atk +' + action.attackBonus"></span>
                                    <span class="badge tracker-statblock-badge"
                                          x-show="action.damageExpression"
                                          x-text="action.damageExpression"></span>
                                    <button type="button" class="btn btn-sm btn-ghost tracker-statblock-badge"
                                            style="padding: 0 4px;"
                                            x-show="action.damageExpression"
                                            @click="prefillDice(action.damageExpression, action.name + ' damage')">
                                        Prefill
                                    </button>
                                </div>
                            </template>
                        </div>
                        <div class="u-mt-xs" x-show="focusedStatblock.spellcasting && focusedStatblock.spellcasting.length">
                            <strong class="u-text-xs">Spellcasting</strong>
                            <template x-for="spellEntry in focusedStatblock.spellcasting" :key="spellEntry.description || spellEntry.ability">
                                <div style="margin-top: 2px;">
                                    <span class="u-text-xs" x-text="spellEntry.description"></span>
                                </div>
                            </template>
                        </div>
                      </div>
                    </template>
                    <div x-show="!focusedStatblockLoading && !focusedStatblock && selected?.statBlockId" class="u-text-xs text-muted">
                        Statblock unavailable
                    </div>
                </div>

                <!-- Defeat / Revive / Remove -->
                <div class="detail-actions" style="display: flex; gap: var(--space-xs); margin-top: var(--space-sm);">
                    <button class="btn btn-danger action-row__destructive tracker-standard-button" style="padding: 2px 8px;"
                            x-show="!selected?.defeated"
                            @click="markDefeated(selected.id, true)">Defeat</button>
                    <button class="btn tracker-standard-button" style="padding: 2px 8px;"
                            x-show="selected?.defeated"
                            @click="markDefeated(selected.id, false)">Revive</button>
                    <button class="btn btn-danger action-row__destructive tracker-standard-button" style="padding: 2px 8px;"
                            @click="removeCombatant(selected.id)">Remove</button>
                </div>
            </div>

            <!-- Footer: Undo -->
            <div class="tracker-footer">
                <button class="btn btn-ghost tracker-standard-button" style="padding: 2px 8px;"
                        @click="undo()"
                        :disabled="!canUndo">↩ Undo</button>
                <span class="tracker-footer-count" style="color: var(--color-text-muted); margin-left: auto;" x-text="combatants.length + ' combatants'"></span>
            </div>
        </div>
    </template>
</div>
</th:block>
