<th:block th:fragment="tracker">
<script th:inline="javascript">
    /* Condition colors for icon dots */
    const CONDITION_COLORS = {
        blinded: '#95a5a6', charmed: '#e91e63', deafened: '#607d8b',
        exhaustion: '#795548', frightened: '#9c27b0', grappled: '#ff5722',
        incapacitated: '#9e9e9e', invisible: '#00bcd4', paralyzed: '#ff9800',
        petrified: '#8d6e63', poisoned: '#4caf50', prone: '#2196f3',
        restrained: '#ffeb3b', stunned: '#ff5722', unconscious: '#f44336',
        concentration: '#9b59b6',
    };

    /* Hardcoded common conditions (fallback if API unavailable) */
    const COMMON_CONDITIONS = [
        { sourceKey: 'blinded', name: 'Blinded', description: 'A blinded creature can\'t see and automatically fails ability checks that require sight.', defaultDuration: 1 },
        { sourceKey: 'charmed', name: 'Charmed', description: 'A charmed creature can\'t attack the charmer and has advantage on social interactions.', defaultDuration: 1 },
        { sourceKey: 'deafened', name: 'Deafened', description: 'A deafened creature can\'t hear and automatically fails ability checks that require hearing.', defaultDuration: 1 },
        { sourceKey: 'frightened', name: 'Frightened', description: 'A frightened creature has disadvantage on ability checks and attacks while the source is visible.', defaultDuration: 1 },
        { sourceKey: 'grappled', name: 'Grappled', description: 'A grappled creature\'s speed becomes 0.', defaultDuration: 1 },
        { sourceKey: 'incapacitated', name: 'Incapacitated', description: 'An incapacitated creature can\'t take actions or reactions.', defaultDuration: 1 },
        { sourceKey: 'invisible', name: 'Invisible', description: 'An invisible creature is impossible to see without magical aid.', defaultDuration: 1 },
        { sourceKey: 'paralyzed', name: 'Paralyzed', description: 'A paralyzed creature is incapacitated and can\'t move or speak.', defaultDuration: 1 },
        { sourceKey: 'petrified', name: 'Petrified', description: 'A petrified creature is turned to stone and is incapacitated.', defaultDuration: 1 },
        { sourceKey: 'poisoned', name: 'Poisoned', description: 'A poisoned creature has disadvantage on attack rolls and ability checks.', defaultDuration: 1 },
        { sourceKey: 'prone', name: 'Prone', description: 'A prone creature\'s only movement option is crawling.', defaultDuration: 1 },
        { sourceKey: 'restrained', name: 'Restrained', description: 'A restrained creature\'s speed becomes 0 and attacks against it have advantage.', defaultDuration: 1 },
        { sourceKey: 'stunned', name: 'Stunned', description: 'A stunned creature is incapacitated, can\'t move, and speaks falteringly.', defaultDuration: 1 },
        { sourceKey: 'unconscious', name: 'Unconscious', description: 'An unconscious creature is incapacitated, can\'t move or speak, and is unaware.', defaultDuration: 1 },
    ];

    function combatTracker(options = {}) {
        return {
            encounter: null,
            combatants: [],
            activeCombatantId: null,
            selectedCombatantId: null,
            editHp: '',
            editTempHp: 0,
            hpDelta: '',
            dmMode: true,
            lairActionUsedThisRound: false,
            rechargePrompts: [],
            rechargeRolls: {},
            conditionsCatalog: [],
            showConditionMenu: null,
            conditionDuration: '',

            campaignId: options.campaignId || '',
            _encounterId: null,

            get activeCombatant() {
                if (this.encounter && this.encounter.activeTurnIndex >= 0 &&
                    this.encounter.activeTurnIndex < this.combatants.length) {
                    return this.combatants[this.encounter.activeTurnIndex];
                }
                return null;
            },

            get selected() {
                return this.combatants.find(c => c.id === this.selectedCombatantId) || null;
            },

            get canUndo() {
                return this._encounterId != null && this.combatants.length > 0;
            },

            get lairActionRowVisible() {
                return this.encounter?.lairActionName != null;
            },

            async init() {
                window.addEventListener('dm-mode-changed', (e) => {
                    this.dmMode = e.detail.dmMode;
                });
                window.addEventListener('battle-tokenselect', (e) => {
                    const token = e.detail.token;
                    if (token) {
                        const combatant = this.combatants.find(c => c.tokenId === token.id);
                        if (combatant) this.selectCombatant(combatant.id);
                    }
                });
                this.loadConditionsCatalog();
                if (this.campaignId) {
                    await this.loadActiveEncounter();
                }
            },

            loadConditionsCatalog() {
                this.conditionsCatalog = COMMON_CONDITIONS;
            },

            async loadActiveEncounter() {
                try {
                    const resp = await fetch(`/api/v1/campaigns/${this.campaignId}/encounters/active`);
                    if (resp.ok) {
                        const data = await resp.json();
                        await this.loadEncounter(data.id);
                    }
                } catch (e) {}
            },

            async loadEncounter(encounterId) {
                this._encounterId = encounterId;
                try {
                    const resp = await fetch(`/api/v1/encounters/${encounterId}`);
                    if (resp.ok) {
                        this.encounter = await resp.json();
                        await this.reloadCombatants();
                        this.dispatchState();
                        this.dispatchTurnEvent();
                    }
                } catch (e) {}
            },

            async reloadCombatants() {
                if (!this._encounterId) return;
                try {
                    const resp = await fetch(`/api/v1/encounters/${this._encounterId}/combatants`);
                    if (resp.ok) {
                        this.combatants = await resp.json();
                        this.deriveActiveCombatant();
                        if (this.selected) {
                            this.editHp = this.selected.currentHp;
                            this.editTempHp = this.selected.tempHp || 0;
                        }
                    }
                } catch (e) {}
            },

            deriveActiveCombatant() {
                if (this.encounter && this.encounter.activeTurnIndex >= 0 &&
                    this.encounter.activeTurnIndex < this.combatants.length) {
                    this.activeCombatantId = this.combatants[this.encounter.activeTurnIndex].id;
                } else {
                    this.activeCombatantId = null;
                }
            },

            async nextTurn() {
                if (!this._encounterId) return;
                const prevRound = this.encounter?.round || 0;
                try {
                    const resp = await fetch(`/api/v1/encounters/${this._encounterId}/next-turn`, { method: 'POST' });
                    if (resp.ok) {
                        this.encounter = await resp.json();
                        await this.reloadCombatants();
                        if (this.encounter.round > prevRound) {
                            this.lairActionUsedThisRound = false;
                        }
                        if (this.encounter.rechargePrompts) {
                            this.rechargePrompts = this.encounter.rechargePrompts;
                        }
                        this.dispatchTurnEvent();
                        this.dispatchState();
                    }
                } catch (e) {}
            },

            async previousTurn() {
                if (!this._encounterId) return;
                try {
                    const resp = await fetch(`/api/v1/encounters/${this._encounterId}/previous-turn`, { method: 'POST' });
                    if (resp.ok) {
                        this.encounter = await resp.json();
                        await this.reloadCombatants();
                        this.dispatchTurnEvent();
                        this.dispatchState();
                    }
                } catch (e) {}
            },

            async setInitiative(combatantId, init) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/initiative`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initiative: init }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async autoRoll() {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/encounters/${this._encounterId}/auto-roll`, { method: 'POST' });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async applyHpDelta(combatantId) {
                const amount = parseInt(this.hpDelta, 10);
                if (isNaN(amount) || amount === 0) return;
                this.hpDelta = '';
                await this.quickHp(combatantId, amount);
            },

            async quickHp(combatantId, amount) {
                if (!this._encounterId) return;
                try {
                    const resp = await fetch(`/api/v1/combatants/${combatantId}/damage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount }),
                    });
                    if (resp.ok) {
                        await this.reloadCombatants();
                        this.dispatchState();
                    }
                } catch (e) {}
            },

            async markDefeated(combatantId, defeated) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/defeated`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ defeated }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async toggleCondition(combatantId, sourceKey, duration) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/conditions`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sourceKey, durationRounds: duration || 1 }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async removeCondition(combatantId, sourceKey) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/conditions/${sourceKey}/remove`, {
                        method: 'POST',
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async setHp() {
                if (!this.selected || !this._encounterId) return;
                const hp = parseInt(this.editHp, 10);
                if (isNaN(hp)) return;
                try {
                    await fetch(`/api/v1/combatants/${this.selected.id}/hp`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ currentHp: hp, tempHp: this.editTempHp }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async removeCombatant(combatantId) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}`, { method: 'DELETE' });
                    if (this.selectedCombatantId === combatantId) {
                        this.selectedCombatantId = null;
                    }
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async activateLairAction() {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/encounters/${this._encounterId}/lair-action`, { method: 'POST' });
                    this.lairActionUsedThisRound = true;
                } catch (e) {}
            },

            async undo() {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/encounters/${this._encounterId}/undo`, { method: 'POST' });
                    await this.loadEncounter(this._encounterId);
                } catch (e) {}
            },

            async endEncounter() {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/encounters/${this._encounterId}/end`, { method: 'POST' });
                    this.encounter = null;
                    this.combatants = [];
                    this.activeCombatantId = null;
                    this.selectedCombatantId = null;
                    this._encounterId = null;
                    this.dispatchState();
                } catch (e) {}
            },

            hpPercent(c) {
                if (!c || !c.maxHp || c.maxHp <= 0) return 0;
                return Math.max(0, Math.min(100, (c.currentHp / c.maxHp) * 100));
            },

            conditionColor(sourceKey) {
                return CONDITION_COLORS[sourceKey] || '#7b68ee';
            },

            selectCombatant(id) {
                this.selectedCombatantId = id;
                this.showConditionMenu = null;
                if (this.selected) {
                    this.editHp = this.selected.currentHp;
                    this.editTempHp = this.selected.tempHp || 0;
                }
            },

            openConditionMenu(id) {
                this.showConditionMenu = this.showConditionMenu === id ? null : id;
                this.conditionDuration = '';
            },

            hasCondition(combatant, sourceKey) {
                return combatant?.conditions?.some(c => c.sourceKey === sourceKey) || false;
            },

            getConditionText(sourceKey) {
                const cond = this.conditionsCatalog.find(c => c.sourceKey === sourceKey);
                return cond ? `${cond.name}: ${cond.description}` : sourceKey;
            },

            groupCount(groupId) {
                return this.combatants.filter(c => c.groupId === groupId).length;
            },

            async setConcentration(combatantId, spellName) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/concentration`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ spellName: spellName || null }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async resolveConcentrationCheck(combatantId, passed) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/concentration-check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ passed }),
                    });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async useLegendaryAction(combatantId) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/legendary-action`, { method: 'POST' });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async useLegendaryResistance(combatantId) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/legendary-resistance`, { method: 'POST' });
                    await this.reloadCombatants();
                    this.dispatchState();
                } catch (e) {}
            },

            async resolveRecharge(combatantId, abilityName, rollResult) {
                if (!this._encounterId) return;
                try {
                    await fetch(`/api/v1/combatants/${combatantId}/recharge-check`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ abilityName, rollResult }),
                    });
                    this.rechargePrompts = this.rechargePrompts.filter(p => p.abilityName !== abilityName);
                } catch (e) {}
            },

            dispatchState() {
                window.dispatchEvent(new CustomEvent('tracker-encounter-state', {
                    detail: { encounter: this.encounter, combatants: this.combatants }
                }));
            },

            dispatchTurnEvent() {
                if (this.activeCombatantId) {
                    window.dispatchEvent(new CustomEvent('tracker-active-turn', {
                        detail: { combatantId: this.activeCombatantId }
                    }));
                }
            },
        };
    }
</script>

<div x-data="combatTracker({ campaignId: /*[[${campaignId}]]*/ '' })"
     x-init="init()"
     class="tracker-panel">

    <template x-if="!encounter">
        <div class="empty-state" style="padding: var(--space-lg);">
            <p>No active encounter</p>
            <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Create an encounter to start tracking combat</span>
        </div>
    </template>

    <template x-if="encounter">
        <div style="display: flex; flex-direction: column; height: 100%;">
            <!-- Encounter header -->
            <div class="tracker-header">
                <h3 x-text="encounter?.name || 'Combat'"></h3>
                <span>Round <strong x-text="encounter?.round || 0"></strong></span>
                <button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" @click="endEncounter()">End</button>
            </div>

            <!-- Turn controls -->
            <div class="tracker-turns">
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="previousTurn()">◀ Prev</button>
                <span style="font-size: var(--text-sm);">
                    Active: <strong x-text="activeCombatant?.name || '—'"></strong>
                </span>
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="nextTurn()">Next ▶</button>
                <button class="btn btn-ghost" style="padding: 2px 8px;"
                        x-show="encounter?.lairActionName"
                        @click="activateLairAction()">Lair</button>
            </div>

            <!-- Recharge banner -->
            <div class="recharge-banner" x-show="rechargePrompts.length > 0">
                <template x-for="prompt in rechargePrompts" :key="prompt.abilityName">
                    <div class="recharge-prompt">
                        <span>🔄 <strong x-text="prompt.abilityName"></strong></span>
                        <input type="number" class="recharge-roll-input"
                               :placeholder="'d' + (prompt.maxRoll || 6)"
                               x-model="rechargeRolls[prompt.abilityName]"
                               @keydown.enter="resolveRecharge(activeCombatantId, prompt.abilityName, parseInt(rechargeRolls[prompt.abilityName]) || null)">
                        <button @click="resolveRecharge(activeCombatantId, prompt.abilityName, parseInt(rechargeRolls[prompt.abilityName]) || null)">Roll</button>
                        <button @click="resolveRecharge(activeCombatantId, prompt.abilityName, null)">Skip</button>
                    </div>
                </template>
            </div>

            <!-- Initiative list -->
            <div class="tracker-list">
                <template x-for="(c, idx) in combatants" :key="c.id">
                    <div class="combatant-row"
                         :class="{ active: c.id === activeCombatantId, defeated: c.defeated, hidden: c.hidden }"
                         x-show="dmMode || !c.hidden"
                         @click="selectCombatant(c.id)">
                        <!-- Initiative badge -->
                        <span class="init-badge" x-text="c.initiative || '—'"></span>

                        <!-- Name + group indicator -->
                        <span class="combatant-name">
                            <template x-if="c.groupId && !c.groupLeader">├ </template>
                            <span x-text="c.name"></span>
                            <template x-if="c.groupId && c.groupLeader">
                                <span class="group-count" style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: 2px;" x-text="'(' + groupCount(c.groupId) + ')'"></span>
                            </template>
                        </span>

                        <!-- HP bar mini — DM only -->
                        <div class="hp-mini" x-show="dmMode">
                            <div class="hp-mini-fill"
                                 :style="{ width: hpPercent(c) + '%' }"
                                 :class="{ bloodied: c.bloodied, dead: c.defeated }"></div>
                        </div>

                        <!-- HP delta quick-entry — DM only -->
                        <input type="text" class="hp-delta-input"
                               placeholder="±HP"
                               x-show="dmMode"
                               @keydown.enter="applyHpDelta(c.id)"
                               x-model="hpDelta">

                        <!-- Condition icons (always visible) -->
                        <div class="condition-icons">
                            <template x-for="cond in c.conditions" :key="cond.sourceKey">
                                <span class="cond-icon"
                                      :style="{ background: conditionColor(cond.sourceKey) }"
                                      :title="getConditionText(cond.sourceKey)"
                                      x-text="cond.durationRounds > 0 ? cond.durationRounds : '∞'"></span>
                            </template>
                            <button class="btn btn-ghost" style="padding: 0 2px; font-size: 0.7rem; line-height: 1;"
                                    x-show="dmMode"
                                    @click.stop="openConditionMenu(c.id)">＋</button>
                        </div>

                        <!-- Concentration badge -->
                        <span x-show="c.concentratingOn" class="conc-badge"
                              :title="dmMode ? c.concentratingOn : 'Concentrating'">⏀</span>
                    </div>
                </template>

                <!-- Lair action virtual row -->
                <div class="lair-action-row" x-show="lairActionRowVisible">
                    <span class="init-badge lair-init">20</span>
                    <span class="combatant-name" x-text="encounter?.lairActionName || 'Lair Action'"></span>
                    <span style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: auto;"
                          x-show="lairActionUsedThisRound">✓ this round</span>
                    <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.75rem;"
                            x-show="!lairActionUsedThisRound"
                            @click="activateLairAction()">Activate</button>
                </div>
            </div>

            <!-- Selected combatant detail — DM only -->
            <div class="combatant-detail" x-show="selectedCombatantId && dmMode && selected">
                <!-- HP section -->
                <div class="detail-hp">
                    <label>HP</label>
                    <input type="number" x-model.number="editHp" @change="setHp()">
                    <span>/</span>
                    <span x-text="selected?.maxHp || '?'"></span>
                    <template x-if="selected?.tempHp > 0">
                        <span style="font-size: 0.7rem; color: var(--color-warning);">+<span x-text="selected.tempHp"></span> temp</span>
                    </template>
                    <span class="hp-flag bloodied" x-show="selected?.bloodied">Bloodied</span>
                    <span class="hp-flag dead" x-show="selected?.defeated">Defeated</span>
                </div>

                <!-- Quick math buttons -->
                <div class="hp-quick">
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -5)">-5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -1)">-1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 1)">+1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 5)">+5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, (selected.maxHp - selected.currentHp))">Max</button>
                </div>

                <!-- Conditions panel -->
                <div class="detail-conditions">
                    <h4>Conditions</h4>
                    <template x-for="cond in conditionsCatalog" :key="cond.sourceKey">
                        <label class="condition-toggle">
                            <input type="checkbox"
                                   :checked="hasCondition(selected, cond.sourceKey)"
                                   @change="toggleCondition(selected.id, cond.sourceKey, cond.defaultDuration || 1)">
                            <span x-text="cond.name"></span>
                            <span class="cond-help" :title="cond.description" style="cursor: help; color: var(--color-text-muted);">ⓘ</span>
                        </label>
                    </template>
                </div>

                <!-- Concentration -->
                <div class="detail-concentration" x-show="selected?.concentratingOn || selected?.concentrationCheckPending">
                    <template x-if="selected?.concentratingOn">
                        <div style="margin-bottom: var(--space-xs); font-size: var(--text-sm);">
                            Concentrating: <strong x-text="selected.concentratingOn"></strong>
                            <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="setConcentration(selected.id, null)">Drop</button>
                        </div>
                    </template>
                    <template x-if="selected?.concentrationCheckPending">
                        <div class="conc-check" style="background: rgba(155, 89, 182, 0.15); padding: var(--space-xs); border-radius: 4px; margin-bottom: var(--space-xs);">
                            <span style="font-size: var(--text-sm);">Concentration check!</span>
                            <button class="btn" style="padding: 1px 6px; font-size: 0.7rem;" @click="resolveConcentrationCheck(selected.id, true)">Passed</button>
                            <button class="btn" style="padding: 1px 6px; font-size: 0.7rem;" @click="resolveConcentrationCheck(selected.id, false)">Failed</button>
                        </div>
                    </template>
                </div>

                <!-- Legendary section -->
                <div class="detail-legendary" x-show="(selected?.legendaryActionsMax || 0) > 0">
                    <h4 style="margin: var(--space-xs) 0; font-size: var(--text-sm); color: var(--color-text-muted);">Legendary</h4>
                    <div style="font-size: var(--text-sm); margin-bottom: 2px;">
                        Actions: <span x-text="selected?.legendaryActionsUsed || 0"></span> / <span x-text="selected?.legendaryActionsMax || 0"></span>
                        <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="useLegendaryAction(selected.id)">Use</button>
                    </div>
                    <div style="font-size: var(--text-sm);">
                        Resistances: <span x-text="selected?.legendaryResistancesUsed || 0"></span> / <span x-text="selected?.legendaryResistancesMax || 0"></span>
                        <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="useLegendaryResistance(selected.id)">Use</button>
                    </div>
                </div>

                <!-- Defeat / Revive / Remove -->
                <div class="detail-actions" style="display: flex; gap: var(--space-xs); margin-top: var(--space-sm);">
                    <button class="btn btn-danger" style="padding: 2px 8px; font-size: var(--text-sm);"
                            x-show="!selected?.defeated"
                            @click="markDefeated(selected.id, true)">Defeat</button>
                    <button class="btn" style="padding: 2px 8px; font-size: var(--text-sm);"
                            x-show="selected?.defeated"
                            @click="markDefeated(selected.id, false)">Revive</button>
                    <button class="btn btn-danger" style="padding: 2px 8px; font-size: var(--text-sm);"
                            @click="removeCombatant(selected.id)">Remove</button>
                </div>
            </div>

            <!-- Footer: Undo -->
            <div class="tracker-footer">
                <button class="btn btn-ghost" style="padding: 2px 8px; font-size: var(--text-sm);"
                        @click="undo()"
                        :disabled="!canUndo">↩ Undo</button>
                <span style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: auto;" x-text="combatants.length + ' combatants'"></span>
            </div>
        </div>
    </template>
</div>
</th:block>
