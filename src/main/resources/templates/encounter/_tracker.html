<th:block th:fragment="tracker">
<script th:inline="javascript">
    /* Condition colors for icon dots */
    const CONDITION_COLORS = {
        blinded: '#8a8578', charmed: '#c25a7c', deafened: '#6e7a80',
        exhaustion: '#7a5b48', frightened: '#8a5fa0', grappled: '#b06038',
        incapacitated: '#85796a', invisible: '#5f9ea0', paralyzed: '#c98a3d',
        petrified: '#8d7a6b', poisoned: '#6f9a4f', prone: '#5a7fa8',
        restrained: '#c9b03d', stunned: '#b06038', unconscious: '#a83a32',
        concentration: '#966a9e',
    };

    /* Hardcoded common conditions (fallback if API unavailable) */
    const COMMON_CONDITIONS = [
        { sourceKey: 'blinded', name: 'Blinded', description: 'A blinded creature can\'t see and automatically fails ability checks that require sight.', defaultDuration: 1 },
        { sourceKey: 'charmed', name: 'Charmed', description: 'A charmed creature can\'t attack the charmer and has advantage on social interactions.', defaultDuration: 1 },
        { sourceKey: 'deafened', name: 'Deafened', description: 'A deafened creature can\'t hear and automatically fails ability checks that require hearing.', defaultDuration: 1 },
        { sourceKey: 'frightened', name: 'Frightened', description: 'A frightened creature has disadvantage on ability checks and attacks while the source is visible.', defaultDuration: 1 },
        { sourceKey: 'grappled', name: 'Grappled', description: 'A grappled creature\'s speed becomes 0. The condition ends if the grappler is incapacitated. The condition also ends if an effect removes the grappled creature from the reach of the grappler.', defaultDuration: 1 },
        { sourceKey: 'incapacitated', name: 'Incapacitated', description: 'An incapacitated creature can\'t take actions or reactions.', defaultDuration: 1 },
        { sourceKey: 'invisible', name: 'Invisible', description: 'An invisible creature is impossible to see without magical aid.', defaultDuration: 1 },
        { sourceKey: 'paralyzed', name: 'Paralyzed', description: 'A paralyzed creature is incapacitated and can\'t move or speak.', defaultDuration: 1 },
        { sourceKey: 'petrified', name: 'Petrified', description: 'A petrified creature is turned to stone and is incapacitated.', defaultDuration: 1 },
        { sourceKey: 'poisoned', name: 'Poisoned', description: 'A poisoned creature has disadvantage on attack rolls and ability checks.', defaultDuration: 1 },
        { sourceKey: 'prone', name: 'Prone', description: 'A prone creature\'s only movement option is crawling. Attack rolls against the creature have advantage if the attacker is within 5 feet. The creature\'s attack rolls have disadvantage.', defaultDuration: 1 },
        { sourceKey: 'restrained', name: 'Restrained', description: 'A restrained creature\'s speed becomes 0 and attacks against it have advantage.', defaultDuration: 1 },
        { sourceKey: 'stunned', name: 'Stunned', description: 'A stunned creature is incapacitated, can\'t move, and speaks falteringly.', defaultDuration: 1 },
        { sourceKey: 'unconscious', name: 'Unconscious', description: 'An unconscious creature is incapacitated, can\'t move or speak, and is unaware.', defaultDuration: 1 },
    ];

    function combatTracker(options = {}) {
        return {
            encounter: null,
            combatants: [],
            activeCombatantId: null,
            selectedCombatantId: null,
            editHp: '',
            editTempHp: 0,
            hpDelta: '',
            dmMode: true,
            rechargePrompts: [],
            conditionsCatalog: [],
            showConditionMenu: null,
            conditionDuration: '',
            waves: [],
            spawnError: '',

            request(url, options = {}) {
                return window.dmRequest(url, options);
            },

            failure(summary, error, retry) {
                window.reportActionFailure(summary, error, retry);
            },

            async mutate(summary, url, options, afterSuccess) {
                try {
                    const response = await this.request(url, options);
                    if (afterSuccess) await afterSuccess(response);
                    return true;
                } catch (error) {
                    this.failure(summary, error,
                        () => this.mutate(summary, url, options, afterSuccess));
                    return false;
                }
            },

            campaignId: options.campaignId || '',
            _encounterId: null,

            get activeCombatant() {
                if (this.encounter && this.encounter.activeTurnIndex >= 0 &&
                    this.encounter.activeTurnIndex < this.combatants.length) {
                    return this.combatants[this.encounter.activeTurnIndex];
                }
                return null;
            },

            get selected() {
                return this.combatants.find(c => c.id === this.selectedCombatantId) || null;
            },

            get pendingWaves() {
                return (this.waves || []).filter(w => w.status === 'PENDING' || w.status === 'RESERVE');
            },

            get canUndo() {
                return this._encounterId != null && this.combatants.length > 0;
            },

            get lairActionRowVisible() {
                return this.encounter?.lairActionName != null;
            },

            get activeThreatCard() {
                const active = this.activeCombatant;
                if (!active || !active.threatCard) return null;
                return active.threatCard;
            },

            get activeThreatMechanics() {
                const card = this.activeThreatCard;
                if (!card) return null;
                return card.trap || card.hazard || null;
            },

            prefillDice(expression, label) {
                window.dispatchEvent(new CustomEvent('dice-roller-prefill', {
                    detail: { expression: expression || '1d20', label: label || '' }
                }));
            },

            signedBonus(bonus) {
                if (bonus == null) return '';
                return bonus >= 0 ? '+' + bonus : String(bonus);
            },

            async init() {
                window.addEventListener('dm-mode-changed', (e) => {
                    this.dmMode = e.detail.dmMode;
                    // Hidden combatants appear or vanish, so the rows move under the marker.
                    this._positionTurnMarker();
                });
                window.addEventListener('battle-tokenselect', (e) => {
                    const token = e.detail.token;
                    if (token) {
                        const combatant = this.combatants.find(c => c.tokenId === token.id);
                        if (combatant) this.selectCombatant(combatant.id);
                    }
                });
                this.loadConditionsCatalog();
                if (this.campaignId) {
                    await this.loadActiveEncounter();
                }
            },

            loadConditionsCatalog() {
                this.request('/api/v1/library/conditions')
                    .then(response => response.json())
                    .then(data => {
                        this.conditionsCatalog = data.map(c => ({
                            sourceKey: c.sourceKey,
                            name: c.name,
                            description: c.description || '',
                            defaultDuration: 1,
                        }));
                    })
                    .catch(() => { this.conditionsCatalog = COMMON_CONDITIONS; });
            },

            async loadActiveEncounter() {
                try {
                    const resp = await this.request(`/api/v1/campaigns/${this.campaignId}/encounters/active`);
                    const data = await resp.json();
                    await this.loadEncounter(data.id);
                } catch (error) {
                    if (error?.status === 404) return;
                    this.failure('Could not load the active encounter.', error,
                        () => this.loadActiveEncounter());
                }
            },

            async loadEncounter(encounterId) {
                this._encounterId = encounterId;
                try {
                    const resp = await this.request(`/api/v1/encounters/${encounterId}`);
                    this.encounter = await resp.json();
                    await this.reloadCombatants();
                    await this.loadWaves();
                    this.dispatchState();
                    this.dispatchTurnEvent();
                } catch (error) {
                    this.failure('Could not load the encounter.', error,
                        () => this.loadEncounter(encounterId));
                }
            },

            async reloadCombatants() {
                if (!this._encounterId) return;
                try {
                    const resp = await this.request(`/api/v1/encounters/${this._encounterId}/combatants`);
                    const before = this._capturePositions();
                    this.combatants = await resp.json();
                    this.deriveActiveCombatant();
                    if (this.selected) {
                        this.editHp = this.selected.currentHp;
                        this.editTempHp = this.selected.tempHp || 0;
                    }
                    this._playFlip(before);
                    this._positionTurnMarker();
                } catch (error) {
                    this.failure('Could not reload combatants.', error,
                        () => this.reloadCombatants());
                }
            },

            async loadWaves() {
                if (!this._encounterId) return;
                try {
                    const resp = await this.request(`/api/v1/encounters/${this._encounterId}/waves`);
                    this.waves = await resp.json();
                } catch (error) {
                    // waves are optional; ignore loading failure
                }
            },

            async spawnWave(waveId) {
                this.spawnError = '';
                try {
                    await this.request(`/api/v1/encounters/${this._encounterId}/waves/${waveId}/spawn`, { method: 'POST' });
                    await this.reloadCombatants();
                    await this.loadWaves();
                } catch (error) {
                    this.spawnError = error?.message || 'Failed to spawn wave';
                }
            },

            _reducedMotion() {
                return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            },

            _rows() {
                return this.$root.querySelectorAll('.combatant-row[data-cid]');
            },

            /* Rows reorder when initiative changes. FLIP: remember where each row
               was, let Alpine re-render, then animate each row from where it used
               to be to where it now is — so the list rearranges instead of
               teleporting (§6.1). */
            _capturePositions() {
                const positions = new Map();
                if (this._reducedMotion()) return positions;
                this._rows().forEach(row => {
                    positions.set(row.dataset.cid, row.getBoundingClientRect().top);
                });
                return positions;
            },

            _playFlip(before) {
                if (!before.size || this._reducedMotion()) return;
                this.$nextTick(() => {
                    this._rows().forEach(row => {
                        const wasAt = before.get(row.dataset.cid);
                        if (wasAt == null) return;
                        const delta = wasAt - row.getBoundingClientRect().top;
                        if (!delta) return;
                        row.animate(
                            [{ transform: `translateY(${delta}px)` }, { transform: 'none' }],
                            { duration: 250, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                        );
                    });
                });
            },

            /* The gold marker slides to whoever is up. */
            _positionTurnMarker() {
                this.$nextTick(() => {
                    const marker = this.$refs.turnMarker;
                    if (!marker) return;
                    const row = this.activeCombatantId
                        ? this.$root.querySelector(`.combatant-row[data-cid="${this.activeCombatantId}"]`)
                        : null;
                    if (!row) {
                        marker.classList.remove('visible');
                        return;
                    }
                    marker.style.height = row.offsetHeight + 'px';
                    marker.style.transform = `translateY(${row.offsetTop}px)`;
                    marker.classList.add('visible');
                });
            },

            /* Damage feels dealt, healing feels granted. */
            _flashHp(combatantId, amount) {
                if (!amount || this._reducedMotion()) return;
                this.$nextTick(() => {
                    const row = this.$root.querySelector(`.combatant-row[data-cid="${combatantId}"]`);
                    if (!row) return;
                    const cls = amount < 0 ? 'hp-damage' : 'hp-heal';
                    row.classList.remove('hp-damage', 'hp-heal');
                    void row.offsetWidth;   // restart the animation if it is already running
                    row.classList.add(cls);
                    setTimeout(() => row.classList.remove(cls), 700);
                });
            },

            _pulseRound() {
                if (this._reducedMotion()) return;
                this.$nextTick(() => {
                    const counter = this.$refs.roundCounter;
                    if (!counter) return;
                    counter.classList.remove('pulse');
                    void counter.offsetWidth;
                    counter.classList.add('pulse');
                    setTimeout(() => counter.classList.remove('pulse'), 400);
                });
            },

            deriveActiveCombatant() {
                if (this.encounter && this.encounter.activeTurnIndex >= 0 &&
                    this.encounter.activeTurnIndex < this.combatants.length) {
                    this.activeCombatantId = this.combatants[this.encounter.activeTurnIndex].id;
                } else {
                    this.activeCombatantId = null;
                }
            },

            async nextTurn() {
                if (!this._encounterId) return;
                const roundBefore = this.encounter?.round;
                await this.mutate(
                    'Could not advance the turn. Initiative was not changed.',
                    `/api/v1/encounters/${this._encounterId}/next-turn`,
                    { method: 'POST' },
                    async response => {
                        this.encounter = await response.json();
                        await this.reloadCombatants();
                        this.rechargePrompts = this.encounter.rechargePrompts || [];
                        if (this.encounter.round !== roundBefore) this._pulseRound();
                        this.dispatchTurnEvent();
                        this.dispatchState();
                    });
            },

            async previousTurn() {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not move to the previous turn. Initiative was not changed.',
                    `/api/v1/encounters/${this._encounterId}/previous-turn`,
                    { method: 'POST' },
                    async response => {
                        this.encounter = await response.json();
                        await this.reloadCombatants();
                        this.dispatchTurnEvent();
                        this.dispatchState();
                    });
            },

            async setInitiative(combatantId, init) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not save initiative. The previous order was kept.',
                    `/api/v1/combatants/${combatantId}/initiative`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initiative: init }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async autoRoll() {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not roll initiative. The previous order was kept.',
                    `/api/v1/encounters/${this._encounterId}/auto-roll`,
                    { method: 'POST' },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async applyHpDelta(combatantId) {
                const amount = parseInt(this.hpDelta, 10);
                if (isNaN(amount) || amount === 0) return;
                const succeeded = await this.quickHp(combatantId, amount);
                if (succeeded) this.hpDelta = '';
            },

            async quickHp(combatantId, amount) {
                if (!this._encounterId) return false;
                return this.mutate(
                    'Could not change hit points. The previous value was kept.',
                    `/api/v1/combatants/${combatantId}/damage`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this._flashHp(combatantId, amount);
                        this.dispatchState();
                    });
            },

            async markDefeated(combatantId, defeated) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not change the defeated status. The tracker was kept unchanged.',
                    `/api/v1/combatants/${combatantId}/defeated`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ defeated }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async toggleCondition(combatantId, sourceKey, duration) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not toggle the condition. The tracker was kept unchanged.',
                    `/api/v1/combatants/${combatantId}/conditions`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sourceKey, durationRounds: duration || 1 }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async removeCondition(combatantId, sourceKey) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not remove the condition. The tracker was kept unchanged.',
                    `/api/v1/combatants/${combatantId}/conditions/${sourceKey}/remove`,
                    { method: 'POST' },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async setHp() {
                if (!this.selected || !this._encounterId) return;
                const hp = parseInt(this.editHp, 10);
                if (isNaN(hp)) return;
                const combatantId = this.selected.id;
                const delta = hp - this.selected.currentHp;
                await this.mutate(
                    'Could not save hit points. The previous value was kept.',
                    `/api/v1/combatants/${combatantId}/hp`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ currentHp: hp, tempHp: this.editTempHp }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this._flashHp(combatantId, delta);
                        this.dispatchState();
                    });
            },

            async removeCombatant(combatantId) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not remove the combatant. The tracker was kept unchanged.',
                    `/api/v1/combatants/${combatantId}`,
                    { method: 'DELETE' },
                    async () => {
                        if (this.selectedCombatantId === combatantId) {
                            this.selectedCombatantId = null;
                        }
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async activateLairAction() {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not record the lair action.',
                    `/api/v1/encounters/${this._encounterId}/lair-action`,
                    { method: 'POST' },
                    async () => {
                        await this.loadEncounter(this._encounterId);
                    });
            },

            async undo() {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not undo the last action. The tracker was kept unchanged.',
                    `/api/v1/encounters/${this._encounterId}/undo`,
                    { method: 'POST' },
                    async () => {
                        await this.loadEncounter(this._encounterId);
                    });
            },

            async endEncounter() {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not end the encounter. It remains active.',
                    `/api/v1/encounters/${this._encounterId}/end`,
                    { method: 'POST' },
                    async () => {
                        this.encounter = null;
                        this.combatants = [];
                        this.activeCombatantId = null;
                        this.selectedCombatantId = null;
                        this._encounterId = null;
                        this.dispatchState();
                    });
            },

            hpPercent(c) {
                if (!c || !c.maxHp || c.maxHp <= 0) return 0;
                return Math.max(0, Math.min(100, (c.currentHp / c.maxHp) * 100));
            },

            conditionColor(sourceKey) {
                return CONDITION_COLORS[sourceKey] || '#c9a35c';
            },

            selectCombatant(id) {
                this.selectedCombatantId = id;
                this.showConditionMenu = null;
                if (this.selected) {
                    this.editHp = this.selected.currentHp;
                    this.editTempHp = this.selected.tempHp || 0;
                }
            },

            openConditionMenu(id) {
                this.showConditionMenu = this.showConditionMenu === id ? null : id;
                this.conditionDuration = '';
            },

            hasCondition(combatant, sourceKey) {
                return combatant?.conditions?.some(c => c.sourceKey === sourceKey) || false;
            },

            getConditionText(sourceKey) {
                const cond = this.conditionsCatalog.find(c => c.sourceKey === sourceKey);
                return cond ? `${cond.name}: ${cond.description}` : sourceKey;
            },

            groupCount(groupId) {
                return this.combatants.filter(c => c.groupId === groupId).length;
            },

            async setConcentration(combatantId, spellName) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not set concentration. The previous value was kept.',
                    `/api/v1/combatants/${combatantId}/concentration`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ spellName: spellName || null }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async resolveConcentrationCheck(combatantId, passed) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not record the concentration check.',
                    `/api/v1/combatants/${combatantId}/concentration-check`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ passed }),
                    },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async useLegendaryAction(combatantId) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not record the legendary action.',
                    `/api/v1/combatants/${combatantId}/legendary-action`,
                    { method: 'POST' },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async useLegendaryResistance(combatantId) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not record the legendary resistance.',
                    `/api/v1/combatants/${combatantId}/legendary-resistance`,
                    { method: 'POST' },
                    async () => {
                        await this.reloadCombatants();
                        this.dispatchState();
                    });
            },

            async resolveRecharge(combatantId, abilityName, rollResult) {
                if (!this._encounterId) return;
                await this.mutate(
                    'Could not record the recharge check.',
                    `/api/v1/combatants/${combatantId}/recharge-check`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ abilityName, rollResult }),
                    },
                    async () => {
                        this.rechargePrompts = this.rechargePrompts.filter(p => p.abilityName !== abilityName);
                    });
            },

            dispatchState() {
                window.dispatchEvent(new CustomEvent('tracker-encounter-state', {
                    detail: { encounter: this.encounter, combatants: this.combatants }
                }));
                window.dispatchEvent(new CustomEvent('tracker-conditions-changed', {
                    detail: { combatants: this.combatants }
                }));
            },

            dispatchTurnEvent() {
                if (this.activeCombatantId) {
                    window.dispatchEvent(new CustomEvent('tracker-active-turn', {
                        detail: { combatantId: this.activeCombatantId }
                    }));
                }
            },
        };
    }
</script>

<div x-data="combatTracker({ campaignId: '' })"
     th:attr="x-data=|combatTracker({ campaignId: '${campaignId}' })|"
     x-init="init()"
     class="tracker-panel">

    <template x-if="!encounter">
        <div class="empty-state" style="padding: var(--space-lg);">
            <p>No active encounter</p>
            <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Create an encounter to start tracking combat</span>
        </div>
    </template>

    <template x-if="encounter">
        <div style="display: flex; flex-direction: column; height: 100%;">
            <!-- Encounter header -->
            <div class="tracker-header">
                <h3 x-text="encounter?.name || 'Combat'"></h3>
                <span>Round <strong class="round-counter" x-ref="roundCounter"
                                    x-text="encounter?.round || 0"></strong></span>
                <span class="badge badge-warning" x-show="pendingWaves.length > 0"
                      x-text="'(' + pendingWaves.length + ' wave' + (pendingWaves.length !== 1 ? 's' : '') + ' pending)'"></span>
                <button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" @click="endEncounter()">End</button>
            </div>

            <!-- Turn controls -->
            <div class="tracker-turns">
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="previousTurn()"
                        data-action="previous-turn">◀ Prev</button>
                <span style="font-size: var(--text-sm);">
                    Active: <strong x-text="activeCombatant?.name || '—'"></strong>
                </span>
                <button class="btn btn-ghost" style="padding: 2px 8px;" @click="nextTurn()"
                        data-action="next-turn">Next ▶</button>
            </div>

            <!-- Active threat mechanics card (TRAP/HAZARD turn only) -->
            <div class="active-threat-card threat-mechanics-card"
                 x-show="activeThreatCard && dmMode"
                 x-cloak
                 data-active-threat-card>
                <div class="detail-meta" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                    <strong x-text="activeThreatCard?.name"></strong>
                    <span class="badge" x-text="activeThreatCard?.kind"></span>
                    <span class="badge" x-show="activeThreatMechanics?.severity"
                          x-text="activeThreatMechanics?.severity"></span>
                </div>

                <!-- Trap mechanics -->
                <template x-if="activeThreatCard?.trap">
                    <div class="u-mt-sm">
                        <div x-show="activeThreatMechanics.triggerDescription">
                            <strong>Trigger</strong>
                            <p x-text="activeThreatMechanics.triggerDescription"></p>
                        </div>
                        <div x-show="activeThreatMechanics.detectionCheck">
                            <strong>Detection</strong>
                            <p>
                                <span x-text="activeThreatMechanics.detectionCheck?.mode"></span>
                                <span x-text="activeThreatMechanics.detectionCheck?.ability"></span>
                                <span x-show="activeThreatMechanics.detectionCheck?.dc"
                                      x-text="'DC ' + activeThreatMechanics.detectionCheck?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Detection' + (activeThreatMechanics.detectionCheck?.dc != null ? ' DC ' + activeThreatMechanics.detectionCheck.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.attackBonus != null">
                            <strong>Attack</strong>
                            <p>
                                <span x-text="signedBonus(activeThreatMechanics.attackBonus)"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20' + signedBonus(activeThreatMechanics.attackBonus), 'Attack ' + signedBonus(activeThreatMechanics.attackBonus))">
                                    Prefill attack
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.save">
                            <strong>Save</strong>
                            <p>
                                <span x-text="activeThreatMechanics.save?.mode"></span>
                                <span x-text="activeThreatMechanics.save?.ability"></span>
                                <span x-show="activeThreatMechanics.save?.dc"
                                      x-text="'DC ' + activeThreatMechanics.save?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Save' + (activeThreatMechanics.save?.dc != null ? ' DC ' + activeThreatMechanics.save.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.damageExpression">
                            <strong>Damage</strong>
                            <p>
                                <span x-text="activeThreatMechanics.damageExpression"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice(activeThreatMechanics.damageExpression, 'Damage ' + activeThreatMechanics.damageExpression)">
                                    Prefill damage
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.additionalEffect">
                            <strong>Additional Effect</strong>
                            <p x-text="activeThreatMechanics.additionalEffect"></p>
                        </div>
                        <template x-if="activeThreatMechanics.disarmMethods && activeThreatMechanics.disarmMethods.length">
                            <div>
                                <strong>Disarm</strong>
                                <ul>
                                    <template x-for="m in activeThreatMechanics.disarmMethods" :key="m.id || m.key || m.label">
                                        <li>
                                            <span x-text="m.label"></span>
                                            <span x-show="m.dc != null" x-text="' (DC ' + m.dc + ')'"></span>
                                            <button type="button" class="btn btn-sm btn-ghost"
                                                    @click="prefillDice('1d20', (m.label || 'Disarm') + (m.dc != null ? ' DC ' + m.dc : ''))">
                                                Prefill 1d20
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Hazard mechanics -->
                <template x-if="activeThreatCard?.hazard">
                    <div class="u-mt-sm">
                        <div x-show="activeThreatMechanics.exposureMode">
                            <strong>Exposure</strong>
                            <p x-text="activeThreatMechanics.exposureMode"></p>
                        </div>
                        <div x-show="activeThreatMechanics.exposureText">
                            <strong>Exposure Details</strong>
                            <p x-text="activeThreatMechanics.exposureText"></p>
                        </div>
                        <div x-show="activeThreatMechanics.check">
                            <strong>Check / Save</strong>
                            <p>
                                <span x-text="activeThreatMechanics.check?.mode"></span>
                                <span x-text="activeThreatMechanics.check?.ability"></span>
                                <span x-show="activeThreatMechanics.check?.dc"
                                      x-text="'DC ' + activeThreatMechanics.check?.dc"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice('1d20', 'Check/Save' + (activeThreatMechanics.check?.dc != null ? ' DC ' + activeThreatMechanics.check.dc : ''))">
                                    Prefill 1d20
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.damageExpression">
                            <strong>Damage</strong>
                            <p>
                                <span x-text="activeThreatMechanics.damageExpression"></span>
                                <button type="button" class="btn btn-sm btn-ghost"
                                        @click="prefillDice(activeThreatMechanics.damageExpression, 'Damage ' + activeThreatMechanics.damageExpression)">
                                    Prefill damage
                                </button>
                            </p>
                        </div>
                        <div x-show="activeThreatMechanics.escalationText">
                            <strong>Escalation</strong>
                            <p x-text="activeThreatMechanics.escalationText"></p>
                        </div>
                        <div x-show="activeThreatMechanics.endingConditions">
                            <strong>Ending Conditions</strong>
                            <p x-text="activeThreatMechanics.endingConditions"></p>
                        </div>
                    </div>
                </template>
                <p class="text-muted u-text-sm u-mt-xs">
                    Prefills only — log damage/conditions with the existing tracker controls.
                </p>
            </div>

            <!-- Recharge banner -->
            <div class="recharge-banner" x-show="rechargePrompts.length > 0">
                <template x-for="prompt in rechargePrompts" :key="prompt.abilityName">
                    <div class="recharge-prompt">
                        <span>🔄 <strong x-text="prompt.abilityName"></strong></span>
                        <button @click="resolveRecharge(activeCombatantId, prompt.abilityName, Math.floor(Math.random() * (prompt.maxRoll || 6)) + 1)">Roll d<span x-text="prompt.maxRoll || 6"></span></button>
                        <button @click="resolveRecharge(activeCombatantId, prompt.abilityName, null)">Skip</button>
                    </div>
                </template>
            </div>

            <!-- Wave banner -->
            <div class="wave-banner" x-show="pendingWaves.length > 0" style="background: var(--yellow-950, #3d3100); padding: 8px 12px; border-radius: 4px; margin: 8px 0;">
                <template x-for="wave in pendingWaves" :key="wave.id">
                    <div style="display: flex; align-items: center; gap: 8px; margin: 4px 0;">
                        <span style="color: var(--yellow-400); font-weight: 600;" x-text="'Wave ready: ' + wave.name"></span>
                        <span class="text-muted" x-text="wave.triggerKind + (wave.triggerValue ? ' @ ' + wave.triggerValue : '')"></span>
                        <span class="text-muted" x-text="wave.combatantCount + ' combatants'"></span>
                        <button class="btn btn-sm btn-warning" @click="spawnWave(wave.id)">Spawn</button>
                    </div>
                </template>
                <div x-show="spawnError" class="u-text-danger" x-text="spawnError"></div>
            </div>

            <!-- Initiative list -->
            <div class="tracker-list">
                <div class="turn-marker" x-ref="turnMarker" aria-hidden="true"></div>
                <template x-for="(c, idx) in combatants" :key="c.id">
                    <div class="combatant-row"
                         :data-cid="c.id"
                         :class="{ active: c.id === activeCombatantId, defeated: c.defeated, hidden: c.hidden, bloodied: c.bloodied }"
                         x-show="dmMode || !c.hidden"
                         @click="selectCombatant(c.id)">
                        <!-- Initiative badge -->
                        <span class="init-badge" x-text="c.initiative || '—'"></span>

                        <!-- Name + group indicator -->
                        <span class="combatant-name">
                            <template x-if="c.groupId && !c.groupLeader">├ </template>
                            <span x-text="c.name"></span>
                            <template x-if="c.groupId && c.groupLeader">
                                <span class="group-count" style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: 2px;" x-text="'(' + groupCount(c.groupId) + ')'"></span>
                            </template>
                        </span>

                        <!-- HP bar mini — DM only -->
                        <div class="hp-mini" x-show="dmMode">
                            <div class="hp-mini-fill"
                                 :style="{ width: hpPercent(c) + '%' }"
                                 :class="{ bloodied: c.bloodied, dead: c.defeated }"></div>
                        </div>

                        <!-- HP delta quick-entry — DM only -->
                        <input type="text" class="hp-delta-input"
                               placeholder="±HP"
                               x-show="dmMode"
                               @keydown.enter="applyHpDelta(c.id)"
                               x-model="hpDelta">

                        <!-- Condition icons (always visible) -->
                        <div class="condition-icons">
                            <template x-for="cond in c.conditions" :key="cond.sourceKey">
                                <span class="cond-icon"
                                      :style="{ background: conditionColor(cond.sourceKey) }"
                                      :title="getConditionText(cond.sourceKey)"
                                      x-text="cond.durationRounds > 0 ? cond.durationRounds : '∞'"></span>
                            </template>
                            <button class="btn btn-ghost" style="padding: 0 2px; font-size: 0.7rem; line-height: 1;"
                                    x-show="dmMode"
                                    @click.stop="openConditionMenu(c.id)">＋</button>
                        </div>

                        <!-- Concentration badge -->
                        <span x-show="c.concentratingOn" class="conc-badge"
                              :title="dmMode ? c.concentratingOn : 'Concentrating'">⏀</span>
                    </div>
                </template>

                <!-- Lair action slot (initiative 20) -->
                <div class="lair-action-row" x-show="lairActionRowVisible">
                    <span class="init-badge lair-init">20</span>
                    <span class="combatant-name" x-text="encounter?.lairActionName || 'Lair Action'"></span>
                    <span style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: auto;"
                          x-show="!encounter?.lairActionAvailable">✓ this round</span>
                    <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.75rem;"
                            x-show="encounter?.lairActionAvailable"
                            @click="activateLairAction()">Activate</button>
                </div>
            </div>

            <!-- Selected combatant detail — DM only -->
            <div class="combatant-detail" x-show="selectedCombatantId && dmMode && selected" x-effect="tickNumber($refs.hpDisplay, selected?.currentHp || 0, 300)">
                <!-- HP section -->
                <div class="detail-hp">
                    <label>HP</label>
                    <input type="number" x-model.number="editHp" @change="setHp()">
                    <span class="hp-display" x-ref="hpDisplay" x-text="selected?.currentHp || 0"></span>
                    <span>/</span>
                    <span x-text="selected?.maxHp || '?'"></span>
                    <template x-if="selected?.tempHp > 0">
                        <span style="font-size: 0.7rem; color: var(--color-warning);">+<span x-text="selected.tempHp"></span> temp</span>
                    </template>
                    <span class="hp-flag bloodied" x-show="selected?.bloodied">Bloodied</span>
                    <span class="hp-flag dead" x-show="selected?.defeated">Defeated</span>
                </div>

                <!-- Quick math buttons -->
                <div class="hp-quick">
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -5)">-5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, -1)">-1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 1)">+1</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, 5)">+5</button>
                    <button class="btn" style="padding: 2px 8px;" @click="quickHp(selected.id, (selected.maxHp - selected.currentHp))">Max</button>
                </div>

                <!-- Conditions panel -->
                <div class="detail-conditions">
                    <h4>Conditions</h4>
                    <template x-for="cond in conditionsCatalog" :key="cond.sourceKey">
                        <label class="condition-toggle">
                            <input type="checkbox"
                                   :checked="hasCondition(selected, cond.sourceKey)"
                                   @change="toggleCondition(selected.id, cond.sourceKey, cond.defaultDuration || 1)">
                            <span x-text="cond.name"></span>
                            <span class="cond-help" :title="cond.description" style="cursor: help; color: var(--color-text-muted);">ⓘ</span>
                        </label>
                    </template>
                </div>

                <!-- Concentration -->
                <div class="detail-concentration" x-show="selected?.concentratingOn || selected?.concentrationCheckPending">
                    <template x-if="selected?.concentratingOn">
                        <div style="margin-bottom: var(--space-xs); font-size: var(--text-sm);">
                            Concentrating: <strong x-text="selected.concentratingOn"></strong>
                            <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="setConcentration(selected.id, null)">Drop</button>
                        </div>
                    </template>
                    <template x-if="selected?.concentrationCheckPending">
                        <div class="conc-check" style="background: rgba(155, 89, 182, 0.15); padding: var(--space-xs); border-radius: 4px; margin-bottom: var(--space-xs);">
                            <span style="font-size: var(--text-sm);">Concentration check!</span>
                            <button class="btn" style="padding: 1px 6px; font-size: 0.7rem;" @click="resolveConcentrationCheck(selected.id, true)">Passed</button>
                            <button class="btn" style="padding: 1px 6px; font-size: 0.7rem;" @click="resolveConcentrationCheck(selected.id, false)">Failed</button>
                        </div>
                    </template>
                </div>

                <!-- Legendary section -->
                <div class="detail-legendary" x-show="(selected?.legendaryActionsMax || 0) > 0">
                    <h4 style="margin: var(--space-xs) 0; font-size: var(--text-sm); color: var(--color-text-muted);">Legendary</h4>
                    <div style="font-size: var(--text-sm); margin-bottom: 2px;">
                        Actions: <span x-text="selected?.legendaryActionsUsed || 0"></span> / <span x-text="selected?.legendaryActionsMax || 0"></span>
                        <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="useLegendaryAction(selected.id)">Use</button>
                    </div>
                    <div style="font-size: var(--text-sm);">
                        Resistances: <span x-text="selected?.legendaryResistancesUsed || 0"></span> / <span x-text="selected?.legendaryResistancesMax || 0"></span>
                        <button class="btn btn-ghost" style="padding: 1px 6px; font-size: 0.7rem;" @click="useLegendaryResistance(selected.id)">Use</button>
                    </div>
                </div>

                <!-- Defeat / Revive / Remove -->
                <div class="detail-actions" style="display: flex; gap: var(--space-xs); margin-top: var(--space-sm);">
                    <button class="btn btn-danger" style="padding: 2px 8px; font-size: var(--text-sm);"
                            x-show="!selected?.defeated"
                            @click="markDefeated(selected.id, true)">Defeat</button>
                    <button class="btn" style="padding: 2px 8px; font-size: var(--text-sm);"
                            x-show="selected?.defeated"
                            @click="markDefeated(selected.id, false)">Revive</button>
                    <button class="btn btn-danger" style="padding: 2px 8px; font-size: var(--text-sm);"
                            @click="removeCombatant(selected.id)">Remove</button>
                </div>
            </div>

            <!-- Footer: Undo -->
            <div class="tracker-footer">
                <button class="btn btn-ghost" style="padding: 2px 8px; font-size: var(--text-sm);"
                        @click="undo()"
                        :disabled="!canUndo">↩ Undo</button>
                <span style="font-size: 0.7rem; color: var(--color-text-muted); margin-left: auto;" x-text="combatants.length + ' combatants'"></span>
            </div>
        </div>
    </template>
</div>
</th:block>
