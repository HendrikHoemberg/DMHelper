<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="card" th:fragment="card(encounter, campaignId)">
    <h3>
        <a th:href="@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId}, eid=${encounter.id})}"
           th:text="${encounter.name}">Encounter Name</a>
    </h3>
    <div class="card-meta">
        <span th:if="${encounter.status == 'ACTIVE'}" style="color: var(--color-success);">ACTIVE</span>
        <span th:if="${encounter.status == 'PLANNED'}" style="color: var(--color-info);">PLANNED</span>
        <span th:if="${encounter.status == 'DONE'}" style="color: var(--color-text-muted);">DONE</span>
        <span th:if="${encounter.mapId != null}" th:text="' · Map: ' + ${encounter.mapId}"></span>
        <span th:if="${encounter.round > 0}" th:text="' · Round ' + ${encounter.round}"></span>
    </div>
    <div class="card-actions">
        <a class="btn btn-ghost"
           th:attr="hx-get=@{/campaigns/{cid}/encounters/{eid}/edit(cid=${campaignId}, eid=${encounter.id})}"
           hx-target="closest .card"
           hx-swap="outerHTML">Edit</a>
        <button class="btn btn-danger"
                th:attr="hx-delete=@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId}, eid=${encounter.id})}"
                hx-confirm="Delete this encounter?"
                hx-target="closest .card"
                hx-swap="outerHTML">Delete</button>
    </div>
</div>
</html>
