<div th:fragment="waves(campaignId, encounter)">
    <h3>Waves</h3>
    <div class="waves-list">
        <div th:each="wave : ${waves}" class="wave-item u-flex action-row u-gap-sm u-items-center u-mb-sm">
            <span class="badge"
                  th:classappend="'badge--' + ${wave.status == 'ACTIVE' ? 'success' : (wave.status == 'PENDING' ? 'warning' : 'neutral')}"
                  th:text="${#enums.labelOf(wave.status)}">Status</span>
            <span th:text="${wave.name}" class="u-fw-bold">Wave Name</span>
            <span class="text-muted u-text-sm" th:text="'Trigger: ' + ${#enums.labelOf(wave.triggerKind)}">Trigger</span>
            <span th:if="${wave.triggerValue}" class="text-muted u-text-sm" th:text="' @ ' + ${wave.triggerValue}">Value</span>
            <span class="text-muted u-text-sm" th:text="${wave.combatantCount + ' combatants'}">0 combatants</span>
            <th:block th:if="${wave.status == 'PENDING'}">
                <button class="btn btn-sm btn-primary"
                        th:attr="hx-post=@{/api/v1/encounters/{eid}/waves/{wid}/spawn(eid=${encounter.id}, wid=${wave.id})}"
                        hx-target="body"
                        hx-swap="outerHTML">Spawn</button>
            </th:block>
            <th:block th:if="${wave.waveKey != 'main'}">
                <span class="action-row__destructive">
                    <button class="btn btn-sm btn-danger"
                            th:attr="hx-delete=@{/api/v1/encounters/{eid}/waves/{wid}(eid=${encounter.id}, wid=${wave.id})}"
                            hx-target="closest .wave-item"
                            hx-swap="outerHTML">Delete</button>
                </span>
            </th:block>
        </div>
    </div>

    <div class="wave-add-form u-mt-md">
        <h4>Add Wave</h4>
        <form th:attr="hx-post=@{/api/v1/encounters/{eid}/waves(eid=${encounter.id})}"
              hx-target=".waves-list"
              hx-swap="beforeend"
              hx-vals='js:JSON.stringify(Object.fromEntries(new FormData(this)))'
              hx-on::after-request="this.reset()">
            <div class="u-flex u-gap-sm">
                <input type="text" name="waveKey" placeholder="Key (e.g. reinforcements)" required
                       pattern="^[a-z0-9][a-z0-9._-]{0,99}$">
                <input type="text" name="name" placeholder="Name" required>
                <select name="triggerKind">
                    <option value="MANUAL">Manual</option>
                    <option value="ROUND">Round</option>
                    <option value="HP_THRESHOLD">HP Threshold</option>
                    <option value="CUSTOM">Custom</option>
                </select>
                <input type="text" name="triggerValue" placeholder="e.g. 3">
                <button type="submit" class="btn btn-sm">Add Wave</button>
            </div>
        </form>
    </div>
</div>
