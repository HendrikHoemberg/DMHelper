<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section class="encounter-preparation" th:fragment="placement-board(campaignId, encounter, combatants)"
         data-encounter-placement-board
         th:data-encounter-id="${encounter.id}"
         th:data-map-id="${encounter.mapId}">
  <header data-readiness-summary>
    <span>Map: <span data-map-name
          th:text="${encounterMapName != null ? encounterMapName : 'No map selected'}"></span></span>
    <span data-combatant-count th:text="${#lists.size(combatants)} + ' combatants'"></span>
    <span th:text="' · ' + ${#lists.size(combatants.?[placementId == null])} + ' unplaced'"></span>
    <button type="button" class="btn btn-ghost" data-auto-place
            th:disabled="${#lists.size(combatants.?[placementId == null]) == 0}"
            onclick="autoPlaceCombatants()">Place unplaced</button>
    <button type="button" class="btn btn-ghost" data-place-party
            onclick="placeMissingParty()">Place missing party members</button>
  </header>
  <div class="encounter-preparation__workspace">
    <aside data-unplaced-combatants aria-label="Encounter combatants">
      <p class="text-muted u-text-xs">Drag an unplaced combatant onto the map, or focus it and press Enter.</p>
      <div th:each="c : ${combatants}"
           class="unplaced-combatant"
           th:classappend="${c.placementId != null} ? ' is-placed'"
           th:draggable="${c.placementId == null}"
           tabindex="0"
           th:data-combatant-id="${c.id}"
           th:data-name="${c.name}"
           th:data-kind="${c.kind}"
           th:data-hp="${c.currentHp + '/' + c.maxHp}">
        <span th:text="${c.name}"></span>
        <small th:text="${c.kind + ' · ' + c.currentHp + '/' + c.maxHp}"></small>
        <span class="badge" th:text="${c.placementId == null} ? 'Unplaced' : 'Placed'">Unplaced</span>
      </div>
    </aside>
    <div class="placement-board-map">
      <div id="placement-canvas" tabindex="0"
           role="application"
           aria-label="Encounter placement map. Arrow keys move the placement cursor; Enter places the selected combatant."></div>
    </div>
  </div>
</section>
</html>
