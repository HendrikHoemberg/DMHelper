<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="inline-form" th:fragment="form(campaignId, encounter, maps)">
    <h3 th:text="${encounter == null ? 'New Encounter' : 'Edit ' + encounter.name}">New Encounter</h3>
    <th:block th:with="formAction=${encounter == null ? '/campaigns/' + campaignId + '/encounters' : '/campaigns/' + campaignId + '/encounters/' + encounter.id},
                      formMethod=${encounter == null ? 'post' : 'put'}">
    <form th:action="@{${formAction}}"
          th:method="${formMethod}"
          hx-target="body"
          hx-swap="outerHTML">
        <div class="form-group">
            <label for="encounterName">Name *</label>
            <input type="text" id="encounterName" name="name" required
                   th:value="${encounter?.name}" placeholder="e.g. Goblin Ambush">
        </div>
        <div class="form-group">
            <label for="mapId">Map</label>
            <select id="mapId" name="mapId">
                <option value="">-- No map --</option>
                <option th:each="map : ${maps}" th:value="${map.id}"
                        th:selected="${encounter?.mapId == map.id}"
                        th:text="${map.name}">Map Name</option>
            </select>
        </div>
        <th:block th:if="${encounter != null}">
            <div class="form-group">
                <label>Status</label>
                <span th:text="${#enums.label(encounter.status)}">Planned</span>
            </div>
        </th:block>
        <th:block th:if="${encounterEntity != null}">
            <div class="form-group">
                <label class="form-label">Combat Audio Cue</label>
                <select class="form-input"
                        th:hx-put="@{/api/v1/campaigns/{cid}/audio/assignments/encounters/{eid}(cid=${campaignId},eid=${encounterEntity.id})}"
                        hx-target="this" hx-swap="none"
                        hx-trigger="change">
                    <option value="">— None —</option>
                    <option th:each="c : ${audioCues}" th:value="${c.id}"
                            th:selected="${encounterEntity.combatAudioCue != null and encounterEntity.combatAudioCue.id == c.id}"
                            th:text="${c.name + ' (' + c.providerId + ' / ' + c.category + ')'}">Cue Name</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Victory Audio Cue</label>
                <select class="form-input"
                        th:hx-put="@{/api/v1/campaigns/{cid}/audio/assignments/encounters/{eid}(cid=${campaignId},eid=${encounterEntity.id})}"
                        hx-target="this" hx-swap="none"
                        hx-trigger="change"
                        hx-vals='{"role":"victory"}'>
                    <option value="">— None —</option>
                    <option th:each="c : ${audioCues}" th:value="${c.id}"
                            th:selected="${encounterEntity.victoryAudioCue != null and encounterEntity.victoryAudioCue.id == c.id}"
                            th:text="${c.name + ' (' + c.providerId + ' / ' + c.category + ')'}">Cue Name</option>
                </select>
            </div>
            <div class="form-group" th:if="${encounterEntity.victoryAudioCue != null}">
                <label class="form-label">Victory Duration (5–600s)</label>
                <input type="number" class="form-input" min="5" max="600"
                       th:value="${encounterEntity.victoryCueDurationSeconds}"
                       th:attr="hx-put=@{/api/v1/campaigns/{cid}/audio/assignments/encounters/{eid}(cid=${campaignId},eid=${encounterEntity.id})},
                                hx-vals='{&quot;role&quot;:&quot;victory&quot;,&quot;cueId&quot;:&quot;' + ${encounterEntity.victoryAudioCue.id} + '&quot;,&quot;durationSeconds&quot;:value}'"
                       hx-trigger="change" hx-target="this" hx-swap="none">
            </div>
        </th:block>
        <div class="form-actions">
            <button type="button" class="btn btn-ghost"
                    th:attr="hx-get=@{/campaigns/{cid}/encounters(cid=${campaignId})}"
                    hx-target="body"
                    hx-swap="outerHTML">Cancel</button>
            <button type="submit" class="btn btn-primary"
                    th:text="${encounter == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
    </th:block>
</div>
</html>
