<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="|New Encounter — ${campaign.name}|">DMHelper — New Encounter</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <div>
                    <div class="page-header-eyebrow" th:text="${campaign.name}">Encounters</div>
                    <h1 data-display-title>New Encounter</h1>
                    <div class="rule-taper"></div>
                </div>
                <div class="page-header-actions">
                    <a th:href="@{/campaigns/{id}/encounters(id=${campaignId})}"
                       class="btn btn-ghost">&larr; Back to Encounters</a>
                </div>
            </div>

            <th:block th:replace="~{encounter/_form :: form(
                campaignId=${campaignId}, encounter=${encounter}, maps=${maps})}"></th:block>
        </main>
    </div>
</body>
</html>
