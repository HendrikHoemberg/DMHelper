<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='New Encounter',
          archetype='form',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='New Encounter',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/campaigns/{id}/encounters(id=${campaignId})}"
   class="btn btn-ghost">&larr; Back to Encounters</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{encounter/_form :: form(
        campaignId=${campaignId}, encounter=${encounter}, maps=${maps})}"></th:block>
</div>
</body>
</html>
