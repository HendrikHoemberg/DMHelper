<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Setup: ' + ${encounter.name},
          archetype='operational',
          surface='edit',
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=|Setup: ${encounter.name}|,
        summary='Encounter setup',
        breadcrumb=~{::#breadcrumb},
        primary=~{::#primaryAction},
        secondary=~{})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a th:href="@{/campaigns/{cid}/encounters(cid=${campaignId})}">Encounters</a>
    / <a th:href="@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId}, eid=${encounter.id})}" th:text="${encounter.name}">Encounter</a>
    / Setup
</nav>
<a id="primaryAction" th:href="@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId}, eid=${encounter.id})}" class="btn btn-primary">Done &mdash; back to encounter</a>

<div id="page-content" class="page-content">
    <link rel="stylesheet" th:href="@{/css/encounter.css}">

    <div class="encounter-setup" data-encounter-mode="setup">

        <div class="editor-block" data-setup-column="sources">
            <details class="setup-group" data-setup-group="combatants" open>
                <summary><h2>Combatants</h2></summary>
                <div class="setup-group__body">
                    <form method="post"
                          th:action="@{/campaigns/{cid}/encounters/{eid}/combatants(cid=${campaignId}, eid=${encounter.id})}"
                          class="combatant-quickadd u-flex u-flex-wrap u-gap-sm u-mb-sm">
                        <label class="setup-field">
                            <span class="setup-label">Name</span>
                            <input type="text" name="name" placeholder="Name" required class="setup-search">
                        </label>
                        <label class="setup-field">
                            <span class="setup-label">Max HP</span>
                            <input type="number" name="maxHp" placeholder="HP" value="10" class="setup-qty">
                        </label>
                        <label class="setup-field">
                            <span class="setup-label">Kind</span>
                            <select name="kind" class="setup-wave">
                                <option value="NPC">NPC</option>
                                <option value="PC">PC</option>
                                <option value="MONSTER">Monster</option>
                                <option value="OBJECT">Object</option>
                                <option value="HAZARD">Hazard</option>
                            </select>
                        </label>
                        <button type="submit" class="btn btn-sm">Add</button>
                    </form>

                    <div th:replace="~{encounter/_library-add :: library-add(${campaignId}, ${encounter.id})}"></div>
                    <div th:replace="~{encounter/_threat-add :: threat-add(${campaignId}, ${encounter.id})}"></div>
                    <div th:replace="~{encounter/_combatant-list :: combatant-list(${campaignId}, ${encounter.id}, ${combatants})}"></div>
                </div>
            </details>
        </div>

        <div class="editor-block" data-setup-column="settings">
            <div th:replace="~{encounter/_form :: form(${campaignId}, ${encounter}, ${maps})}"></div>

            <div th:replace="~{encounter/_placement-board :: placement-board(${campaignId}, ${encounter}, ${combatants})}"></div>

            <details class="setup-group" data-setup-group="waves">
                <summary><h2>Waves</h2></summary>
                <div class="setup-group__body" th:replace="~{encounter/_waves :: waves(${campaignId}, ${encounter})}"></div>
            </details>

            <details class="setup-group" data-setup-group="notes">
                <summary><h2>Preparation Notes</h2></summary>
                <div class="setup-group__body" th:replace="~{encounter/_prep :: prep(${campaignId}, ${encounter}, ${prep})}"></div>
            </details>

            <details class="setup-group" data-setup-group="rewards">
                <summary><h2>Rewards</h2></summary>
                <div class="setup-group__body" th:replace="~{encounter/_rewards :: rewards(${campaignId}, ${encounter}, ${rewards})}"></div>
            </details>

            <div class="surface-danger-zone u-mt-lg">
                <h2>Danger Zone</h2>
                <p class="text-muted u-mb-sm">Once you delete an encounter, there is no going back. Please be certain.</p>
                <button class="btn btn-danger action-row__destructive"
                        th:attr="hx-delete=@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId}, eid=${encounter.id})}"
                        th:hx-confirm="|Delete ${encounter.name}?|"
                        th:data-confirm-consequence="|The encounter, its waves, and its combatants are deleted permanently. The scene and map it references are not affected.|"
                        hx-target="body"
                        hx-swap="outerHTML">Delete encounter</button>
            </div>
        </div>
    </div>

    <div th:replace="~{encounter/_summary-modal :: summary-modal(${campaignId})}"></div>
    <script th:src="@{/vendor/konva.min.js}"></script>
    <script type="module" th:src="@{/js/encounter-placement.js}"></script>
</div>
</body>
</html>
