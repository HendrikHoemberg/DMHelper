<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="encounter-draft"
     x-show="draft?.suggestedName"
     class="draft-panel u-mt-md">
    <div class="draft-header">
        <h2>Review Encounter Draft</h2>
        <div class="draft-warning">No state changes until confirmed.</div>
    </div>
    <div class="draft-source u-mt-sm" x-text="'Source: ' + (draft?.sourceText || '')"></div>
    <div class="u-mt-sm">
        <label>Encounter Name</label>
        <input type="text" x-model="draftName" class="u-w-full">
    </div>
    <div class="u-mt-sm">
        <label>Map ID (optional)</label>
        <input type="text" x-model="draftMapId" class="u-w-full" placeholder="UUID of map">
    </div>
    <table class="data-table u-mt-sm">
        <thead>
            <tr>
                <th>Creature</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="(creature, idx) in (draft?.creatures || [])" :key="creature.statBlockId">
                <tr>
                    <td x-text="creature.displayName"></td>
                    <td>
                        <input type="number" x-model="draftCreatures[idx].quantity" min="1" max="50">
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
    <div class="u-flex u-gap-sm u-mt-sm">
        <button class="btn btn-primary" @click="confirmEncounterDraft()" :disabled="draftLoading">
            <span x-text="draftLoading ? 'Confirming...' : 'Confirm'"></span>
        </button>
        <button class="btn btn-ghost" @click="discardDraft()" :disabled="draftLoading">
            <span x-text="draftLoading ? 'Discarding...' : 'Discard'"></span>
        </button>
    </div>
</div>
</html>
