<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper — ' + ${campaign.name} + ' — Ledger'">DMHelper — Ledger</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-layout">
        <main>
            <div class="page-header">
                <h1>Ledger</h1>
                <a th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>
            </div>

            <div class="detail-actions" style="margin-bottom: var(--space-lg);">
                <button class="btn btn-primary"
                        hx-get="@{/campaigns/{id}/ledger/new(id=${campaignId})}"
                        hx-target="#ledger-form-area"
                        hx-swap="innerHTML">
                    + Record Transaction
                </button>
            </div>

            <div id="ledger-form-area"></div>

            <!-- Balances -->
            <div th:replace="~{ledger/_balance :: balanceSection}"></div>

            <!-- Transaction History -->
            <h2>Transaction History</h2>
            <div style="display:flex; flex-direction:column; gap: var(--space-sm);" id="ledger-entries">
                <div th:replace="~{ledger/_card :: card(entry=${e})}" th:each="e : ${entries}"></div>
            </div>
            <div th:if="${#lists.isEmpty(entries)}" class="empty-state">No transactions recorded</div>
        </main>
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    </div>
</body>
</html>
