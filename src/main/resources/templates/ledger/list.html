<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper — ' + ${campaign.name} + ' — Ledger'">DMHelper — Ledger</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-shell">
            <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <div>
                    <div class="page-header-eyebrow">Ledger</div>
                    <h1>Ledger</h1>
                    <div class="rule-taper rule-taper--gold"></div>
                </div>
                <div class="page-header-actions">
                    <a th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>
                </div>
            </div>

            <div class="detail-actions" style="margin-bottom: var(--space-lg);">
                <button class="btn btn-primary"
                        th:hx-get="@{/campaigns/{id}/ledger/new(id=${campaignId})}"
                        hx-target="#ledger-form-area"
                        hx-swap="innerHTML">
                    + Record Transaction
                </button>
            </div>

            <div id="ledger-form-area"></div>

            <!-- Balances -->
            <div th:replace="~{ledger/_balance :: balanceSection}"></div>

            <!-- Transaction History -->
            <h2>Transaction History</h2>
            <div style="display:flex; flex-direction:column; gap: var(--space-sm);" id="ledger-entries">
                <div th:replace="~{ledger/_card :: card(entry=${e})}" th:each="e : ${entries}"></div>
            </div>
            <th:block th:if="${#lists.isEmpty(entries)}" th:replace="~{common/_empty-state :: empty-state('No transactions recorded', null, null, null)}"></th:block>
        </main>
    </div>
</body>
</html>
