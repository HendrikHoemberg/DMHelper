<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Ledger',
          archetype='operational',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Ledger',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<button id="primaryAction" class="btn btn-primary"
        th:hx-get="@{/campaigns/{id}/ledger/new(id=${campaignId})}"
        hx-target="#ledger-form-area"
        hx-swap="innerHTML"
        hx-disabled-elt="this">
    + Record Transaction
</button>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
    <div id="ledger-form-area"></div>

    <!-- Balances -->
    <div th:replace="~{ledger/_balance :: balanceSection}"></div>

    <!-- Transaction History -->
    <div class="detail-section">
        <h2>Transaction History</h2>
        <table class="data-table ledger-table" th:if="${not #lists.isEmpty(entries)}">
            <thead>
                <tr>
                    <th>Kind</th>
                    <th>Amount</th>
                    <th>Holder</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody>
                <!-- th:each on an outer wrapper: th:replace outranks th:each, so on the same tag it runs once with a null 'e'. -->
                <th:block th:each="e : ${entries}">
                    <tr th:replace="~{ledger/_card :: card(entry=${e})}"></tr>
                </th:block>
            </tbody>
        </table>
        <th:block th:if="${#lists.isEmpty(entries)}"><th:block th:replace="~{common/_empty-state :: empty-state('No transactions recorded', null, null, null)}"></th:block></th:block>
    </div>
</div>
</body>
</html>
