<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Calendar & Timeline',
          archetype='operational',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Calendar &amp; Timeline',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <button type="button" class="btn btn-ghost"
            onclick="window.dmOverlay.open(document.getElementById('calendar-config-sheet'))">Calendar Settings</button>
    <a th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>
</div>

<!-- Referenced by a slot expression, so it must sit outside #page-content: inside it,
     it renders once in the toolbar and again as the page's own content. -->
<div id="configSheetBody">
    <div th:replace="~{calendar/_config-form :: configForm}"></div>
</div>

<div id="page-content" class="page-content">
    <div th:replace="~{calendar/_current-date :: currentDateFragment}"></div>

    <div th:replace="~{calendar/_timeline-list :: timelineList}"></div>

    <th:block th:replace="~{fragments/_overlay :: side-sheet(
        id='calendar-config-sheet',
        title='Calendar Configuration',
        body=~{::#configSheetBody})}"></th:block>

</div>
</body>
</html>
