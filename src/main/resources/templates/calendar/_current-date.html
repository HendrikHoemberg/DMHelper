<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="currentDateFragment" id="current-date-wrapper" class="detail-section">
    <h2>Current In-Game Date</h2>
    <div class="card" style="padding: var(--space-md); text-align:center;">
        <div style="font-size: 1.5em; font-weight: 600;"
             th:with="monthName=${config.monthNames() != null and config.monthNames().length > currentDate.month() ? config.monthNames()[currentDate.month()] : 'Month ' + (currentDate.month() + 1)}">
            <span th:text="${currentDate.day()}">15</span>
            <span th:text="${monthName}">March</span>
            <span th:text="${currentDate.year()}">1492</span>
        </div>
        <div th:if="${currentWeekday != null}"
             class="detail-meta" style="margin-top:4px;">
            <span th:text="${currentWeekday}">Weekday</span>
        </div>
    </div>
</div>
</html>
