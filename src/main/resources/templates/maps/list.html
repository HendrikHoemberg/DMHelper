<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Maps',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Maps',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<button id="primaryAction" class="btn btn-primary"
        th:attr="hx-get=@{/campaigns/{cid}/maps/new(cid=${campaignId})}"
        hx-target="#map-grid"
        hx-swap="beforeend">+ New Map</button>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Back to Campaign</a>
<a id="emptyMapAction" th:href="@{/campaigns/{id}/maps/new(id=${campaignId})}"
   class="btn btn-ghost">New map</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{fragments/_toolbar :: toolbar(
        action=@{/campaigns/{cid}/maps(cid=${campaignId})},
        searchValue=${null},
        searchPlaceholder='Filter maps by name…',
        filters=~{},
        actions=~{})}"></th:block>

    <div id="map-grid" class="card-grid card-grid--bounded empty-state-host">
        <th:block th:if="${maps == null or maps.isEmpty()}">
            <th:block th:replace="~{fragments/_states :: empty(
                icon='map',
                title='No maps yet',
                description='Draw a battle map or import an image to run encounters on the grid.',
                cta=~{::#emptyMapAction})}"></th:block>
        </th:block>
        <th:block th:each="map : ${maps}">
            <th:block th:replace="~{maps/_card :: card(map=${map}, campaignId=${campaignId})}"></th:block>
        </th:block>
    </div>
</div>

<script>
    window.dmHelperFilterMaps = function (query) {
        var needle = (query || '').trim().toLowerCase();
        document.querySelectorAll('[data-map-card]').forEach(function (card) {
            var haystack = (card.getAttribute('data-map-search') || '').toLowerCase();
            card.hidden = needle !== '' && haystack.indexOf(needle) === -1;
        });
    };
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('.page--index .toolbar__input');
        if (!input) return;
        input.addEventListener('input', function () {
            window.dmHelperFilterMaps(this.value);
        });
    });
</script>
</body>
</html>
