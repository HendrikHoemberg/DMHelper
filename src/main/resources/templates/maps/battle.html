<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper — ' + ${map.name} + ' (Battle)'">DMHelper — Battle Map</title>
    <style>
        .battle-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-bg);
        }
        .battle-toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }
        .battle-toolbar .tool-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-right: var(--space-md);
            border-right: 1px solid var(--color-border);
        }
        .battle-toolbar .tool-btn {
            padding: 6px 10px;
            font-size: var(--text-sm);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
        }
        .battle-toolbar .tool-btn:hover { background: var(--color-surface-hover); }
        .battle-toolbar .tool-btn.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: #fff;
        }
        .battle-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .battle-canvas-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #0a0a1a;
        }
        .battle-sidebar {
            width: 240px;
            flex-shrink: 0;
            overflow-y: auto;
            background: var(--color-surface);
            border-left: 1px solid var(--color-border);
            padding: var(--space-sm);
        }
        .battle-statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px var(--space-md);
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            flex-shrink: 0;
        }
        .sidebar-section {
            margin-bottom: var(--space-md);
        }
        .sidebar-section h3 {
            font-size: var(--text-sm);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--color-text-muted);
            margin: 0 0 var(--space-xs);
        }
        .token-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: var(--text-sm);
            cursor: pointer;
        }
        .token-list-item:hover { background: var(--color-surface-hover); }
        .token-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
            border: 1px solid var(--color-border);
            flex-shrink: 0;
            margin-right: 6px;
        }
        .save-indicator.save-saved { color: var(--color-success); }
        .save-indicator.save-saving,
        .save-indicator.save-unsaved { color: var(--color-warning); }
        .save-indicator.save-error { color: var(--color-danger); }
        .hp-input {
            width: 50px;
            padding: 2px 4px;
            font-size: var(--text-sm);
            border: 1px solid var(--color-border);
            border-radius: 3px;
            background: var(--color-bg);
            color: var(--color-text);
            text-align: center;
        }
        .map-switcher select {
            padding: 4px 8px;
            font-size: var(--text-sm);
            background: var(--color-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: 4px;
        }
        .aoepresets {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }
        .aoepresets button {
            padding: 2px 6px;
            font-size: 0.7rem;
            border: 1px solid var(--color-border);
            border-radius: 3px;
            background: var(--color-bg);
            color: var(--color-text-muted);
            cursor: pointer;
        }
        .aoepresets button:hover { color: var(--color-text); background: var(--color-surface-hover); }
        .statblock-search {
            position: relative;
        }
        .statblock-search input {
            width: 100%;
            padding: 4px 8px;
            font-size: var(--text-sm);
            background: var(--color-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: 4px;
        }
        .statblock-search .sb-results {
            max-height: 200px;
            overflow-y: auto;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            margin-top: 2px;
        }
        .sb-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            font-size: var(--text-sm);
            cursor: pointer;
        }
        .sb-result-item:hover { background: var(--color-surface-hover); }
        .sb-result-item .sb-cr { color: var(--color-text-muted); font-size: 0.7rem; margin-left: 4px; }
        .token-dead { text-decoration: line-through; color: var(--color-text-muted); }
        .aoepresets-label { font-size: 0.7rem; color: var(--color-text-muted); margin-right: 2px; }
    </style>
</head>
<body>
    <div class="battle-container" x-data="battleToolbar()" th:data-campaign-id="${campaignId}">
        <div class="battle-toolbar">
            <a th:href="@{/campaigns/{cid}/maps(cid=${campaignId})}" class="btn btn-ghost">&larr; Maps</a>

            <div class="tool-group">
                <button class="tool-btn" :class="{ active: tool === 'select' }" @click="setTool('select')" title="Select/Move tokens">☝ Select</button>
                <button class="tool-btn" :class="{ active: tool === 'measure' }" @click="setTool('measure')" title="Measure distance">↔ Measure</button>
                <button class="tool-btn" @click="addToken()" title="Add a token">＋ Token</button>
                <button class="tool-btn" @click="addParty()" title="Add all active party members to map">👥 Add Party</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" :class="{ active: tool === 'cone' }" @click="setTool('cone')" title="Cone template">◤ Cone</button>
                <button class="tool-btn" :class="{ active: tool === 'sphere' }" @click="setTool('sphere')" title="Sphere/Circle template">○ Sphere</button>
                <button class="tool-btn" :class="{ active: tool === 'cube' }" @click="setTool('cube')" title="Cube template">□ Cube</button>
                <button class="tool-btn" :class="{ active: tool === 'line' }" @click="setTool('line')" title="Line template">╱ Line</button>
                <button class="tool-btn" @click="clearAoe()" title="Clear all AoE templates">✕ Clear</button>
                <div class="aoepresets">
                    <template x-for="p in currentAoEPresets" :key="p.label">
                        <button @click="applyAoePreset(p.cells)" x-text="p.label"></button>
                    </template>
                </div>
            </div>

            <div class="tool-group">
                <button class="tool-btn" :class="{ active: tool === 'text' }" @click="setTool('text')" title="Text annotation (DM-only)">A Text</button>
                <button class="tool-btn" :class="{ active: tool === 'ping' }" @click="setTool('ping')" title="Ping (DM-only)">◎ Ping</button>
                <button class="tool-btn" :class="{ active: tool === 'draw' }" @click="setTool('draw')" title="Freehand draw (DM-only)">✎ Draw</button>
                <button class="tool-btn" @click="clearAnnotations()" title="Clear all annotations">⌫ Clear</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" :class="{ active: movementMode === 'GRID' }"
                        @click="toggleMovementMode()"
                        :title="movementMode === 'GRID' ? 'Grid mode: tokens snap to cells' : 'Freeform mode: free pixel movement'">
                    <span x-show="movementMode === 'GRID'">⬡ Grid</span>
                    <span x-show="movementMode === 'FREEFORM'">⊡ Free</span>
                </button>
                <button class="tool-btn" :class="{ active: showGrid }"
                        @click="toggleShowGrid()"
                        title="Toggle grid visibility">
                    # Grid
                </button>
            </div>

            <div class="tool-group" style="border-right: none;">
                <button class="tool-btn" :class="{ active: dmMode }"
                        @click="toggleDmMode()"
                        :title="dmMode ? 'DM Mode: all data visible' : 'Player view: hidden tokens dimmed'">
                    <span x-show="dmMode">👁 DM</span>
                    <span x-show="!dmMode">🚫 Player</span>
                </button>
            </div>
        </div>

        <div class="battle-body">
            <div class="battle-canvas-wrap" id="battleCanvasWrap"></div>

            <div class="battle-sidebar">
                <div class="sidebar-section" x-show="maps.length > 1" style="display: none;">
                    <h3>Maps</h3>
                    <div class="map-switcher">
                        <select x-model="currentMapId" @change="switchMap()">
                            <template x-for="m in maps" :key="m.id">
                                <option :value="m.id" x-text="m.name" :selected="m.id === currentMapId"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>From Library</h3>
                    <div class="statblock-search">
                        <input type="text" placeholder="Search statblocks..." x-model="sbSearch" @input="searchStatblocks()">
                        <div class="sb-results" x-show="sbResults.length > 0 && sbSearch.length > 0" style="display: none;">
                            <template x-for="sb in sbResults" :key="sb.id">
                                <div class="sb-result-item" @click="addStatblockToken(sb.id)">
                                    <span>
                                        <strong x-text="sb.name"></strong>
                                        <span class="sb-cr" x-text="'CR ' + sb.cr"></span>
                                    </span>
                                    <span style="font-size: 0.7rem;" x-text="sb.type"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Tokens (<span x-text="tokens.length"></span>)</h3>
                    <template x-for="t in tokens" :key="t.id">
                        <div class="token-list-item" @click="focusToken(t.id)">
                            <span class="token-swatch" :style="{ background: t.color }"></span>
                            <span :class="{ 'token-dead': t.dead }" x-text="t.name" style="flex: 1;"></span>
                            <template x-if="t.currentHp != null && t.maxHp != null">
                                <span x-text="t.currentHp + '/' + t.maxHp"
                                      style="font-size: 0.75rem; color: var(--color-text-muted);"></span>
                            </template>
                            <button @click.stop="duplicateToken(t.id)" class="btn btn-ghost" style="padding: 0 4px; font-size: var(--text-sm);" title="Duplicate">❏</button>
                            <button @click.stop="deleteToken(t.id)" class="btn btn-ghost" style="padding: 0 4px; font-size: var(--text-sm);">✕</button>
                        </div>
                    </template>
                </div>

                <div class="sidebar-section" x-show="selectedToken" style="display: none;">
                    <h3>Selected</h3>
                    <div style="font-size: var(--text-sm);">
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: block; color: var(--color-text-muted);">Name</label>
                            <input type="text" x-model="selectedToken.name" @change="updateToken()" style="width: 100%;">
                        </div>
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: block; color: var(--color-text-muted);">HP</label>
                            <div style="display: flex; gap: 4px; align-items: center;">
                                <input type="number" class="hp-input" x-model="selectedToken.currentHp" @change="updateToken()">
                                <span>/</span>
                                <input type="number" class="hp-input" x-model="selectedToken.maxHp" @change="updateToken()">
                            </div>
                        </div>
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: block; color: var(--color-text-muted);">Size (W×H)</label>
                            <select x-model="selectedToken.sizeCols" @change="updateToken()" style="font-size: var(--text-sm);">
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                            </select>
                            <span style="margin: 0 2px;">×</span>
                            <select x-model="selectedToken.sizeRows" @change="updateToken()" style="font-size: var(--text-sm);">
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                            </select>
                        </div>
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox" x-model="selectedToken.hidden" @change="updateToken()"> Hidden
                            </label>
                        </div>
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox" x-model="selectedToken.dead" @change="toggleDead()"> Dead
                            </label>
                        </div>
                        <div style="margin-bottom: var(--space-xs);">
                            <label style="display: block; color: var(--color-text-muted);">Color</label>
                            <input type="color" x-model="selectedToken.color" @change="updateToken()">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="battle-statusbar">
            <span id="battleStatusMessage">Ready</span>
            <span id="battleCursorInfo" style="color: var(--color-text-muted);"></span>
            <span id="battleSaveIndicator" class="save-indicator save-saved">Saved</span>
        </div>
    </div>

    <script th:src="@{/vendor/konva.min.js}"></script>
    <script>
        function battleToolbar() {
            return {
                tool: 'select',
                movementMode: /*[[${map.movementMode}]]*/ 'GRID',
                showGrid: /*[[${map.showGrid}]]*/ true,
                dmMode: true,
                currentMapId: /*[[${map.id}]]*/ '',
                maps: [],
                tokens: [],
                selectedToken: null,
                sbSearch: '',
                sbResults: [],
                currentAoEPresets: [],

                init() {
                    window.addEventListener('battle-toolchange', (e) => {
                        this.tool = e.detail.tool;
                        this.currentAoEPresets = AOE_PRESETS[this.tool] || [];
                    });
                    window.addEventListener('battle-tokenupdate', (e) => {
                        this.tokens = e.detail.tokens;
                        if (this.selectedToken) {
                            const updated = this.tokens.find(t => t.id === this.selectedToken.id);
                            if (updated) this.selectedToken = updated;
                        }
                    });
                    window.addEventListener('battle-tokenselect', (e) => { this.selectedToken = e.detail.token; });
                    window.addEventListener('battle-modestate', (e) => {
                        this.movementMode = e.detail.movementMode;
                        this.showGrid = e.detail.showGrid;
                    });
                    window.addEventListener('battle-maplist', (e) => {
                        this.maps = e.detail.maps;
                        this.currentMapId = e.detail.currentMapId;
                    });
                    this.loadMaps();
                },

                setTool(t) { window.battleMap?.setTool(t); },

                async addToken() {
                    const name = prompt('Token name:') || 'Token';
                    const kind = prompt('Kind (PC/NPC/MONSTER/OBJECT):', 'NPC') || 'NPC';
                    if (!window.battleMap) return;
                    const s = window.battleMap.cellSizePx;
                    let px = (-window.battleMap.stage.x() + window.battleMap.container.clientWidth / 2) / window.battleMap.stage.scaleX();
                    let py = (-window.battleMap.stage.y() + window.battleMap.container.clientHeight / 2) / window.battleMap.stage.scaleY();
                    const colors = { PC: '#4a9eff', NPC: '#2ecc71', MONSTER: '#e74c3c', OBJECT: '#f39c12' };
                    await window.battleMap.createToken({
                        name, kind, positionX: Math.round(px), positionY: Math.round(py),
                        sizeCols: 1, sizeRows: 1,
                        color: colors[kind] || '#7b68ee', hidden: false,
                        currentHp: null, maxHp: null,
                    });
                },

                async addParty() { await window.battleMap?.addPartyToMap(); },
                async deleteToken(id) { if (confirm('Delete this token?')) await window.battleMap?.deleteToken(id); },
                async duplicateToken(id) { await window.battleMap?.duplicateToken(id); },
                async toggleDead() {
                    if (this.selectedToken) {
                        await window.battleMap?.markDead(this.selectedToken.id, this.selectedToken.dead);
                    }
                },
                focusToken(id) { window.battleMap?.focusToken(id); },

                async updateToken() {
                    if (this.selectedToken) {
                        await window.battleMap?.updateToken(this.selectedToken.id, this.selectedToken);
                    }
                },

                async toggleMovementMode() {
                    const newMode = this.movementMode === 'GRID' ? 'FREEFORM' : 'GRID';
                    await window.battleMap?.setMovementMode(newMode);
                },
                async toggleShowGrid() {
                    await window.battleMap?.setShowGrid(!this.showGrid);
                },
                toggleDmMode() {
                    this.dmMode = !this.dmMode;
                    window.battleMap?.setDmMode(this.dmMode);
                },
                clearAoe() { window.battleMap?.clearAoeNodes(); },
                clearAnnotations() { window.battleMap?.clearAnnotations(); },
                applyAoePreset(cells) {
                    window.battleMap?.applyAoePreset(this.tool, cells);
                },

                async loadMaps() {
                    try {
                        const resp = await fetch(`/api/v1/campaigns/${/*[[${campaignId}]]*/ ''}/maps`);
                        if (resp.ok) this.maps = await resp.json();
                    } catch (e) {}
                },
                switchMap() {
                    const bm = window.battleMap;
                    if (bm && this.currentMapId !== bm.mapId) {
                        bm.switchToMap(this.currentMapId);
                        const cid = document.querySelector('.battle-container')?.dataset?.campaignId || '';
                        history.replaceState(null, '', `/campaigns/${cid}/maps/${this.currentMapId}/play`);
                    }
                },

                async searchStatblocks() {
                    if (!this.sbSearch || this.sbSearch.length < 2) { this.sbResults = []; return; }
                    try {
                        const resp = await fetch(`/api/v1/library/statblocks/search?q=${encodeURIComponent(this.sbSearch)}`);
                        if (resp.ok) this.sbResults = await resp.json();
                    } catch (e) {}
                },
                async addStatblockToken(id) {
                    await window.battleMap?.createTokenFromStatblock(id);
                    this.sbSearch = '';
                    this.sbResults = [];
                },
            };
        }
    </script>
    <script type="module" th:inline="javascript">
        import { BattleMap } from '/js/map/battle-map.js';

        window.AOE_PRESETS = {
            cone: [{ label: '15 ft', cells: 3 }, { label: '30 ft', cells: 6 }, { label: '60 ft', cells: 12 }],
            sphere: [{ label: '5 ft', cells: 1 }, { label: '10 ft', cells: 2 }, { label: '20 ft', cells: 4 }, { label: '30 ft', cells: 6 }],
            cube: [{ label: '5 ft', cells: 1 }, { label: '10 ft', cells: 2 }, { label: '15 ft', cells: 3 }, { label: '20 ft', cells: 4 }],
            line: [{ label: '30 ft', cells: 6 }, { label: '60 ft', cells: 12 }, { label: '120 ft', cells: 24 }],
        };

        const battleMap = new BattleMap({
            container: document.getElementById('battleCanvasWrap'),
            mapId: /*[[${map.id}]]*/ '',
            campaignId: /*[[${campaignId}]]*/ '',
            gridWidth: /*[[${map.gridWidth}]]*/ 30,
            gridHeight: /*[[${map.gridHeight}]]*/ 20,
            cellSizePx: /*[[${map.cellSizePx}]]*/ 48,
            movementMode: /*[[${map.movementMode}]]*/ 'GRID',
            showGrid: /*[[${map.showGrid}]]*/ true,
            statusEl: document.getElementById('battleStatusMessage'),
            saveIndicatorEl: document.getElementById('battleSaveIndicator'),
            cursorInfoEl: document.getElementById('battleCursorInfo'),
        });
        window.battleMap = battleMap;
        battleMap.load();
    </script>
    <script th:src="@{/vendor/alpine.min.js}" defer></script>
</body>
</html>
