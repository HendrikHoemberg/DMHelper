<div th:fragment="form" xmlns:th="http://www.thymeleaf.org">
  <form class="inline-form"
        th:action="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
        method="put"
        hx-put="true"
        hx-target="#sceneBody"
        hx-swap="innerHTML"
        hx-throttle="500ms">
    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" name="title" placeholder="Scene title" required
             th:value="${scene.title}" class="form-input"/>
    </div>
    <div class="form-group">
      <label class="form-label">Scene Key</label>
      <input type="text" name="sceneKey" placeholder="e.g. 14A"
             th:value="${scene.sceneKey}" class="form-input"/>
    </div>
    <div class="form-group">
      <label class="form-label">Scene notes (Markdown)</label>
      <textarea name="body" placeholder="Scene notes in markdown (not structured read-aloud)"
                th:text="${scene.body}" class="form-input" rows="12"
                hx-trigger="keyup changed delay:2s"
                th:hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
                hx-target="#sceneBody"
                hx-swap="innerHTML"
                hx-include="[name='title'], [name='sceneKey'], [name='summary'], [name='sourceLocator'], [name='tags'], [name='mapRegionKey']"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Summary</label>
      <textarea name="summary" placeholder="Short scene summary" class="form-input" rows="2"
                th:text="${scene.summary}"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Source Locator</label>
      <input type="text" name="sourceLocator" placeholder="e.g. book:42"
             th:value="${scene.sourceLocator}" class="form-input"/>
    </div>
    <div class="form-group">
      <label class="form-label">Tags</label>
      <input type="text" name="tags" placeholder="comma-separated tags"
             th:value="${scene.tags}" class="form-input"/>
    </div>
    <div class="form-group">
      <label class="form-label">Map Region Key</label>
      <input type="text" name="mapRegionKey" placeholder="optional map region hint"
             th:value="${scene.mapRegionKey}" class="form-input"/>
    </div>
    <div class="form-group">
      <label class="form-label">Linked Map</label>
      <select name="mapId" class="form-input"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/link-map(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor"
              hx-swap="innerHTML"
              hx-include="[name='pinX'], [name='pinY']">
        <option value="">None</option>
        <option th:each="m : ${maps}" th:value="${m.id}" th:selected="${scene.map != null and scene.map.id == m.id}"
                th:text="${m.name}">Map Name</option>
      </select>
      <div style="display: flex; gap: var(--space-sm); margin-top: var(--space-xs);">
        <input type="number" name="pinX" placeholder="Pin X" class="form-input" style="width: 80px;"
               th:value="${scene.pinX}">
        <input type="number" name="pinY" placeholder="Pin Y" class="form-input" style="width: 80px;"
               th:value="${scene.pinY}">
      </div>
      <button type="button" class="btn btn-danger btn-sm"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/unlink-map(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor" hx-swap="innerHTML"
              th:if="${scene.map != null}">Unlink Map</button>
    </div>
    <div class="form-group">
      <label class="form-label">Linked Encounter</label>
      <select name="encounterId" class="form-input"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/link-encounter(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor" hx-swap="innerHTML">
        <option value="">None</option>
        <option th:each="e : ${encounters}" th:value="${e.id}" th:selected="${scene.encounter != null and scene.encounter.id == e.id}"
                th:text="${e.name}">Encounter Name</option>
      </select>
      <button type="button" class="btn btn-danger btn-sm"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/unlink-encounter(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor" hx-swap="innerHTML"
              th:if="${scene.encounter != null}">Unlink Encounter</button>
    </div>
    <div class="form-group">
      <label class="form-label">Linked Statblocks</label>
      <select name="statBlockId" class="form-input"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/add-statblock(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor" hx-swap="innerHTML">
        <option value="">Add statblock...</option>
        <option th:each="sb : ${statBlocks}" th:value="${sb.id}" th:text="${sb.name}">StatBlock Name</option>
      </select>
      <div th:if="${scene.statBlocks != null and !scene.statBlocks.isEmpty()}" style="margin-top: var(--space-xs);">
        <div th:each="sb : ${scene.statBlocks}" style="display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xxs) 0;">
          <span th:text="${sb.name}">StatBlock</span>
          <button type="button" class="btn btn-danger btn-sm"
                  th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/remove-statblock(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
                  th:attr="hx-vals='{&quot;statBlockId&quot;: &quot;' + ${sb.id} + '&quot;}'"
                  hx-target="#sceneStructureEditor" hx-swap="innerHTML">&times;</button>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Audio Cue</label>
      <select name="audioCueId" class="form-input"
              th:hx-put="@{/api/v1/campaigns/{cid}/audio/assignments/scenes/{sid}(cid=${campaignId},sid=${scene.id})}"
              hx-target="this" hx-swap="none"
              hx-trigger="change">
        <option value="">— None —</option>
        <option th:each="c : ${audioCues}" th:value="${c.id}"
                th:selected="${scene.sceneAudioCue != null and scene.sceneAudioCue.id == c.id}"
                th:text="${c.name + ' (' + c.providerId + ' / ' + c.category + ')'}">Cue Name</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Linked Handouts</label>
      <select name="handoutId" class="form-input"
              th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/add-handout(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-target="#sceneStructureEditor" hx-swap="innerHTML">
        <option value="">Add handout...</option>
        <option th:each="h : ${handouts}" th:value="${h.id}" th:text="${h.title}">Handout Title</option>
      </select>
      <div th:if="${scene.handouts != null and !scene.handouts.isEmpty()}" style="margin-top: var(--space-xs);">
        <div th:each="h : ${scene.handouts}" style="display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xxs) 0;">
          <span th:text="${h.title}">Handout</span>
          <button type="button" class="btn btn-danger btn-sm"
                  th:hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/remove-handout(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
                  th:attr="hx-vals='{&quot;handoutId&quot;: &quot;' + ${h.id} + '&quot;}'"
                  hx-target="#sceneStructureEditor" hx-swap="innerHTML">&times;</button>
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-ghost"
         th:href="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}">Cancel</a>
    </div>
  </form>
</div>
