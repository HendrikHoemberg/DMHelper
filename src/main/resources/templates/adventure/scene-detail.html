<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${scene.title},
          archetype='detail',
          surface='read',
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{::#page-rail})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${scene.title},
        summary='Scene',
        breadcrumb=~{::#breadcrumb},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a th:href="@{/campaigns/{cid}(cid=${campaignId})}" th:text="${campaign.name}">Campaign</a>
    <span> / </span>
    <a th:href="@{/campaigns/{cid}/adventures/{aid}(cid=${campaignId},aid=${adventure.id})}" th:text="${adventure.name}">Adventure</a>
    <span> / </span>
    <span th:text="${scene.title}">Scene</span>
</nav>
<a id="secondaryActions" class="btn btn-ghost"
   th:href="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/structure(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}">Edit</a>

<div id="page-content" class="page-content">
    <div id="sceneBody" class="scene-body">
        <th:block th:replace="~{adventure/_scene-body :: sceneBody}"></th:block>
    </div>
</div>

<div id="page-rail" class="page-rail-slot">
    <th:block th:replace="~{fragments/_context-rail :: rail(body=~{::#sceneRail})}"></th:block>
</div>
<!-- Outside the slot, like every other detail page's rail source. #sceneRail stays the
     htmx target for the encounter-seed swap. -->
<div id="sceneRail">
    <th:block th:replace="~{adventure/_scene-rail :: sceneRail}"></th:block>
    <div class="detail-section u-mt-md">
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='SCENE', targetId=${scene.id})}"></th:block>
    </div>
</div>
</body>
</html>
