<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="adventureList" xmlns:th="http://www.thymeleaf.org" class="detail-section">
    <div id="adventure-form-placeholder"></div>
    <th:block th:if="${adventures.isEmpty()}">
        <th:block th:replace="~{fragments/_states :: empty(
            icon='book',
            title='No adventures yet',
            description='Build an adventure, then divide it into chapters and scenes.',
            cta=~{common/_form-cta :: swap-cta(
                actionText='New adventure',
                actionUrl=@{/campaigns/{cid}/adventures/new(cid=${campaignId})},
                target='#adventure-form-placeholder')})}"></th:block>
    </th:block>
    <div th:unless="${adventures.isEmpty()}" class="card-grid card-grid--bounded">
        <article class="card adventure-card" data-adventure-card
                 th:each="a : ${adventures}"
                 th:attr="data-adventure-search=${(a.adventure.name ?: '') + ' ' + (a.adventure.description ?: '')}">
            <div class="card-header">
                <h2>
                    <a th:href="@{/campaigns/{cid}/adventures/{id}(cid=${campaignId},id=${a.adventure.id})}"
                       th:text="${a.adventure.name}">Adventure</a>
                </h2>
                <span class="badge" th:if="${a.sceneCount > 0}"
                      th:text="|${a.doneCount}/${a.sceneCount} done|">0/0 done</span>
                <span class="badge badge--warning" th:if="${currentScene != null and currentScene.chapter.adventure.id == a.adventure.id}"
                      data-current-position>Current position</span>
            </div>
            <div class="card-meta" data-adventure-counts
                 th:text="|${a.chapterCount} chapters · ${a.sceneCount} scenes|">0 chapters · 0 scenes</div>
            <div class="card-meta" th:if="${a.adventure.sourceAttribution}"
                 th:text="${a.adventure.sourceAttribution}">Source</div>
            <div class="card-body" th:if="${a.adventure.description}"
                 th:text="${a.adventure.description}">Description</div>
            <div class="card-actions">
                <button class="btn btn-ghost btn-sm"
                        th:hx-put="@{/campaigns/{cid}/adventures/{id}/move(cid=${campaignId},id=${a.adventure.id})}"
                        hx-vals='{"direction": -1}'
                        hx-target="closest .detail-section"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this">↑</button>
                <button class="btn btn-ghost btn-sm"
                        th:hx-put="@{/campaigns/{cid}/adventures/{id}/move(cid=${campaignId},id=${a.adventure.id})}"
                        hx-vals='{"direction": 1}'
                        hx-target="closest .detail-section"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this">↓</button>
                <button class="btn btn-ghost btn-sm"
                        th:hx-get="@{/campaigns/{cid}/adventures/{id}/edit(cid=${campaignId},id=${a.adventure.id})}"
                        hx-target="closest .card"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this">Edit</button>
                <button class="btn btn-danger btn-sm action-row__destructive"
                        th:hx-delete="@{/campaigns/{cid}/adventures/{id}(cid=${campaignId},id=${a.adventure.id})}"
                        hx-confirm="Delete this adventure and all its chapters and scenes?"
                        hx-target="body" hx-swap="outerHTML"
                        hx-disabled-elt="this">Delete</button>
            </div>
        </article>
    </div>
</div>
