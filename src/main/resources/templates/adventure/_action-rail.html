<div th:fragment="actionRail" xmlns:th="http://www.thymeleaf.org">
  <div class="detail-section">
    <h3>Actions</h3>

    <div style="display: flex; gap: var(--space-xs); margin-bottom: var(--space-md);">
      <button class="btn btn-sm"
              th:classappend="${scene.status.name() == 'VISITED'} ? 'btn-primary' : 'btn-ghost'"
              hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/status(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-vals='{"status": "VISITED"}'
              hx-target="closest .detail-section" hx-swap="outerHTML">Visited</button>
      <button class="btn btn-sm"
              th:classappend="${scene.status.name() == 'DONE'} ? 'btn-success' : 'btn-ghost'"
              hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/status(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-vals='{"status": "DONE"}'
              hx-target="closest .detail-section" hx-swap="outerHTML">Done</button>
      <button class="btn btn-sm btn-ghost"
              hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/status(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-vals='{"status": "UNVISITED"}'
              hx-target="closest .detail-section" hx-swap="outerHTML">Unvisit</button>
    </div>

    <div style="margin-bottom: var(--space-md);">
      <button class="btn btn-primary btn-sm" style="width: 100%;"
              hx-post="@{/campaigns/{cid}/current-scene(cid=${campaignId})}"
              hx-vals='{"sceneId": "${scene.id}"}'
              hx-target="#scenePanel"
              hx-swap="innerHTML">Set as Current Scene</button>
    </div>

    <div th:if="${scene.map != null}" style="margin-bottom: var(--space-md);">
      <h4 style="font-size: var(--text-sm); margin-bottom: var(--space-xs);">Linked Map</h4>
      <div style="display: flex; align-items: center; gap: var(--space-xs);">
        <span th:text="${scene.map.name}">Map Name</span>
        <a th:href="@{/campaigns/{cid}/maps/{mid}/play(cid=${campaignId},mid=${scene.map.id})}"
           class="btn btn-sm" target="_blank">Open</a>
      </div>
      <div th:if="${scene.pinX != null and scene.pinY != null}" style="font-size: var(--text-xs); color: var(--color-text-muted);">
        Pin: (<span th:text="${scene.pinX}">X</span>, <span th:text="${scene.pinY}">Y</span>)
      </div>
    </div>

    <div th:if="${scene.encounter != null}" style="margin-bottom: var(--space-md);">
      <h4 style="font-size: var(--text-sm); margin-bottom: var(--space-xs);">Linked Encounter</h4>
      <div style="display: flex; align-items: center; gap: var(--space-xs);">
        <span th:text="${scene.encounter.name}">Encounter Name</span>
        <a th:href="@{/campaigns/{cid}/encounters/{eid}(cid=${campaignId},eid=${scene.encounter.id})}"
           class="btn btn-sm">Activate</a>
      </div>
    </div>

    <div th:if="${scene.statBlocks != null and !scene.statBlocks.isEmpty()}" style="margin-bottom: var(--space-md);">
      <h4 style="font-size: var(--text-sm); margin-bottom: var(--space-xs);">Linked Statblocks</h4>
      <div th:each="sb : ${scene.statBlocks}" class="card" style="padding: var(--space-xs); margin-bottom: var(--space-xs); font-size: var(--text-sm);">
        <span th:text="${sb.name}">StatBlock</span>
        <button class="btn btn-danger btn-sm"
                hx-post="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/remove-statblock(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
                hx-vals='{"statBlockId": "${sb.id}"}'
                hx-target="#actionRail" hx-swap="innerHTML">&times;</button>
      </div>
    </div>

    <div th:if="${scene.handouts != null and !scene.handouts.isEmpty()}" style="margin-bottom: var(--space-md);">
      <h4 style="font-size: var(--text-sm); margin-bottom: var(--space-xs);">Linked Handouts</h4>
      <div th:each="h : ${scene.handouts}" style="display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xxs) 0; font-size: var(--text-sm);">
        <span th:text="${h.title}">Handout</span>
        <a th:href="@{/campaigns/{cid}/handouts/{hid}/present(cid=${campaignId},hid=${h.id})}"
           class="btn btn-sm" target="_blank">Present</a>
      </div>
    </div>

    <div style="display: flex; gap: var(--space-xs); margin-top: var(--space-md);">
      <button class="btn btn-ghost btn-sm"
              hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/move(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-vals='{"direction": -1}'
              hx-target="body" hx-swap="outerHTML">&larr; Prev</button>
      <button class="btn btn-ghost btn-sm"
              hx-put="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}/move(cid=${campaignId},aid=${adventure.id},sid=${scene.id})}"
              hx-vals='{"direction": 1}'
              hx-target="body" hx-swap="outerHTML">Next &rarr;</button>
    </div>
  </div>
</div>

<div th:fragment="statusBadge" xmlns:th="http://www.thymeleaf.org">
  <span class="badge"
        th:classappend="${scene.status.name() == 'DONE'} ? 'badge-success' :
                        (${scene.status.name() == 'VISITED'} ? 'badge-warning' : '')"
        th:text="${scene.status.name()}">STATUS</span>
</div>
