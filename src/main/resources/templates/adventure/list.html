<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Adventures',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Adventures',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/campaigns/{cid}(cid=${campaignId})}" class="btn btn-ghost">&larr; Back to Campaign</a>

<div id="page-content" class="page-content">
    <div th:if="${currentScene}" class="card" style="margin-bottom: var(--space-md); padding: var(--space-md);">
        <span class="adventure-continue-label" style="color: var(--color-text-muted);">Continue at:</span>
        <strong th:text="${currentScene.title}">Scene Title</strong>
        <a th:href="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}
                      (cid=${campaignId}, aid=${currentScene.chapter.adventure.id}, sid=${currentScene.id})}"
           class="btn" style="margin-left: var(--space-md);">Resume</a>
    </div>

    <div th:replace="~{adventure/_adventure-list :: adventureList}"></div>

    <div style="margin-top: var(--space-lg);">
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='CAMPAIGN', targetId=${campaignId})}"></th:block>
    </div>
</div>
</body>
</html>
