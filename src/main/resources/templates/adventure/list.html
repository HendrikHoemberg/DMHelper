<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Adventures',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Adventures',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/campaigns/{cid}(cid=${campaignId})}" class="btn btn-ghost">&larr; Back to Campaign</a>
<button id="primaryAction" class="btn btn-primary"
        th:attr="hx-get=@{/campaigns/{cid}/adventures/new(cid=${campaignId})}"
        hx-target="#adventure-form-placeholder"
        hx-swap="innerHTML"
        hx-disabled-elt="this">New adventure</button>

<div id="page-content" class="page-content">
    <th:block th:replace="~{fragments/_toolbar :: toolbar(
        action=@{/campaigns/{cid}/adventures(cid=${campaignId})},
        searchValue=${null},
        searchPlaceholder='Filter adventures by name…',
        filters=~{},
        actions=~{})}"></th:block>

    <div th:replace="~{adventure/_adventure-list :: adventureList}"></div>

    <section class="u-mt-lg">
        <h2 class="section-heading">Quick notes</h2>
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='CAMPAIGN', targetId=${campaignId})}"></th:block>
    </section>
</div>

<script>
    window.dmHelperFilterAdventures = function (query) {
        var needle = (query || '').trim().toLowerCase();
        document.querySelectorAll('[data-adventure-card]').forEach(function (card) {
            var haystack = (card.getAttribute('data-adventure-search') || '').toLowerCase();
            card.hidden = needle !== '' && haystack.indexOf(needle) === -1;
        });
    };
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('.page--index .toolbar__input');
        if (!input) return;
        input.addEventListener('input', function () {
            window.dmHelperFilterAdventures(this.value);
        });
    });
</script>
</body>
</html>
