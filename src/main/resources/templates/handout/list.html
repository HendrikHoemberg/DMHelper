<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Handouts',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Handouts',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaign.id})}" class="btn btn-ghost">&larr; Back to Campaign</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{fragments/_toolbar :: toolbar(
        action=@{/campaigns/{cid}/handouts(cid=${campaignId})},
        searchValue=${null},
        searchPlaceholder='Filter handouts by name…',
        filters=~{},
        actions=~{})}"></th:block>

    <div id="handout-upload" class="inline-form" style="margin-bottom: var(--space-lg);">
        <h3>Upload New Handout</h3>
        <form th:action="@{/campaigns/{cid}/handouts(cid=${campaignId})}"
              method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Image (PNG, JPEG, WebP)</label>
                <input type="file" name="file" accept="image/png,image/jpeg,image/webp" required>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Optional — uses filename if blank">
            </div>
            <div class="form-group">
                <label>Tags (comma-separated)</label>
                <input type="text" name="tags" placeholder="e.g. quest, regent, letter">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Upload</button>
            </div>
        </form>
    </div>

    <div class="card-grid" id="handoutList" th:if="${not #lists.isEmpty(handouts)}">
        <th:block th:each="h : ${handouts}">
            <th:block th:replace="~{handout/_card :: card(${h})}"></th:block>
        </th:block>
    </div>

    <div class="empty-state-host" th:if="${#lists.isEmpty(handouts)}">
        <th:block th:replace="~{common/_empty-state :: empty-state-with-icon(
            'No handouts yet', 'Upload handout', '#handout-upload',
            'Upload images or documents to reveal to players during a session.', 'scroll')}"></th:block>
    </div>
</div>

<script>
    window.dmHelperFilterHandouts = function (query) {
        var needle = (query || '').trim().toLowerCase();
        document.querySelectorAll('[data-handout-card]').forEach(function (card) {
            var haystack = (card.getAttribute('data-handout-search') || '').toLowerCase();
            card.hidden = needle !== '' && haystack.indexOf(needle) === -1;
        });
    };
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('.page--index .toolbar__input');
        if (!input) return;
        input.addEventListener('input', function () {
            window.dmHelperFilterHandouts(this.value);
        });
    });
</script>
</body>
</html>
