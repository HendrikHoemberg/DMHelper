<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<article class="card handout-card" th:fragment="card(handout)" th:id="'handout-' + ${handout.id}">
    <div class="handout-card-body">
        <div class="handout-thumb">
            <img th:src="@{/files/{id}(id=${handout.id})}"
                 th:alt="${handout.title}">
        </div>
        <div class="u-flex-1">
            <h3>
                <a th:href="@{/campaigns/{cid}/handouts/{id}/present(cid=${handout.campaign.id},id=${handout.id})}"
                   th:text="${handout.title}">Title</a>
            </h3>
            <div class="handout-badges">
                <span th:if="${handout.presented}" class="badge badge-success">Given to players</span>
                <span th:if="${handout.dmOnly}" class="badge badge-warning">DM only</span>
                <span th:each="tag : ${#strings.arraySplit(handout.tags, ',')}"
                      th:if="${!#strings.isEmpty(tag.trim())}"
                      th:text="${tag.trim()}"
                      class="badge badge-tag"></span>
            </div>
        </div>
    </div>
    <div class="card-actions">
        <button class="btn btn-ghost"
                th:hx-get="@{/campaigns/{cid}/handouts/{id}/present(cid=${handout.campaign.id},id=${handout.id})}"
                hx-target="body" hx-swap="beforeend">
            Present
        </button>
        <button class="btn btn-danger"
                th:hx-delete="@{/campaigns/{cid}/handouts/{id}(cid=${handout.campaign.id},id=${handout.id})}"
                hx-confirm="Delete this handout?"
                hx-swap="none">
            Delete
        </button>
    </div>
    <div class="u-mt-md">
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${handout.campaign.id}, targetType='HANDOUT', targetId=${handout.id})}"></th:block>
    </div>
</article>
</html>
