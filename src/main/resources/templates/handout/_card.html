<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<article class="card handout-card" th:fragment="card(handout)" th:id="'handout-' + ${handout.id}">
    <div class="handout-card-body">
        <div class="handout-thumb">
            <img th:src="@{/files/{id}(id=${handout.id})}"
                 th:alt="${handout.title}">
        </div>
        <div class="u-flex-1">
            <h3>
                <a th:href="@{/campaigns/{cid}/handouts/{id}/present(cid=${handout.campaign.id},id=${handout.id})}"
                   th:text="${handout.title}">Title</a>
            </h3>
            <div class="handout-badges">
                <span th:if="${handout.presented}" class="badge badge-success">Given to players</span>
                <th:block th:switch="${handout.safetyClassification.name()}">
                    <span th:case="'DM_SOURCE'" class="badge badge-warning">DM source</span>
                    <span th:case="'PLAYER_SAFE'" class="badge badge-success">Reviewed player-safe</span>
                    <span th:case="'PLAYER_DERIVATIVE'" class="badge badge-info">Player derivative</span>
                    <span th:case="'UNREVIEWED'" class="badge badge-secondary">Unreviewed</span>
                </th:block>
                <span th:each="tag : ${#strings.arraySplit(handout.tags, ',')}"
                      th:if="${!#strings.isEmpty(tag.trim())}"
                      th:text="${tag.trim()}"
                      class="badge badge-tag"></span>
            </div>
        </div>
    </div>
    <div class="card-actions">
        <button class="btn btn-ghost"
                th:hx-get="@{/campaigns/{cid}/handouts/{id}/present(cid=${handout.campaign.id},id=${handout.id})}"
                hx-target="body" hx-swap="beforeend">
            Present
        </button>
        <th:block th:if="${!handout.safetyClassification.isPresentable()}">
            <button class="btn btn-ghost"
                    th:hx-put="@{/campaigns/{cid}/handouts/{id}/classification(cid=${handout.campaign.id},id=${handout.id})}"
                    th:attr="hx-vals='{&quot;classification&quot;: &quot;PLAYER_SAFE&quot;}'"
                    th:hx-target="${'#handout-' + handout.id}"
                    hx-swap="outerHTML">
                Review as player-safe
            </button>
            <button class="btn btn-ghost"
                    th:hx-put="@{/campaigns/{cid}/handouts/{id}/classification(cid=${handout.campaign.id},id=${handout.id})}"
                    th:attr="hx-vals='{&quot;classification&quot;: &quot;DM_SOURCE&quot;}'"
                    th:hx-target="${'#handout-' + handout.id}"
                    hx-swap="outerHTML">
                Mark as DM source
            </button>
            <button class="btn btn-ghost"
                    th:attr="data-source-id=${handout.id},data-campaign-id=${handout.campaign.id}"
                    onclick="openDerivativeDialog(this.dataset.sourceId, this.dataset.campaignId)">
                Create player derivative
            </button>
        </th:block>
        <th:block th:if="${handout.safetyClassification.isPresentable()}">
            <button class="btn btn-ghost"
                    th:hx-put="@{/campaigns/{cid}/handouts/{id}/classification(cid=${handout.campaign.id},id=${handout.id})}"
                    th:attr="hx-vals='{&quot;classification&quot;: &quot;UNREVIEWED&quot;}'"
                    th:hx-target="${'#handout-' + handout.id}"
                    hx-swap="outerHTML">
                Mark unreviewed
            </button>
        </th:block>
        <button class="btn btn-danger"
                th:hx-delete="@{/campaigns/{cid}/handouts/{id}(cid=${handout.campaign.id},id=${handout.id})}"
                hx-confirm="Delete this handout?"
                hx-swap="none">
            Delete
        </button>
    </div>
    <div class="u-mt-md">
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${handout.campaign.id}, targetType='HANDOUT', targetId=${handout.id})}"></th:block>
    </div>
</article>
</html>
