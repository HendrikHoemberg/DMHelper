<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="handout-overlay" id="handoutOverlay" th:fragment="overlay"
     th:attr="data-presentation-state=${handout != null ? 'ready' : 'unavailable'},
              data-handout-visibility=${handout != null && !handout.dmOnly ? 'player-safe' : 'dm-only'}"
     onclick="dismissHandout(this)">
    <th:block th:if="${handout == null}">
        <div th:replace="~{fragments/_states :: unavailable(
            title='This handout is not available',
            description='The asset may have been removed or could not be loaded.',
            retry=~{::#unavailableClose})}"></div>
        <button id="unavailableClose" type="button" class="btn btn-ghost"
                onclick="dismissHandout(this.closest('.handout-overlay'))">Close</button>
    </th:block>
    <img th:if="${handout != null}" th:src="@{/files/{id}(id=${handout.id})}"
         th:alt="${handout.title}" onclick="event.stopPropagation()">
    <div class="handout-caption" th:if="${handout != null}" th:text="${handout.title}"
         onclick="event.stopPropagation()">Title</div>
    <div class="overlay-close-hint">
        Click anywhere to close
    </div>
</div>
</html>
