<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${listTitle},
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${listTitle},
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" class="btn btn-primary"
   th:href="@{${createHref}}"
   th:text="'+ ' + ${createLabel}">+ New Cue</a>
<a id="secondaryActions" class="btn btn-ghost"
   th:href="@{/campaigns/{id}(id=${campaignId})}">&larr; Back to Campaign</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{fragments/_toolbar :: toolbar(
        action=@{/campaigns/{cid}/audio/cues(cid=${campaignId})},
        searchValue=${null},
        searchPlaceholder='Filter cues by name or key…',
        filters=~{},
        actions=~{})}"></th:block>

    <div id="cue-grid" class="card-grid card-grid--bounded empty-state-host">
        <th:block th:if="${cues == null or cues.isEmpty()}">
            <th:block th:replace="~{common/_empty-state :: empty-state(message='No audio cues yet.', actionText=null, actionHref=null, description=null)}"></th:block>
        </th:block>
        <th:block th:each="cue : ${cues}">
            <th:block th:replace="~{audio/_card :: card(cue=${cue}, campaignId=${campaignId})}"></th:block>
        </th:block>
    </div>
</div>

<script>
    window.dmHelperFilterCues = function (query) {
        var needle = (query || '').trim().toLowerCase();
        document.querySelectorAll('[data-audio-card]').forEach(function (card) {
            var haystack = (card.getAttribute('data-audio-search') || '').toLowerCase();
            card.hidden = needle !== '' && haystack.indexOf(needle) === -1;
        });
    };
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('.page--index .toolbar__input');
        if (!input) return;
        input.addEventListener('input', function () {
            window.dmHelperFilterCues(this.value);
        });
    });
</script>
</body>
</html>
