<div th:fragment="objectiveList" xmlns:th="http://www.thymeleaf.org">
  <th:block th:if="${error != null}"><div th:replace="~{fragments/_states :: failed(title=${error}, description=null, retry=~{})}"></div></th:block>
  <div th:if="${quest.objectives.empty}" class="empty-state">No objectives yet.</div>
  <div th:unless="${quest.objectives.empty}">
    <div th:each="obj : ${quest.objectives}" class="card card--compact u-mb-xs" th:attr="data-objective-id=${obj.id}">
      <div class="u-flex u-gap-xs u-items-center">
        <span class="badge"
              th:classappend="${obj.status.name() == 'COMPLETED'} ? 'badge--success' :
                              (${obj.status.name() == 'ACTIVE'} ? 'badge--warning' : '')"
              th:text="${#enums.label(obj.status)}">STATUS</span>
        <span class="badge badge--info" data-objective-completion-mode
              th:text="${#enums.label(obj.completionMode)}">All</span>
        <strong th:text="${obj.title}">Objective</strong>
        <span class="u-text-xs text-muted" th:if="${obj.sortOrder > 0}" th:text="|#${obj.sortOrder}|">#</span>
      </div>
      <div th:if="${obj.description}" class="u-text-sm" th:text="${obj.description}">Description</div>
      <div th:if="${obj.dependencies != null and !obj.dependencies.isEmpty()}"
           class="u-text-sm text-muted" data-objective-prerequisite>
        <span th:each="dep : ${obj.dependencies}"
              th:text="|Requires: ${dep.prerequisiteObjective.title}|">Requires</span>
      </div>
      <span th:if="${obj.sourceLocator}" class="u-text-xs text-muted" th:text="|Source: ${obj.sourceLocator}|">Source</span>
      <div class="u-flex u-gap-xs u-mt-xs">
        <button class="btn btn-sm"
                th:classappend="${obj.status.name() == 'COMPLETED'} ? 'btn-success' : 'btn-ghost'"
                th:hx-post="@{/campaigns/{cid}/quests/objectives/{oid}/status(cid=${campaignId},oid=${obj.id})}"
                hx-vals='{"status": "COMPLETED"}'
                hx-target="closest [data-objective-id]" hx-swap="outerHTML"
                hx-disabled-elt="this">Complete</button>
        <button class="btn btn-sm btn-ghost"
                th:hx-post="@{/campaigns/{cid}/quests/objectives/{oid}/status(cid=${campaignId},oid=${obj.id})}"
                hx-vals='{"status": "ACTIVE"}'
                hx-target="closest [data-objective-id]" hx-swap="outerHTML"
                hx-disabled-elt="this">Activate</button>
        <button class="btn btn-sm btn-ghost"
                th:hx-post="@{/campaigns/{cid}/quests/objectives/{oid}/status(cid=${campaignId},oid=${obj.id})}"
                hx-vals='{"status": "NOT_STARTED"}'
                hx-target="closest [data-objective-id]" hx-swap="outerHTML"
                hx-disabled-elt="this">Reset</button>
        <button class="btn btn-danger btn-sm action-row__destructive"
                th:hx-delete="@{/campaigns/{cid}/quests/{qid}/objectives/{oid}(cid=${campaignId},qid=${quest.id},oid=${obj.id})}"
                hx-target="#objectiveList" hx-swap="innerHTML"
                th:hx-confirm="|Delete the ${obj.title} objective?|"
                data-confirm-consequence="The objective and every dependency that points at it are deleted permanently."
                hx-disabled-elt="this">&times;</button>
      </div>
    </div>
  </div>
</div>
