<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="|Quests — ${campaign.name}|">Quests</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <h1>Quests</h1>
                <div class="page-header-actions">
                    <a class="btn btn-primary"
                       th:href="@{/campaigns/{cid}/quests/create(cid=${campaignId})}">+ New Quest</a>
                </div>
            </div>
            <th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
            <div th:if="${quests.empty}" class="empty-state">No quests yet.</div>
            <div th:unless="${quests.empty}" class="card-grid">
                <div th:each="quest : ${quests}" class="card">
                    <div class="card-header">
                        <a th:href="@{/campaigns/{cid}/quests/{qid}(cid=${campaignId},qid=${quest.id})}"
                           th:text="${quest.title}">Quest Title</a>
                        <span class="badge" th:text="${quest.status.name()}">STATUS</span>
                    </div>
                    <div th:if="${quest.summary}" class="card-body" th:text="${quest.summary}">Summary</div>
                    <div class="card-footer">
                        <span th:if="${quest.sourceLocator}" class="u-text-xs text-muted"
                              th:text="|Source: ${quest.sourceLocator}|">Source</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
