<div th:fragment="dependencyList" xmlns:th="http://www.thymeleaf.org">
  <th:block th:if="${error != null}"><div th:replace="~{common/_error :: error(message=${error})}"></div></th:block>
  <div th:if="${quest.objectives.empty}" class="empty-state">No objectives to display dependencies for.</div>
  <div th:unless="${quest.objectives.empty}">
    <div th:each="obj : ${quest.objectives}">
      <div th:if="${obj.dependencies != null and !obj.dependencies.isEmpty()}">
        <strong class="u-text-sm" th:text="|${obj.title} depends on:|">Depends on</strong>
        <div th:each="dep : ${obj.dependencies}" class="card card--compact u-mb-xs">
          <span th:text="${dep.prerequisiteObjective.title}">Prerequisite</span>
          <button class="btn btn-danger btn-sm"
                  th:hx-delete="@{/campaigns/{cid}/quests/{qid}/dependencies(cid=${campaignId},qid=${quest.id})}"
                  th:attr="hx-vals='{&quot;objectiveId&quot;: &quot;' + ${dep.objective.id} + '&quot;, &quot;prerequisiteObjectiveId&quot;: &quot;' + ${dep.prerequisiteObjective.id} + '&quot;}'"
                  hx-target="#dependencyList" hx-swap="innerHTML"
                  hx-confirm="Remove this dependency?">&times;</button>
        </div>
      </div>
    </div>
  </div>
</div>
