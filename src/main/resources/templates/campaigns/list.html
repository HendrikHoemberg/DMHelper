<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Campaigns',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Campaigns',
        summary=${campaigns == null ? '0 campaigns' : campaigns.size() + ' campaigns'},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" th:href="@{/campaigns/new}" class="btn btn-primary">New campaign</a>
<button id="secondaryActions" class="btn" type="button"
        onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
    Import campaign
</button>
<!-- The empty state's two creation paths (spec 11.1). This lives outside #page-content on
     purpose: inside it, the whole slot renders and the CTA showed on every populated index
     too, duplicating both header actions. -->
<div id="createPaths" class="u-flex u-gap-xs">
    <a th:href="@{/campaigns/new}" class="btn">Create a campaign</a>
    <button class="btn btn-ghost" type="button"
            onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
        Import a package
    </button>
</div>

<div id="page-content" class="page-content">
    <div class="bookshelf" id="campaign-grid">
        <div class="shelf-row">
            <th:block th:if="${campaigns == null || campaigns.isEmpty()}">
                <th:block th:replace="~{fragments/_states :: empty(
                    icon='castle',
                    title='No campaigns yet',
                    description='Create one from scratch, or import a campaign package.',
                    cta=~{::#createPaths})}"></th:block>
            </th:block>
            <th:block th:each="campaign : ${campaigns}">
                <th:block th:replace="~{campaigns/_card :: card(campaign=${campaign}, sigil=${campaignSigils[campaign.id]})}"></th:block>
            </th:block>
        </div>
    </div>
</div>
<th:block th:replace="~{campaigns/_import-dialog :: import-dialog}"></th:block>
</body>
</html>
