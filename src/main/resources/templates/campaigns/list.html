<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title>DMHelper — Campaigns</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-shell">
            <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <div>
                    <div class="page-header-eyebrow">The Grimoire</div>
                    <h1 data-display-title>Campaigns</h1>
                    <div class="rule-taper"></div>
                </div>
                <button class="btn" onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
                    Import Campaign Package
                </button>
            </div>

            <div class="bookshelf" id="campaign-grid">
                <div class="shelf-row">
                    <th:block th:if="${campaigns == null || campaigns.isEmpty()}">
                        <th:block th:replace="~{common/_empty-state :: empty-state('No campaigns yet. Every saga starts with a blank page.', 'Create campaign', @{/campaigns/new}, null)}"></th:block>
                    </th:block>
                    <th:block th:each="campaign : ${campaigns}">
                        <th:block th:replace="~{campaigns/_card :: card(campaign=${campaign}, sigil=${campaignSigils[campaign.id]})}"></th:block>
                    </th:block>
                    <a th:href="@{/campaigns/new}" class="book-cover book-cover--blank">
                        <span class="book-cover-plus">+</span>
                        <span class="book-cover-label">Blank Tome</span>
                    </a>
                </div>
            </div>
        </main>

    </div>
    <th:block th:replace="~{campaigns/_import-dialog :: import-dialog}"></th:block>
</body>
</html>
