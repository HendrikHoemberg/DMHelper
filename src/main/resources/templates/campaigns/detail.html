<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper — ' + ${campaign.name}">DMHelper — Campaign</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="dash-header">
                <h1 th:text="${campaign.name}">Campaign Name</h1>
                <div class="rule-taper rule-taper--gold"></div>
                <p class="dash-desc" th:if="${campaign.description != null and !campaign.description.isBlank()}"
                   th:text="${campaign.description}">Description</p>
            </div>

            <div class="dash-actions u-mb-lg">
                <a class="btn btn-primary" th:href="@{/campaigns/{id}/session(id=${campaign.id})}">Run Session</a>
                <a class="btn" th:href="@{/campaigns/{id}/adventures(id=${campaign.id})}">Plan Adventures</a>
                <a th:href="@{/campaigns/{id}/package(id=${campaign.id})}"
                   class="btn" download>Export Campaign Package</a>
                <a th:href="@{/campaigns/{id}/export(id=${campaign.id})}"
                   class="btn" download>Export Legacy v1 JSON</a>
                <button class="btn"
                        onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
                    Import Campaign Package
                </button>
                <form hx-post="/campaigns/import"
                      hx-encoding="multipart/form-data"
                      class="u-contents">
                    <label class="btn">
                        Import Legacy v1 JSON
                        <input type="file" name="file" accept=".dmcampaign.json,application/json"
                               onchange="this.form.requestSubmit()"
                               class="hidden">
                    </label>
                </form>
                <button class="btn btn-danger"
                        th:hx-delete="@{/campaigns/{id}(id=${campaign.id})}"
                        hx-confirm="Delete this campaign?"
                        hx-target="body"
                        hx-swap="outerHTML">
                    Delete Campaign
                </button>
            </div>

            <th:block th:replace="~{party/_summary-bar :: summary-bar(members=${partyMembers}, oob=null)}"></th:block>

            <div class="dash-grid">
                <section class="card dash-card" style="--stagger: 0">
                    <h3>Session Plan</h3>
                    <th:block th:if="${sessionPlan != null}">
                        <a th:href="@{/campaigns/{cid}/notes/{nid}(cid=${campaign.id}, nid=${sessionPlan.id})}"
                           th:text="${sessionPlan.title}" class="dash-link">Plan title</a>
                        <div class="note-body dash-plan-preview"
                             th:utext="${#markdown.toHtml(#strings.abbreviate(sessionPlan.body != null ? sessionPlan.body : '', 400))}"></div>
                    </th:block>
                    <p th:unless="${sessionPlan != null}" class="text-muted u-text-sm">
                        No session plan yet — create a SESSION_PLAN note.
                    </p>
                </section>

                <section class="card dash-card" style="--stagger: 1">
                    <h3>Recent Notes</h3>
                    <ul class="dash-list">
                        <li th:each="n : ${recentNotes}">
                            <a class="dash-link" th:href="@{/campaigns/{cid}/notes/{nid}(cid=${campaign.id}, nid=${n.id})}"
                               th:text="${n.title}">Note</a>
                            <span class="text-muted u-text-sm" th:text="${n.type}">TYPE</span>
                        </li>
                        <li th:if="${recentNotes.isEmpty()}" class="text-muted u-text-sm">Nothing written yet.</li>
                    </ul>
                </section>

                <section class="card dash-card" style="--stagger: 2">
                    <h3>Edit Campaign</h3>
                    <form th:hx-put="@{/campaigns/{id}(id=${campaign.id})}"
                          hx-target="body"
                          hx-swap="outerHTML">
                        <div class="form-group">
                            <label for="editName">Name</label>
                            <input type="text" id="editName" name="name" required
                                   th:value="${campaign.name}">
                        </div>
                        <div class="form-group">
                            <label for="editDescription">Description</label>
                            <textarea id="editDescription" name="description"
                                      th:text="${campaign.description}"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <th:block th:replace="~{campaigns/_import-dialog :: import-dialog}"></th:block>
</body>
</html>
