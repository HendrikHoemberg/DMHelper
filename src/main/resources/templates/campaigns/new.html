<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='New Campaign',
          archetype='form',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='New Campaign',
        summary='Every saga starts with a blank page.',
        breadcrumb=~{},
        primary=~{},
        secondary=~{})}"></th:block>
</div>

<div id="page-content" class="page-content">
    <th:block th:replace="~{campaigns/_form :: form(true)}"></th:block>
</div>
</body>
</html>
