<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Settings',
          archetype='form',
          surface='admin',
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Settings',
        summary=${campaign.name},
        breadcrumb=~{::#breadcrumb},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" aria-label="Breadcrumb">
    <a th:href="@{/campaigns/{id}(id=${campaign.id})}" th:text="${campaign.name}">Campaign</a>
    <span>Settings</span>
</nav>
<a id="primaryAction" th:href="@{/campaigns/{id}(id=${campaign.id})}" class="btn btn-ghost">&larr; Back to Campaign</a>
<button id="secondaryActions" class="btn"
        onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
    Import Campaign Package
</button>

<div id="page-content" class="page-content">
    <section class="card u-mt-lg" data-settings-group="details">
        <h2>Details</h2>
        <form th:hx-put="@{/campaigns/{id}(id=${campaign.id})}"
              hx-target="body"
              hx-swap="outerHTML"
              hx-disabled-elt="find button[type='submit']">
            <div class="form-group">
                <label for="editName">Name</label>
                <input type="text" id="editName" name="name" required
                       th:value="${campaign.name}">
            </div>
            <div class="form-group">
                <label for="editDescription">Description</label>
                <textarea id="editDescription" name="description"
                          th:text="${campaign.description}"></textarea>
            </div>
            <div class="form-actions">
                <input type="hidden" name="returnTo" value="settings">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </section>

    <section class="card u-mt-lg" data-settings-group="packages">
        <h2>Campaign package</h2>
        <div class="dash-data-tools__body">
            <div class="export-package-group">
                <form th:action="@{/campaigns/{id}/package(id=${campaign.id})}"
                      method="GET">
                    <input type="hidden" name="includeCombatLog" value="true" id="includeCombatLog">
                    <input type="hidden" name="includeDiceHistory" value="true" id="includeDiceHistory">
                    <label class="checkbox-label">
                        <input type="checkbox" checked
                               onchange="document.getElementById('includeCombatLog').value=this.checked">
                        Combat Log
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" checked
                               onchange="document.getElementById('includeDiceHistory').value=this.checked">
                        Dice History
                    </label>
                    <button type="submit" class="btn">Export Campaign Package</button>
                </form>
            </div>
            <button class="btn"
                    onclick="Alpine.$data(document.querySelector('[x-data=\'campaignImport\']')).openDialog()">
                Import Campaign Package
            </button>
        </div>
    </section>

    <section class="card u-mt-lg" data-settings-group="data">
        <h2>Legacy data</h2>
        <p class="text-muted u-text-sm">Tools for the pre-package v1 JSON format.</p>
        <div class="dash-data-tools__body">
            <a th:href="@{/campaigns/{id}/export(id=${campaign.id})}"
               class="btn" download>Export Legacy v1 JSON</a>
            <form hx-post="/campaigns/import"
                  hx-encoding="multipart/form-data"
                  hx-disabled-elt="find input[type='file']"
                  class="u-contents">
                <label class="btn">
                    Import Legacy v1 JSON
                    <input type="file" name="file" accept=".dmcampaign.json,application/json"
                           onchange="this.form.requestSubmit()"
                           class="hidden">
                </label>
            </form>
        </div>
    </section>

    <section class="card u-mt-lg surface-danger-zone" data-settings-group="danger">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">Once you delete a campaign, there is no going back. Please be certain.</p>
        <div class="action-row">
            <span class="action-row__destructive">
                <button class="btn btn-danger"
                        th:hx-delete="@{/campaigns/{id}(id=${campaign.id})}"
                        hx-confirm="Delete this campaign? This cannot be undone."
                        hx-target="body"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this"
                        th:attr="data-confirm-consequence=${'Deleting ' + campaign.name + ' removes the campaign and everything in it, permanently.'}">
                    Delete Campaign
                </button>
            </span>
        </div>
    </section>
</div>
<th:block th:replace="~{campaigns/_import-dialog :: import-dialog}"></th:block>
</body>
</html>
