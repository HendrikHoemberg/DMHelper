<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="book-cover-wrapper" th:fragment="card(campaign, sigil)">
    <a class="book-cover"
       th:href="@{/campaigns/{id}(id=${campaign.id})}">
        <svg class="campaign-sigil" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <circle class="campaign-sigil__ring" cx="50" cy="50" r="39"></circle>
            <path class="campaign-sigil__mark"
                  th:attr="d=${sigil.path},transform=|rotate(${sigil.rotation} 50 50)|"></path>
        </svg>
        <h3 th:text="${campaign.name}">Campaign Name</h3>
        <div class="book-meta" th:text="${campaign.authorLine}">4 heroes · opened 8 July</div>
        <!-- Session progress, not readiness: the warning tone means "unresolved, caution"
             (spec 6.4), and a campaign being underway is neither. Card-level readiness needs
             a per-campaign readiness roll-up on the index model and is still outstanding. -->
        <th:block th:replace="~{fragments/_badge :: badge(
            tone=${campaign.currentSceneId != null ? 'info' : 'neutral'},
            icon=${campaign.currentSceneId != null ? 'play' : 'flag'},
            label=${campaign.currentSceneId != null ? 'In progress' : 'Unstarted'})}"></th:block>
    </a>
    <div class="card-actions">
        <button class="btn btn-ghost btn-xs"
                aria-label="Delete campaign"
                th:hx-delete="@{/campaigns/{id}(id=${campaign.id})}"
                hx-confirm="Delete this campaign?"
                hx-target="closest .book-cover-wrapper"
                hx-swap="outerHTML swap:200ms"
                hx-disabled-elt="this">
            Delete
        </button>
    </div>
</div>
</html>
