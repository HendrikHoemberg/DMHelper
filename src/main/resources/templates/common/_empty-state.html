<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="empty-state(message, actionText, actionHref, description)">
    <th:block th:replace="~{common/_empty-state :: empty-state-with-icon(
        message=${message}, actionText=${actionText}, actionHref=${actionHref},
        description=${description}, icon=${null})}"></th:block>
</th:block>

<th:block th:fragment="empty-state-with-icon(message, actionText, actionHref, description, icon)">
    <th:block th:replace="~{common/_empty-state :: empty-state-with-cta(
        message=${message}, description=${description}, icon=${icon},
        cta=~{common/_empty-state :: link-cta(actionText=${actionText}, actionHref=${actionHref})})}"></th:block>
</th:block>

<!-- Takes the call to action as a fragment. Pages whose "add" route only serves an htmx
     fragment must pass ~{common/_form-cta :: swap-cta(...)} rather than a plain link. -->
<div class="empty-state" th:fragment="empty-state-with-cta(message, description, icon, cta)">
    <div th:if="${icon != null}" class="empty-state__icon" aria-hidden="true">
        <svg th:replace="~{common/_icon :: icon-sized(name=${icon}, size='24')}"></svg>
    </div>
    <p class="empty-state__title" th:text="${message}">No items yet.</p>
    <p th:if="${description != null}" class="empty-state__desc text-muted"
       th:text="${description}">A short explanation.</p>
    <th:block th:replace="${cta}"></th:block>
</div>

<a th:fragment="link-cta(actionText, actionHref)" th:if="${actionHref != null}"
   th:href="${actionHref}" th:text="${actionText}"
   class="btn btn-ghost empty-state__cta">Create</a>

</html>
