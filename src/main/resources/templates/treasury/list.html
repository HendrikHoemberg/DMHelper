<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Treasury & Loot',
          archetype='operational',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Treasury &amp; Loot',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<button id="primaryAction" class="btn btn-primary"
        th:hx-get="@{/campaigns/{id}/treasury/new(id=${campaignId})}"
        hx-target="#treasury-form-area"
        hx-swap="innerHTML"
        hx-disabled-elt="this">
    + Add Item
</button>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
    <div id="treasury-form-area"></div>

    <!-- Gold Balances -->
    <div th:if="${not #lists.isEmpty(balances)}" class="detail-section">
        <h2>Gold Balances</h2>
        <table class="data-table balances-table">
            <thead>
                <tr>
                    <th>Holder</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${balances}">
                    <td th:text="${b.holder()}">Holder</td>
                    <td class="u-num" th:text="${b.balance() + ' ' + b.currency()}">0 GP</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Item Assignments by Holder -->
    <div th:each="pm : ${partyMembers}" class="detail-section">
        <th:block th:with="holderItems=${assignmentsByMember.get(pm.id)}">
            <h2 th:text="|${pm.characterName}&apos;s Items|">PC's Items</h2>
            <th:block th:with="attunementCount=${#lists.toList(holderItems).?[attuned()].size()}">
                <th:block th:if="${attunementCount >= 3}">
                    <div th:replace="~{treasury/_attunement-warn :: warning(count=${attunementCount})}"></div>
                </th:block>
                <table class="data-table assignment-table" th:if="${not #lists.isEmpty(holderItems)}">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Attuned</th>
                            <th><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- th:each on an outer wrapper: th:replace would otherwise outrank it and run once with a null 'a'. -->
                        <th:block th:each="a : ${holderItems}">
                            <tr th:replace="~{treasury/_card :: card(assignment=${a}, attunementCount=${attunementCount})}"></tr>
                        </th:block>
                    </tbody>
                </table>
            </th:block>
            <th:block th:if="${#lists.isEmpty(holderItems)}"><th:block th:replace="~{fragments/_states :: empty(
                icon=null,
                title='No items assigned',
                description=null,
                cta=~{})}"></th:block></th:block>
        </th:block>
    </div>

    <!-- Party Stash -->
    <div class="detail-section empty-state-host">
        <th:block th:with="stashItems=${#lists.toList(assignments).?[partyMemberId() == null]}">
            <h2>Party Stash</h2>
            <table class="data-table assignment-table" th:if="${not #lists.isEmpty(stashItems)}">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Attuned</th>
                        <th><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <th:block th:each="a : ${stashItems}">
                        <tr th:replace="~{treasury/_card :: card(assignment=${a}, attunementCount=0)}"></tr>
                    </th:block>
                </tbody>
            </table>
            <th:block th:if="${#lists.isEmpty(stashItems)}">
                <th:block th:replace="~{fragments/_states :: empty(
                    icon='gem',
                    title='The party stash is empty',
                    description='Track coin, gems, and magic items the party is carrying.',
                    cta=~{common/_form-cta :: swap-cta(
                        actionText='Add item',
                        actionUrl=@{/campaigns/{id}/treasury/new(id=${campaignId})},
                        target='#treasury-form-area')})}"></th:block>
            </th:block>
        </th:block>
    </div>
</div>
</body>
</html>
