<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="holderSection" class="detail-section">
    <h2 th:text="|${holderName}'s Equipment &amp; Loot|">Equipment & Loot</h2>

    <!-- Gold Balance -->
    <div th:each="b : ${balances}" th:if="${b.holder().equals(holderName)}"
         style="margin-bottom: var(--space-sm);">
        <strong>Gold:</strong> <span class="u-num" th:text="${b.balance() + ' ' + b.currency()}">0 GP</span>
    </div>

    <th:block th:if="${attunementCount != null and attunementCount >= 3}">
        <div th:replace="~{treasury/_attunement-warn :: warning(count=${attunementCount})}"></div>
    </th:block>

    <table class="data-table assignment-table" th:if="${not #lists.isEmpty(assignments)}">
        <thead>
            <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Attuned</th>
                <th><span class="sr-only">Actions</span></th>
            </tr>
        </thead>
        <tbody>
            <!-- th:each on an outer wrapper: th:replace outranks th:each, so on the same tag it runs once with a null 'a'. -->
            <th:block th:each="a : ${assignments}">
                <tr th:replace="~{treasury/_card :: card(assignment=${a}, attunementCount=${attunementCount})}"></tr>
            </th:block>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(assignments)}" class="empty-state">No items assigned</div>
</div>
</html>
