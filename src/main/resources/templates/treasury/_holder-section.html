<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="holderSection" class="detail-section">
    <h2 th:text="|${holderName}'s Equipment &amp; Loot|">Equipment & Loot</h2>

    <!-- Gold Balance -->
    <div th:each="b : ${balances}" th:if="${b.holder().equals(holderName)}"
         style="margin-bottom: var(--space-sm); color: var(--color-accent);">
        <strong>Gold:</strong> <span th:text="${b.balance() + ' ' + b.currency()}">0 GP</span>
    </div>

    <div th:if="${not #lists.isEmpty(assignments)}" style="display:flex; flex-direction:column; gap: var(--space-sm);">
        <!-- th:each on an outer wrapper: th:replace outranks th:each, so on the same tag it runs once with a null 'a'. -->
        <th:block th:each="a : ${assignments}">
            <div th:replace="~{treasury/_card :: card(assignment=${a}, attunementCount=${attunementCount})}"></div>
        </th:block>
    </div>
    <div th:if="${#lists.isEmpty(assignments)}" class="empty-state">No items assigned</div>
</div>
</html>
