<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<tr th:fragment="card(assignment, attunementCount)"
    th:id="'assignment-' + ${assignment.id()}"
    class="assignment-row">

    <td>
        <div class="u-fw-600" th:text="${assignment.itemName()}">Item Name</div>
        <div class="detail-meta u-mt-xs">
            <span class="badge" th:text="${assignment.holderName()}">Holder</span>
            <span th:if="${assignment.quantity() > 1}" class="badge u-num" th:text="'x' + ${assignment.quantity()}">x1</span>
        </div>
    </td>
    <td class="u-num" th:text="${assignment.quantity()}">1</td>
    <td>
        <span th:if="${assignment.attuned()}" class="badge badge--info">Attuned</span>
        <span th:unless="${assignment.attuned()}" class="text-muted">—</span>
    </td>
    <td class="action-row">
        <form th:method="'put'"
              th:hx-put="@{/campaigns/{cid}/treasury/{id}/attune(cid=${assignment.campaignId()}, id=${assignment.id()})}"
              hx-target="closest .detail-section" hx-swap="outerHTML" class="u-inline"
              hx-disabled-elt="find button[type='submit']">
            <button class="btn btn-ghost btn-xs"
                    th:text="${assignment.attuned()} ? 'Unattune' : 'Attune'">Attune</button>
        </form>
        <form th:method="'put'"
              th:hx-put="@{/campaigns/{cid}/treasury/{id}/quantity(cid=${assignment.campaignId()}, id=${assignment.id()})}"
              hx-target="closest tr" hx-swap="outerHTML" class="u-flex u-gap-xs"
              hx-disabled-elt="find button[type='submit']">
            <label class="u-flex u-gap-xs" style="align-items: center;">
                <span class="text-muted u-text-xs">Qty</span>
                <input type="number" name="quantity" th:value="${assignment.quantity()}" min="1"
                       class="qty-input u-num" aria-label="Quantity" />
            </label>
            <button class="btn btn-ghost btn-xs">Set</button>
        </form>
        <button class="btn btn-danger btn-xs action-row__destructive"
                th:hx-delete="@{/campaigns/{cid}/treasury/{id}(cid=${assignment.campaignId()}, id=${assignment.id()})}"
                hx-target="closest tr" hx-swap="outerHTML" th:hx-confirm="|Remove ${assignment.itemName()} from the treasury?|"
                data-confirm-consequence="The item leaves the treasury and its holder&#39;s inventory. Ledger entries that recorded it are kept."
                data-confirm-accept="Remove"
                hx-disabled-elt="this">
            &times;
        </button>
    </td>
</tr>
</html>
