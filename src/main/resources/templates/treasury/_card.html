<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="card(assignment, attunementCount)" class="card assignment-card"
     th:id="'assignment-' + ${assignment.id()}">

    <div class="u-flex--md u-flex-1 u-min-w-0">
        <div class="u-min-w-0">
            <div class="u-fw-600" th:text="${assignment.itemName()}">Item Name</div>
            <div class="detail-meta u-mt-xs">
                <span class="badge" th:text="${assignment.holderName()}">Holder</span>
                <span th:if="${assignment.quantity() > 1}" class="badge" th:text="'x' + ${assignment.quantity()}">x1</span>
                <span th:if="${assignment.attuned()}" class="badge">attuned</span>
            </div>
            <th:block th:if="${assignment.attuned() and attunementCount != null and attunementCount >= 3}">
                <div th:replace="~{treasury/_attunement-warn :: warning(count=${attunementCount})}"></div>
            </th:block>
        </div>
    </div>

    <div class="u-flex u-gap-xs u-shrink-0 u-ml-md">
        <form th:method="'put'"
              th:hx-put="@{/campaigns/{cid}/treasury/{id}/attune(cid=${assignment.campaignId()}, id=${assignment.id()})}"
              hx-target="closest .detail-section" hx-swap="outerHTML" class="u-inline">
            <button class="btn btn-ghost btn-xs"
                    th:text="${assignment.attuned()} ? 'Unattune' : 'Attune'">Attune</button>
        </form>
        <form th:method="'put'"
              th:hx-put="@{/campaigns/{cid}/treasury/{id}/quantity(cid=${assignment.campaignId()}, id=${assignment.id()})}"
              hx-target="closest .card" hx-swap="outerHTML" class="u-flex u-gap-xs">
            <label class="u-flex u-gap-xs" style="align-items: center;">
                <span class="text-muted u-text-xs">Qty</span>
                <input type="number" name="quantity" th:value="${assignment.quantity()}" min="1"
                       class="qty-input" aria-label="Quantity" />
            </label>
            <button class="btn btn-ghost btn-xs">Set</button>
        </form>
        <button class="btn btn-danger btn-xs action-row__destructive"
                th:hx-delete="@{/campaigns/{cid}/treasury/{id}(cid=${assignment.campaignId()}, id=${assignment.id()})}"
                hx-target="closest .card" hx-swap="outerHTML" hx-confirm="Remove this item?">
            &times;
        </button>
    </div>
</div>
</html>
