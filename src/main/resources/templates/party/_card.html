<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="party-member-card" th:fragment="card(pm)"
     th:id="'pm-card-' + ${pm.id}"
     th:classappend="${!pm.active} ? 'pm-inactive'">
    <div class="pm-checkbox">
        <input type="checkbox" class="member-select" th:value="${pm.id}"
               th:attr="data-active=${pm.active}"
               th:id="'sel-' + ${pm.id}">
    </div>
    <h3 th:text="${pm.characterName}">Character Name</h3>
    <div class="pm-player" th:with="hasPlayer=${pm.playerName != null and !pm.playerName.isBlank()}">
        <span th:if="${hasPlayer}" th:text="'Played by ' + ${pm.playerName}">Played by X</span>
        <span th:if="${pm.classAndLevel != null and !pm.classAndLevel.isBlank()}"
              th:text="${hasPlayer} ? ' | ' + ${pm.classAndLevel} : ${pm.classAndLevel}">Class</span>
    </div>
    <dl class="pm-stats stat-grid">
        <div><dt>AC</dt><dd th:text="${pm.ac}">16</dd></div>
        <div><dt>HP</dt><dd th:text="${pm.maxHp}">38</dd></div>
        <div><dt>Init</dt><dd th:text="'+' + ${pm.initiativeBonus}">+4</dd></div>
        <div><dt>Speed</dt><dd th:text="${pm.speed + ' ft.'}">30 ft.</dd></div>
        <div><dt>Perception</dt><dd th:text="${pm.passivePerception}">17</dd></div>
        <div><dt>Insight</dt><dd th:text="${pm.passiveInsight}">12</dd></div>
        <div><dt>Investigation</dt><dd th:text="${pm.passiveInvestigation}">14</dd></div>
    </dl>
    <div class="pm-actions">
        <a th:if="${pm.characterSheet != null}"
           th:href="@{/campaigns/{cid}/party/{pid}/sheet(cid=${pm.campaign.id}, pid=${pm.id})}"
           class="btn btn-ghost">Sheet</a>
        <button class="btn btn-ghost"
                th:hx-get="@{/campaigns/{cid}/party/{pid}/edit(cid=${pm.campaign.id}, pid=${pm.id})}"
                hx-target="#party-form-modal" hx-swap="innerHTML">Edit</button>
        <th:block th:if="${pm.active}">
            <button class="btn btn-ghost"
                    th:hx-put="@{/campaigns/{cid}/party/{pid}/toggle-active(cid=${pm.campaign.id}, pid=${pm.id})}"
                    hx-target="closest .party-member-card" hx-swap="outerHTML">Mark Inactive</button>
        </th:block>
        <th:block th:if="${!pm.active}">
            <button class="btn btn-ghost"
                    th:hx-put="@{/campaigns/{cid}/party/{pid}/toggle-active(cid=${pm.campaign.id}, pid=${pm.id})}"
                    hx-target="closest .party-member-card" hx-swap="outerHTML">Mark Active</button>
        </th:block>
        <button class="btn btn-danger"
                th:hx-delete="@{/campaigns/{cid}/party/{pid}(cid=${pm.campaign.id}, pid=${pm.id})}"
                hx-confirm="Remove this party member?"
                hx-target="closest .party-member-card" hx-swap="outerHTML">Remove</button>
    </div>
    <div style="margin-top: var(--space-md);">
        <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${pm.campaign.id}, targetType='PARTY_MEMBER', targetId=${pm.id})}"></th:block>
    </div>
</div>
<!-- Card plus an out-of-band refresh of the top summary bar (kept in sync after add/edit/toggle). -->
<th:block th:fragment="cardWithSummary(pm, activeMembers)">
    <th:block th:replace="~{party/_card :: card(pm=${pm})}"></th:block>
    <th:block th:replace="~{party/_summary-bar :: summary-bar(members=${activeMembers}, oob='true')}"></th:block>
</th:block>
</html>
