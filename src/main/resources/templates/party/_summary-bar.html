<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="party-summary-bar" id="party-summary-bar" th:fragment="summary-bar(view, mode, oob)"
     th:attr="data-module-mode=${mode}, hx-swap-oob=${oob}">
    <span class="bar-label">Party</span>
    <th:block th:if="${view == null or view.isEmpty()}">
        <span class="empty-text">No party members yet.</span>
    </th:block>
    <th:block th:each="m : ${view}">
        <div class="party-member-chip" th:attr="data-member-id=${m.id}">
            <span class="chip-name" th:text="${m.name}">Name</span>
            <div class="chip-hp-bar">
                <div class="chip-hp-fill"
                     th:style="'width:' + (${m.maxHp} > 0 ? (${m.currentHp} * 100 / ${m.maxHp}) : 0) + '%'"
                     th:classappend="${m.maxHp > 0 && m.currentHp * 2 < m.maxHp} ? 'low' : ''"></div>
            </div>
            <!-- The abbreviations stay — the rail has no room for words — but nothing here
                 depends on hovering to be understood: every stat carries its expanded name,
                 and the dots keep "PI 10 PInv 11" from reading as one number. -->
            <div class="chip-stats u-num" aria-label="Armour Class, Hit Points, Passive Perception">
                <span title="Armour Class"
                      th:attr="aria-label=|Armour Class ${m.ac}|"
                      th:text="'AC ' + ${m.ac}">AC 16</span>
                <span aria-hidden="true">·</span>
                <span title="Hit Points"
                      th:attr="aria-label=|Hit Points ${m.currentHp} of ${m.maxHp}|"
                      th:text="'HP ' + ${m.currentHp} + '/' + ${m.maxHp}">HP 32/32</span>
                <span aria-hidden="true">·</span>
                <span title="Passive Perception"
                      th:attr="aria-label=|Passive Perception ${m.passivePerception}|"
                      th:text="'PP ' + ${m.passivePerception}">PP 14</span>
                <span title="Temporary Hit Points" th:if="${m.tempHp > 0}"
                      th:attr="aria-label=|Temporary Hit Points ${m.tempHp}|"
                      th:text="'THP ' + ${m.tempHp}">THP 0</span>
            </div>
            <th:block th:if="${mode == null or mode.name() != 'COMPACT'}">
                <div class="chip-detail u-num">
                    <span title="Passive Insight" th:if="${m.passiveInsight > 0}"
                          th:attr="aria-label=|Passive Insight ${m.passiveInsight}|"
                          th:text="'PI ' + ${m.passiveInsight}">PI 12</span>
                    <span aria-hidden="true">·</span>
                    <span title="Passive Investigation" th:if="${m.passiveInvestigation > 0}"
                          th:attr="aria-label=|Passive Investigation ${m.passiveInvestigation}|"
                          th:text="'PInv ' + ${m.passiveInvestigation}">PInv 14</span>
                    <span aria-hidden="true">·</span>
                    <span title="Speed (feet per turn)" th:if="${m.speed > 0}"
                          th:attr="aria-label=|Speed ${m.speed} feet per turn|"
                          th:text="'Spd ' + ${m.speed}">Spd 30</span>
                </div>
                <div class="chip-status">
                    <span th:if="${m.deathSaveSuccesses > 0 or m.deathSaveFailures > 0}"
                          th:text="'DS ' + ${m.deathSaveSuccesses} + '/' + ${m.deathSaveFailures}">DS 0/0</span>
                    <th:block th:if="${m.conditions != null and !m.conditions.isEmpty()}">
                        <span class="badge badge--warning" th:each="cond : ${m.conditions}" th:text="${cond}">condition</span>
                    </th:block>
                    <th:block th:if="${m.conditions == null and m.conditionsJson != null and !m.conditionsJson.isEmpty() and !m.conditionsJson.equals('[]')}">
                        <span class="badge badge--warning">Conditions</span>
                    </th:block>
                </div>
            </th:block>
            <a class="btn btn-ghost u-text-xs" th:href="${m.sheetUrl}" target="_blank">Sheet</a>
        </div>
    </th:block>
</div>
</html>
