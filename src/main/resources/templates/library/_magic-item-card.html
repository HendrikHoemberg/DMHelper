<th:block th:fragment="magic-item-card(item)">
    <div class="ref-card">
        <h2 class="ref-card__title">
            <a th:href="@{/library/magic-items/{id}(id=${item.id})}" th:text="${item.name}">Name</a>
        </h3>
        <div class="ref-card__meta">
            <span class="ref-card__slot" data-tone="accent" th:if="${item.rarity != null}" th:text="${item.rarity}">Rarity</span>
            <span class="ref-card__slot" th:if="${item.category != null}" th:text="${item.category}">Category</span>
            <span class="ref-card__slot" th:if="${item.requiresAttunement}">Attunement</span>
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${item})}"></th:block>
        </div>
        <div class="ref-card__summary" th:utext="${#markdown.toHtml(item.description)}">Description</div>
        <th:block th:replace="~{library/_provenance-fields :: provenance-line(entity=${item})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="magic-item-card-list" th:with="cap=60">
    <div class="card-grid card-grid--library" th:if="${magicItems != null and !magicItems.isEmpty()}">
        <th:block th:each="m,iter : ${magicItems}" th:if="${iter.index < cap}">
            <th:block th:replace="~{library/_magic-item-card :: magic-item-card(item=${m})}"></th:block>
        </th:block>
    </div>
    <div class="empty-state" th:if="${magicItems == null or magicItems.isEmpty()}">
        <p class="empty-state__title">No magic items match your search.</p>
    </div>
    <th:block th:if="${magicItems != null and magicItems.size() > cap}"
              th:replace="~{library/_card :: more-results(shown=${cap}, total=${magicItems.size()})}"></th:block>
</th:block>
