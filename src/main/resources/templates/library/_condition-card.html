<th:block th:fragment="condition-card(condition)">
    <div class="card">
        <h3 class="card-title" th:text="${condition.name}">Condition Name</h3>
        <p class="card-text" th:text="${condition.description}">Description</p>
        <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${condition})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="condition-card-list">
    <div class="card-grid" th:if="${conditions != null and !conditions.isEmpty()}">
        <div th:each="c : ${conditions}" class="card">
            <h3 class="card-title" th:text="${c.name}">Condition Name</h3>
            <p class="card-text" th:text="${c.description}">Description</p>
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${c})}"></th:block>
        </div>
    </div>
    <div class="empty-state"><p>No conditions match your search.</p></div>
</th:block>
