<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="background-form" id="background-form">
    <h2 th:text="${background == null ? 'Create Custom Background' : 'Edit ' + background.name}">Create Background</h2>
    <form th:action="${background == null} ? '/library/backgrounds' : '/library/backgrounds/' + ${background.id}"
          th:method="${background == null ? 'post' : 'put'}"
          th:hx-target="${background == null ? '#background-results' : '#background-form'}"
          th:hx-swap="${background == null ? 'beforeend' : 'outerHTML'}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${background?.name}" placeholder="e.g. Acolyte">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="6" th:text="${background?.description}"></textarea>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-ghost"
                    th:if="${background != null}"
                    th:hx-get="@{/library/backgrounds/{id}(id=${background.id})}"
                    hx-target="#background-form"
                    hx-swap="outerHTML">Cancel</button>
            <button type="submit" class="btn btn-primary" th:text="${background == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
