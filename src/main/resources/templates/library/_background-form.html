<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="background-form" id="background-form">
    <form th:action="${background == null} ? '/library/backgrounds' : '/library/backgrounds/' + ${background.id}"
          method="post">
        <!-- Browsers submit only GET and POST; HiddenHttpMethodFilter turns this into the PUT. -->
        <input type="hidden" name="_method" value="put" th:if="${background != null}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${background?.name}" placeholder="e.g. Acolyte">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="6" th:text="${background?.description}"></textarea>
        </div>
        <div class="form-actions">
            <a th:if="${background != null}" class="btn btn-ghost"
               th:href="@{/library/backgrounds/{id}(id=${background.id})}">Cancel</a>
            <a th:if="${background == null}" class="btn btn-ghost"
               th:href="@{/library}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${background == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
