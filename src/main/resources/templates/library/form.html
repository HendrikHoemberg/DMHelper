<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${formTitle},
          archetype='form',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${formTitle},
        summary='Library',
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/library}" class="btn btn-ghost">&larr; Back to Library</a>

<div id="page-content" class="page-content">
    <!-- Every library form shares this shell; the controller names the fragment. -->
    <th:block th:replace="~{__${formFragment}__}"></th:block>
</div>
</body>
</html>
