<th:block th:fragment="background-card(bg)">
    <div class="ref-card">
        <h3 class="ref-card__title">
            <a th:href="@{/library/backgrounds/{id}(id=${bg.id})}" th:text="${bg.name}">Background Name</a>
        </h3>
        <div class="ref-card__meta">
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${bg})}"></th:block>
        </div>
        <div class="ref-card__summary" th:if="${bg.description != null}" th:utext="${bg.description}">Description</div>
        <th:block th:replace="~{library/_provenance-fields :: provenance-line(entity=${bg})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="background-card-list">
    <div class="card-grid card-grid--library" th:if="${backgrounds != null and !backgrounds.isEmpty()}">
        <th:block th:each="b : ${backgrounds}">
            <th:block th:replace="~{library/_background-card :: background-card(bg=${b})}"></th:block>
        </th:block>
    </div>
    <div class="empty-state" th:if="${backgrounds == null or backgrounds.isEmpty()}">
        <p>No backgrounds match your search.</p>
    </div>
</th:block>
