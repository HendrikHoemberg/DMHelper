<th:block th:fragment="background-card(bg)">
    <div class="card">
        <h3 class="card-title" th:text="${bg.name}">Background Name</h3>
        <p class="card-text" th:text="${bg.description}">Description</p>
        <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${bg})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="background-card-list">
    <div class="card-grid" th:if="${backgrounds != null and !backgrounds.isEmpty()}">
        <div th:each="b : ${backgrounds}" class="card">
            <h3 class="card-title" th:text="${b.name}">Background Name</h3>
            <p class="card-text" th:text="${b.description}">Description</p>
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${b})}"></th:block>
        </div>
    </div>
    <div class="empty-state"><p>No backgrounds match your search.</p></div>
</th:block>
