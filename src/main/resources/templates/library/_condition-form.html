<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="condition-form" id="condition-form">
    <form th:action="${condition == null} ? '/library/conditions' : '/library/conditions/' + ${condition.id}"
          method="post">
        <!-- Browsers submit only GET and POST; HiddenHttpMethodFilter turns this into the PUT. -->
        <input type="hidden" name="_method" value="put" th:if="${condition != null}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${condition?.name}" placeholder="e.g. Poisoned">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" th:text="${condition?.description}"></textarea>
        </div>
        <div class="form-actions">
            <a th:if="${condition != null}" class="btn btn-ghost"
               th:href="@{/library/conditions/{id}(id=${condition.id})}">Cancel</a>
            <a th:if="${condition == null}" class="btn btn-ghost"
               th:href="@{/library}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${condition == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
