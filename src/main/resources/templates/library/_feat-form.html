<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="feat-form" id="feat-form">
    <form th:action="${feat == null} ? '/library/feats' : '/library/feats/' + ${feat.id}"
          method="post">
        <!-- Browsers submit only GET and POST; HiddenHttpMethodFilter turns this into the PUT. -->
        <input type="hidden" name="_method" value="put" th:if="${feat != null}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${feat?.name}" placeholder="e.g. Alert">
        </div>
        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" th:value="${feat?.category}" placeholder="General">
        </div>
        <div class="form-group">
            <label>Prerequisite</label>
            <input type="text" name="prerequisite" th:value="${feat?.prerequisite}">
        </div>
        <div class="form-group">
            <label>Benefit (Markdown)</label>
            <textarea name="benefit" rows="6" th:text="${feat?.benefit}"></textarea>
        </div>
        <div class="form-actions">
            <a th:if="${feat != null}" class="btn btn-ghost"
               th:href="@{/library/feats/{id}(id=${feat.id})}">Cancel</a>
            <a th:if="${feat == null}" class="btn btn-ghost"
               th:href="@{/library}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${feat == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
