<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${equipmentItem.name}">DMHelper -- Equipment</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex action-row">
                    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${equipmentItem})}"></th:block>
                    <th:block th:if="${equipmentItem.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/equipment/{id}/clone(id=${equipmentItem.id})}" hx-target="body"
                              hx-disabled-elt="find button[type='submit']">
                            <button type="submit" class="btn">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${equipmentItem.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/equipment/{id}/edit(id=${equipmentItem.id})}" class="btn btn-primary">Edit</a>
                        <span class="action-row__destructive">
                            <button class="btn btn-danger"
                                    th:hx-delete="@{/library/equipment/{id}(id=${equipmentItem.id})}"
                                    hx-confirm="Delete this equipment?"
                                    hx-target="body" hx-swap="outerHTML"
                                    hx-disabled-elt="this">Delete</button>
                        </span>
                    </th:block>
                </div>
            </div>
            <div class="detail-section">
                <h1 data-display-title th:text="${equipmentItem.name}">Item Name</h1>
                <div class="detail-meta">
                    <span class="library-chip" th:text="${equipmentItem.category}">Category</span>
                </div>
                <div class="detail-grid">
                    <div th:if="${equipmentItem.cost != null}"><strong>Cost:</strong> <span th:text="${equipmentItem.cost}"></span></div>
                    <div th:if="${equipmentItem.weight != null}"><strong>Weight:</strong> <span th:text="${equipmentItem.weight}"></span></div>
                    <div th:if="${equipmentItem.properties != null}"><strong>Properties:</strong> <span th:text="${equipmentItem.properties}"></span></div>
                </div>
                <div class="detail-body" th:utext="${#markdown.toHtml(equipmentItem.description)}"></div>
            </div>
            <th:block th:if="${equipmentItem.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${equipmentItem})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='EQUIPMENT', targetId=${equipmentItem.id})}"></th:block>
                </div>
            </th:block>
        </main>
    </div>
</body>
</html>
