<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${sb.name}">DMHelper -- Statblock</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
            <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex">
                    <th:block th:if="${sb.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/statblocks/{id}/clone(id=${sb.id})}" hx-target="body">
                            <button type="submit" class="btn">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${sb.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/statblocks/{id}/edit(id=${sb.id})}" class="btn btn-primary">Edit</a>
                        <button class="btn btn-danger"
                                th:hx-delete="@{/library/statblocks/{id}(id=${sb.id})}"
                                hx-confirm="Delete this statblock?"
                                hx-target="body" hx-swap="outerHTML">Delete</button>
                    </th:block>
                </div>
            </div>
            <div id="statblock-detail">
                <th:block th:replace="~{library/_statblock-renderer :: renderer(sb=${sb})}"></th:block>
            </div>

            <th:block th:if="${campaignId != null}">
            <div class="u-mt-lg">
                <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='STATBLOCK', targetId=${sb.id})}"></th:block>
            </div>
            </th:block>
        </main>
    </div>
</body>
</html>
