<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${sb.name},
          archetype='detail',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${sb.name},
        summary='Statblock',
        breadcrumb=~{::#breadcrumb},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a href="/library">&larr; Back to Library</a>
</nav>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <th:block th:if="${sb.source.name() == 'SRD'}">
        <form th:hx-post="@{/library/statblocks/{id}/clone(id=${sb.id})}" hx-target="body"
              hx-disabled-elt="find button[type='submit']">
            <button type="submit" class="btn">Clone &amp; Edit</button>
        </form>
    </th:block>
    <th:block th:if="${sb.source.name() == 'CUSTOM'}">
        <a th:href="@{/library/statblocks/{id}/edit(id=${sb.id})}" class="btn btn-ghost">Edit</a>
    </th:block>
</div>

<div id="page-content" class="page-content">
<div id="statblock-detail">
                <th:block th:replace="~{library/_statblock-renderer :: renderer(sb=${sb})}"></th:block>
            </div>

            <th:block th:if="${campaignId != null}">
            <div class="u-mt-lg">
                <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='STATBLOCK', targetId=${sb.id})}"></th:block>
            </div>
            </th:block>

    <div class="u-mt-lg surface-danger-zone" th:if="${sb.source.name() == 'CUSTOM'}">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">This action cannot be undone.</p>
        <button class="btn btn-danger action-row__destructive"
                th:hx-delete="@{/library/statblocks/{id}(id=${sb.id})}"
                hx-confirm="Delete this statblock?"
                hx-target="body" hx-swap="outerHTML"
                hx-disabled-elt="this">Delete</button>
    </div>
</div>
</body>
</html>
