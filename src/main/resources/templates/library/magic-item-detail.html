<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${magicItem.name},
          archetype='detail',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${magicItem.name},
        summary='Magic Item',
        breadcrumb=~{::#breadcrumb},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a href="/library">&larr; Back to Library</a>
</nav>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${magicItem})}"></th:block>
    <th:block th:if="${magicItem.source.name() == 'SRD'}">
        <form th:hx-post="@{/library/magic-item/{id}/clone(id=${magicItem.id})}" hx-target="body"
              hx-disabled-elt="find button[type='submit']">
            <button type="submit" class="btn">Clone &amp; Edit</button>
        </form>
    </th:block>
    <th:block th:if="${magicItem.source.name() == 'CUSTOM'}">
        <a th:href="@{/library/magic-item/{id}/edit(id=${magicItem.id})}" class="btn btn-ghost">Edit</a>
    </th:block>
</div>

<div id="page-content" class="page-content">
<div class="detail-section">
                <div class="detail-meta">
                    <span class="badge" th:classappend="'badge-' + ${magicItem.rarity?.toLowerCase()}" th:text="${magicItem.rarity}">Rarity</span>
                    <span class="badge" th:text="${magicItem.category}">Category</span>
                    <span class="badge" th:if="${magicItem.requiresAttunement}">Attunement</span>
                </div>
                <div class="detail-grid">
                    <div th:if="${magicItem.type != null}"><strong>Type:</strong> <span th:text="${magicItem.type}"></span></div>
                    <div th:if="${magicItem.cost != null}"><strong>Cost:</strong> <span th:text="${magicItem.cost}"></span></div>
                    <div th:if="${magicItem.weight != null}"><strong>Weight:</strong> <span th:text="${magicItem.weight}"></span></div>
                    <div th:if="${magicItem.attunementDetail != null}"><strong>Attunement:</strong> <span th:text="${magicItem.attunementDetail}"></span></div>
                </div>
                <div class="detail-body" th:utext="${#markdown.toHtml(magicItem.description)}"></div>
            </div>
            <th:block th:if="${magicItem.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${magicItem})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='MAGIC_ITEM', targetId=${magicItem.id})}"></th:block>
                </div>
            </th:block>
    <div class="u-mt-lg surface-danger-zone" th:if="${magicItem.source.name() == 'CUSTOM'}">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">This action cannot be undone.</p>
        <button class="btn btn-danger action-row__destructive"
                th:hx-delete="@{/library/magic-items/{id}(id=${magicItem.id})}"
                th:hx-confirm="|Delete ${magicItem.name}?|"
                th:data-confirm-consequence="|The entry is removed from the library for every campaign. Records that already copied it are not changed.|"
                hx-target="body" hx-swap="outerHTML"
                hx-disabled-elt="this">Delete</button>
    </div>

</div>
</body>
</html>
