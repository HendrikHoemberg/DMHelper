<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${rule.name},
          archetype='detail',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${rule.name},
        summary='Rule',
        breadcrumb=~{::#breadcrumb},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a href="/library">&larr; Back to Library</a>
</nav>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${rule})}"></th:block>
    <th:block th:if="${rule.source.name() == 'SRD'}">
        <form th:hx-post="@{/library/rule/{id}/clone(id=${rule.id})}" hx-target="body"
              hx-disabled-elt="find button[type='submit']">
            <button type="submit" class="btn">Clone &amp; Edit</button>
        </form>
    </th:block>
    <th:block th:if="${rule.source.name() == 'CUSTOM'}">
        <a th:href="@{/library/rule/{id}/edit(id=${rule.id})}" class="btn btn-ghost">Edit</a>
    </th:block>
</div>

<div id="page-content" class="page-content">
<div class="detail-section">
                <div class="detail-meta">
                    <span th:if="${rule.ruleset != null}" class="library-chip" th:text="${rule.ruleset}">Ruleset</span>
                </div>
                <div class="detail-body" th:utext="${#markdown.toHtml(rule.body)}"></div>
            </div>
            <th:block th:if="${rule.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${rule})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='RULE', targetId=${rule.id})}"></th:block>
                </div>
            </th:block>
    <div class="u-mt-lg surface-danger-zone" th:if="${rule.source.name() == 'CUSTOM'}">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">This action cannot be undone.</p>
        <button class="btn btn-danger action-row__destructive"
                th:hx-delete="@{/library/rules/{id}(id=${rule.id})}"
                th:hx-confirm="|Delete ${rule.name}?|"
                th:data-confirm-consequence="|The entry is removed from the library for every campaign. Records that already copied it are not changed.|"
                hx-target="body" hx-swap="outerHTML"
                hx-disabled-elt="this">Delete</button>
    </div>

</div>
</body>
</html>
