<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="statblock-card" th:fragment="card(sb)">
    <!-- A plain link: the side sheet is an enhancement layered on top of it by
         ui-elevation.js, and the full page still works without JS. -->
    <div class="library-card__header">
        <h3 class="library-card__title">
            <a th:href="@{/library/statblocks/{id}(id=${sb.id})}" th:text="${sb.name}"
               data-statblock-link>Name</a>
        </h3>
        <span class="library-card__cr">CR <span class="u-num" th:text="${sb.cr}">1/4</span></span>
    </div>
    <div class="library-card__meta">
        <span th:class="${sb.type == 'Celestial' or sb.type == 'Fey' or sb.type == 'Plant'} ? 'library-chip library-chip--success' : (${sb.type == 'Fiend' or sb.type == 'Undead' or sb.type == 'Aberration'} ? 'library-chip library-chip--danger' : (${sb.type == 'Dragon' or sb.type == 'Elemental' or sb.type == 'Giant'} ? 'library-chip library-chip--warning' : (${sb.type == 'Construct' or sb.type == 'Ooze'} ? 'library-chip library-chip--shield' : 'library-chip library-chip--accent')))"
              th:text="${sb.type}">Type</span>
        <span th:if="${sb.size != null}" th:text="${sb.size}"></span>
        <span th:if="${sb.source.name() == 'SRD'}" class="library-chip library-chip--accent library-chip--source">SRD</span>
        <span th:if="${sb.source.name() == 'CUSTOM'}" class="library-chip library-chip--success library-chip--source">Custom</span>
    </div>
    <div class="card-actions u-mt-auto">
        <th:block th:if="${sb.source.name() == 'SRD'}">
            <form th:hx-post="@{/library/statblocks/{id}/clone(id=${sb.id})}" hx-target="body" class="u-inline">
                <button type="submit" class="btn btn-ghost btn-xs">Clone &amp; Edit</button>
            </form>
        </th:block>
        <th:block th:if="${sb.source.name() == 'CUSTOM'}">
            <a th:href="@{/library/statblocks/{id}/edit(id=${sb.id})}" class="btn btn-ghost btn-xs">Edit</a>
            <th:block th:if="${sb.campaignId != null}">
                <button class="btn btn-ghost btn-xs"
                        th:hx-put="@{/library/statblocks/{id}/promote(id=${sb.id})}"
                        hx-confirm="Promote to global? It will be available in all campaigns."
                        hx-target="closest .statblock-card"
                        hx-swap="outerHTML">Promote</button>
            </th:block>
            <button class="btn btn-danger btn-xs"
                    th:hx-delete="@{/library/statblocks/{id}(id=${sb.id})}"
                    hx-confirm="Delete this statblock?"
                    hx-target="closest .statblock-card"
                    hx-swap="outerHTML">Delete</button>
        </th:block>
    </div>
</div>

<div th:fragment="card-list(statblocks)" th:if="${statblocks != null}" class="settle-in">
    <div class="result-count"
         th:text="${statblocks.size()} + (${statblocks.size()} == 1 ? ' monster' : ' monsters')">312 monsters</div>
    <div class="card-grid card-grid--library"
         th:classappend="${sourceFiltered} ? 'card-grid--source-filtered'">
        <th:block th:if="${statblocks.isEmpty()}">
            <th:block th:replace="~{common/_empty-state :: empty-state('Nothing in the bestiary matches that.', null, null, 'Try a broader search, or clear a filter.')}"></th:block>
        </th:block>
        <th:block th:each="sb : ${statblocks}">
            <th:block th:replace="~{library/_card :: card(sb=${sb})}"></th:block>
        </th:block>
    </div>
</div>
</html>
