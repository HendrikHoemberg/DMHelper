<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="ref-card" th:fragment="card(sb)">
    <!-- A plain link: the side sheet is an enhancement layered on top of it by
         ui-elevation.js, and the full page still works without JS. -->
    <div class="ref-card__header">
        <h3 class="ref-card__title">
            <a th:href="@{/library/statblocks/{id}(id=${sb.id})}" th:text="${sb.name}"
               data-statblock-link>Name</a>
        </h3>
        <span class="ref-card__cr">CR <span class="u-num" th:text="${sb.cr}">1/4</span></span>
    </div>
    <div class="ref-card__meta">
        <!-- Type tone is a decorative scan aid. The tone rides a data attribute so the
             class list stays static: a BEM double underscore inside an expression trips
             Thymeleaf's __…__ preprocessing. -->
        <span class="ref-card__slot" th:text="${sb.type}"
              th:attr="data-tone=${sb.type == 'Celestial' or sb.type == 'Fey' or sb.type == 'Plant'} ? 'success' : (${sb.type == 'Fiend' or sb.type == 'Undead' or sb.type == 'Aberration'} ? 'danger' : (${sb.type == 'Dragon' or sb.type == 'Elemental' or sb.type == 'Giant'} ? 'warning' : (${sb.type == 'Construct' or sb.type == 'Ooze'} ? 'shield' : 'accent')))">Type</span>
        <span class="ref-card__slot" th:if="${sb.size != null}" th:text="${sb.size}">Size</span>
        <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${sb})}"></th:block>
    </div>
    <p class="ref-card__summary">
        <span>AC</span> <span class="u-num" th:text="${sb.ac}">15</span>
        <span aria-hidden="true">·</span>
        <span>HP</span> <span class="u-num" th:text="${sb.hp}">7 (2d6)</span>
    </p>
    <div class="ref-card__actions u-mt-auto">
        <th:block th:if="${sb.source.name() == 'SRD'}">
            <form th:hx-post="@{/library/statblocks/{id}/clone(id=${sb.id})}" hx-target="body" class="u-inline"
                  hx-disabled-elt="find button[type='submit']">
                <button type="submit" class="btn btn-ghost btn-xs">Clone &amp; Edit</button>
            </form>
        </th:block>
        <th:block th:if="${sb.source.name() == 'CUSTOM'}">
            <a th:href="@{/library/statblocks/{id}/edit(id=${sb.id})}" class="btn btn-ghost btn-xs">Edit</a>
            <th:block th:if="${sb.campaignId != null}">
                <button class="btn btn-ghost btn-xs"
                        th:hx-put="@{/library/statblocks/{id}/promote(id=${sb.id})}"
                        hx-confirm="Promote to global? It will be available in all campaigns."
                        hx-target="closest .ref-card"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this">Promote</button>
            </th:block>
            <button class="btn btn-danger btn-xs action-row__destructive"
                    th:hx-delete="@{/library/statblocks/{id}(id=${sb.id})}"
                    hx-confirm="Delete this statblock?"
                    hx-target="closest .ref-card"
                    hx-swap="outerHTML"
                    hx-disabled-elt="this">Delete</button>
        </th:block>
    </div>
</div>

<div th:fragment="card-list(statblocks)" th:if="${statblocks != null}" class="settle-in" th:with="cap=${cap != null ? cap : 60}">
    <div class="result-count"
         th:text="${statblocks.size()} + (${statblocks.size()} == 1 ? ' monster' : ' monsters')">312 monsters</div>
    <div class="card-grid card-grid--library" id="statblock-results"
         th:classappend="${sourceFiltered} ? 'card-grid--source-filtered'">
        <th:block th:if="${statblocks.isEmpty()}">
            <th:block th:replace="~{common/_empty-state :: empty-state('Nothing in the bestiary matches that.', null, null, 'Try a broader search, or clear a filter.')}"></th:block>
        </th:block>
        <!-- Cap the rendered cards; the full SRD bestiary is hundreds of entries. -->
        <th:block th:each="sb,iter : ${statblocks}" th:if="${iter.index < cap}">
            <th:block th:replace="~{library/_card :: card(sb=${sb})}"></th:block>
        </th:block>
    </div>
    <th:block th:if="${statblocks.size() > cap}">
        <div class="result-truncated u-mt-md">
            <span class="u-text-sm text-muted">Showing the first <span th:text="${cap}">60</span> of <span th:text="${statblocks.size()}">312</span>.</span>
            <button class="btn btn-ghost btn-xs u-ml-md"
                    th:hx-get="@{/library/statblocks(limit=${cap + 120})}"
                    hx-include="#librarySearch,#libraryCr,#libraryType,#librarySource"
                    hx-target="#statblock-results"
                    hx-swap="outerHTML"
                    hx-disabled-elt="this">
                Show <span th:text="${statblocks.size() - cap}">252</span> more
            </button>
        </div>
    </th:block>
</div>

<div th:fragment="more-results(shown, total)" class="result-truncated text-muted u-text-sm u-mt-md">
    Showing the first <span th:text="${shown}">60</span> of <span th:text="${total}">312</span>.
    Refine your search or filters to narrow the list.
</div>
</html>
