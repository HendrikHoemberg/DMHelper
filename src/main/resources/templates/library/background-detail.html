<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${background.name}">DMHelper -- Background</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex">
                    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${background})}"></th:block>
                    <th:block th:if="${background.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/backgrounds/{id}/clone(id=${background.id})}" hx-target="body">
                            <button type="submit" class="btn btn-primary">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${background.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/backgrounds/{id}/edit(id=${background.id})}" class="btn btn-primary">Edit</a>
                        <button class="btn btn-danger"
                                th:hx-delete="@{/library/backgrounds/{id}(id=${background.id})}"
                                hx-confirm="Delete this background?"
                                hx-target="body" hx-swap="outerHTML">Delete</button>
                    </th:block>
                </div>
            </div>
            <div class="detail-section">
                <h1 th:text="${background.name}">Background Name</h1>
                <div class="detail-body" th:utext="${#markdown.toHtml(background.description)}"></div>
            </div>
            <th:block th:if="${background.source.name() == 'CUSTOM'}" th:replace="~{library/_provenance-fields :: provenance(entity=${background})}"></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='BACKGROUND', targetId=${background.id})}"></th:block>
                </div>
            </th:block>
        </main>
    </div>
</body>
</html>
