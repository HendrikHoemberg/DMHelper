<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="scope-badge(entity)">
    <span class="ref-card__source">
        <th:block th:if="${entity.source.name() == 'SRD'}">
            <th:block th:replace="~{fragments/_badge :: badge(tone='neutral', icon=${null}, label='SRD 5.2')}"></th:block>
        </th:block>
        <th:block th:if="${entity.source.name() == 'CUSTOM'}">
            <th:block th:replace="~{fragments/_badge :: badge(tone='success', icon=${null}, label='Custom')}"></th:block>
        </th:block>
    </span>
</th:block>
</html>
