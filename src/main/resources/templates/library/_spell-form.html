<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="spell-form" id="spell-form">
    <form th:action="${spell == null} ? '/library/spells' : '/library/spells/' + ${spell.id}"
          method="post">
        <!-- Browsers submit only GET and POST; HiddenHttpMethodFilter turns this into the PUT. -->
        <input type="hidden" name="_method" value="put" th:if="${spell != null}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${spell?.name}" placeholder="e.g. Fireball">
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label>Level</label>
                <select name="level">
                    <option value="0" th:selected="${spell != null and spell.level == 0}">Cantrip</option>
                    <option value="1" th:selected="${spell != null and spell.level == 1}">1st</option>
                    <option value="2" th:selected="${spell != null and spell.level == 2}">2nd</option>
                    <option value="3" th:selected="${spell != null and spell.level == 3}">3rd</option>
                    <option value="4" th:selected="${spell != null and spell.level == 4}">4th</option>
                    <option value="5" th:selected="${spell != null and spell.level == 5}">5th</option>
                    <option value="6" th:selected="${spell != null and spell.level == 6}">6th</option>
                    <option value="7" th:selected="${spell != null and spell.level == 7}">7th</option>
                    <option value="8" th:selected="${spell != null and spell.level == 8}">8th</option>
                    <option value="9" th:selected="${spell != null and spell.level == 9}">9th</option>
                </select>
            </div>
            <div class="form-group">
                <label>School</label>
                <input type="text" name="school" th:value="${spell?.school}" placeholder="Evocation">
            </div>
            <div class="form-group">
                <label>Casting Time</label>
                <input type="text" name="castingTime" th:value="${spell?.castingTime}" placeholder="1 action">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group"><label>Range</label><input type="text" name="range" th:value="${spell?.range}" placeholder="150 ft"></div>
            <div class="form-group"><label>Components</label><input type="text" name="components" th:value="${spell?.components}" placeholder="V, S, M"></div>
            <div class="form-group"><label>Duration</label><input type="text" name="duration" th:value="${spell?.duration}" placeholder="Instantaneous"></div>
        </div>
        <div class="form-checkbox-row">
            <label><input type="checkbox" name="ritual" th:checked="${spell?.ritual}" value="true"> Ritual</label>
            <label><input type="checkbox" name="concentration" th:checked="${spell?.concentration}" value="true"> Concentration</label>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="6" th:text="${spell?.description}"></textarea>
        </div>
        <div class="form-group">
            <label>At Higher Levels</label>
            <textarea name="higherLevel" rows="3" th:text="${spell?.higherLevel}"></textarea>
        </div>
        <div class="form-actions">
            <a th:if="${spell != null}" class="btn btn-ghost"
               th:href="@{/library/spells/{id}(id=${spell.id})}">Cancel</a>
            <a th:if="${spell == null}" class="btn btn-ghost"
               th:href="@{/library}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${spell == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
