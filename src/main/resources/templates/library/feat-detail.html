<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${feat.name},
          archetype='detail',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${feat.name},
        summary='Feat',
        breadcrumb=~{::#breadcrumb},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">
    <a href="/library">&larr; Back to Library</a>
</nav>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${feat})}"></th:block>
    <th:block th:if="${feat.source.name() == 'SRD'}">
        <form th:hx-post="@{/library/feat/{id}/clone(id=${feat.id})}" hx-target="body"
              hx-disabled-elt="find button[type='submit']">
            <button type="submit" class="btn">Clone &amp; Edit</button>
        </form>
    </th:block>
    <th:block th:if="${feat.source.name() == 'CUSTOM'}">
        <a th:href="@{/library/feat/{id}/edit(id=${feat.id})}" class="btn btn-ghost">Edit</a>
    </th:block>
</div>

<div id="page-content" class="page-content">
<div class="detail-section">
                <div class="detail-meta">
                    <span class="library-chip" th:if="${feat.category != null}" th:text="${feat.category}">Category</span>
                </div>
                <div th:if="${feat.prerequisite != null}" class="detail-meta">
                    <em th:text="'Prerequisite: ' + ${feat.prerequisite}"></em>
                </div>
                <div class="detail-body" th:utext="${#markdown.toHtml(feat.benefit)}"></div>
            </div>
            <th:block th:if="${feat.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${feat})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='FEAT', targetId=${feat.id})}"></th:block>
                </div>
            </th:block>
    <div class="u-mt-lg surface-danger-zone" th:if="${feat.source.name() == 'CUSTOM'}">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">This action cannot be undone.</p>
        <button class="btn btn-danger action-row__destructive"
                th:hx-delete="@{/library/feats/{id}(id=${feat.id})}"
                hx-confirm="Delete this feat?"
                hx-target="body" hx-swap="outerHTML"
                hx-disabled-elt="this">Delete</button>
    </div>

</div>
</body>
</html>
