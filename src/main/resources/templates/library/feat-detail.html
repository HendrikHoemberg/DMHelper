<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${feat.name}">DMHelper -- Feat</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex">
                    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${feat})}"></th:block>
                    <th:block th:if="${feat.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/feats/{id}/clone(id=${feat.id})}" hx-target="body">
                            <button type="submit" class="btn btn-primary">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${feat.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/feats/{id}/edit(id=${feat.id})}" class="btn btn-primary">Edit</a>
                        <button class="btn btn-danger"
                                th:hx-delete="@{/library/feats/{id}(id=${feat.id})}"
                                hx-confirm="Delete this feat?"
                                hx-target="body" hx-swap="outerHTML">Delete</button>
                    </th:block>
                </div>
            </div>
            <div class="detail-section">
                <h1 th:text="${feat.name}">Feat Name</h1>
                <div class="detail-meta">
                    <span class="library-chip" th:if="${feat.category != null}" th:text="${feat.category}">Category</span>
                </div>
                <div th:if="${feat.prerequisite != null}" class="detail-meta">
                    <em th:text="'Prerequisite: ' + ${feat.prerequisite}"></em>
                </div>
                <div class="detail-body" th:utext="${#markdown.toHtml(feat.benefit)}"></div>
            </div>
            <th:block th:if="${feat.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${feat})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='FEAT', targetId=${feat.id})}"></th:block>
                </div>
            </th:block>
        </main>
    </div>
</body>
</html>
