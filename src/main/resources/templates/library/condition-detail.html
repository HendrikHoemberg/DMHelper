<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${condition.name}">DMHelper -- Condition</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex">
                    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${condition})}"></th:block>
                    <th:block th:if="${condition.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/conditions/{id}/clone(id=${condition.id})}" hx-target="body">
                            <button type="submit" class="btn">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${condition.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/conditions/{id}/edit(id=${condition.id})}" class="btn btn-primary">Edit</a>
                        <button class="btn btn-danger"
                                th:hx-delete="@{/library/conditions/{id}(id=${condition.id})}"
                                hx-confirm="Delete this condition?"
                                hx-target="body" hx-swap="outerHTML">Delete</button>
                    </th:block>
                </div>
            </div>
            <div class="detail-section">
                <h1 data-display-title th:text="${condition.name}">Condition Name</h1>
                <div class="detail-body" th:utext="${condition.description}"></div>
            </div>
            <th:block th:if="${condition.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${condition})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='CONDITION', targetId=${condition.id})}"></th:block>
                </div>
            </th:block>
        </main>
    </div>
</body>
</html>
