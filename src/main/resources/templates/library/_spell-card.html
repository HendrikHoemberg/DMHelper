<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="ref-card" th:fragment="spell-card(spell)">
    <h3 class="ref-card__title">
        <a th:href="@{/library/spells/{id}(id=${spell.id})}" th:text="${spell.name}">Spell Name</a>
    </h3>
    <div class="ref-card__meta">
        <span class="ref-card__slot" data-tone="accent"
              th:text="${spell.level == 0} ? 'Cantrip' : 'Level ' + ${spell.level}">Level</span>
        <span class="ref-card__slot" th:if="${spell.school != null}" th:text="${spell.school}">School</span>
        <span class="ref-card__slot" th:if="${spell.ritual}">Ritual</span>
        <span class="ref-card__slot" th:if="${spell.concentration}">Concentration</span>
        <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${spell})}"></th:block>
    </div>
    <div class="ref-card__summary" th:utext="${spell.description}">Description</div>
    <th:block th:replace="~{library/_provenance-fields :: provenance-line(entity=${spell})}"></th:block>
</div>

<th:block th:fragment="spell-card-list(spells)" th:with="cap=60">
    <div class="card-grid card-grid--library" th:if="${spells != null}">
        <th:block th:if="${spells.isEmpty()}">
            <div class="empty-state"><p>No spells match your search.</p></div>
        </th:block>
        <th:block th:each="spell,iter : ${spells}" th:if="${iter.index < cap}">
            <th:block th:replace="~{library/_spell-card :: spell-card(spell=${spell})}"></th:block>
        </th:block>
    </div>
    <th:block th:if="${spells != null and spells.size() > cap}"
              th:replace="~{library/_card :: more-results(shown=${cap}, total=${spells.size()})}"></th:block>
</th:block>
</html>
