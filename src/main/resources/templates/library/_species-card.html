<th:block th:fragment="species-card(species)">
    <div class="ref-card">
        <h2 class="ref-card__title">
            <a th:href="@{/library/species/{id}(id=${species.id})}" th:text="${species.name}">Species Name</a>
        </h3>
        <div class="ref-card__meta">
            <span class="ref-card__slot" th:if="${species.size != null}" th:text="${species.size}">Size</span>
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${species})}"></th:block>
        </div>
        <div class="ref-card__summary" th:if="${species.description != null}"
             th:utext="${#markdown.toHtml(species.description)}">Description</div>
        <th:block th:replace="~{library/_provenance-fields :: provenance-line(entity=${species})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="species-card-list">
    <div class="card-grid card-grid--library" th:if="${speciesList != null and !speciesList.isEmpty()}">
        <th:block th:each="s : ${speciesList}">
            <th:block th:replace="~{library/_species-card :: species-card(species=${s})}"></th:block>
        </th:block>
    </div>
    <div class="empty-state" th:if="${speciesList == null or speciesList.isEmpty()}">
        <p>No species match your search.</p>
    </div>
</th:block>
