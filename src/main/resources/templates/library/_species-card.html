<th:block th:fragment="species-card(species)">
    <div class="card">
        <h3 class="card-title" th:text="${species.name}">Species Name</h3>
        <p th:if="${species.size != null}"><strong>Size:</strong> <span th:text="${species.size}">Size</span></p>
        <p th:if="${species.speed != null}"><strong>Speed:</strong> <span th:text="${species.speed}">Speed</span></p>
        <p th:if="${species.description != null}" class="card-text" th:utext="${#markdown.toHtml(species.description)}">Description</p>
        <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${species})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="species-card-list">
    <div class="card-grid" th:if="${speciesList != null and !speciesList.isEmpty()}">
        <div th:each="s : ${speciesList}" class="card">
            <h3 class="card-title" th:text="${s.name}">Species Name</h3>
            <p th:if="${s.size != null}"><strong>Size:</strong> <span th:text="${s.size}">Size</span></p>
            <p th:if="${s.speed != null}"><strong>Speed:</strong> <span th:text="${s.speed}">Speed</span></p>
            <p th:if="${s.description != null}" class="card-text" th:utext="${#markdown.toHtml(s.description)}">Description</p>
            <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${s})}"></th:block>
        </div>
    </div>
    <div class="empty-state"><p>No species match your search.</p></div>
</th:block>
