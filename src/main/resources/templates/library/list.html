<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${activeCategorySingular + ' Library'},
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${activeCategory},
        summary='The compendium',
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{})}"></th:block>
</div>
<a id="primaryAction" th:href="${activeCategoryNewHref}" class="btn btn-primary"
   th:text="'+ New ' + ${activeCategorySingular}">+ New Monster</a>

<div id="page-content" class="page-content">
<div id="library-root"
     th:attr="data-initial-tab=${initialTab},data-initial-search=${initialSearch}">
    <nav class="category-nav" aria-label="Library categories">
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'monsters'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='monsters')}" data-library-category="Monsters"
           th:attr="aria-current=${initialTab == 'monsters'} ? 'page' : null">Monsters</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'spells'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='spells')}" data-library-category="Spells"
           th:attr="aria-current=${initialTab == 'spells'} ? 'page' : null">Spells</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'conditions'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='conditions')}" data-library-category="Conditions"
           th:attr="aria-current=${initialTab == 'conditions'} ? 'page' : null">Conditions</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'rules'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='rules')}" data-library-category="Rules"
           th:attr="aria-current=${initialTab == 'rules'} ? 'page' : null">Rules</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'equipment'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='equipment')}" data-library-category="Equipment"
           th:attr="aria-current=${initialTab == 'equipment'} ? 'page' : null">Equipment</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'magic-items'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='magic-items')}" data-library-category="Magic Items"
           th:attr="aria-current=${initialTab == 'magic-items'} ? 'page' : null">Magic Items</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'classes'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='classes')}" data-library-category="Classes"
           th:attr="aria-current=${initialTab == 'classes'} ? 'page' : null">Classes</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'species'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='species')}" data-library-category="Species"
           th:attr="aria-current=${initialTab == 'species'} ? 'page' : null">Species</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'backgrounds'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='backgrounds')}" data-library-category="Backgrounds"
           th:attr="aria-current=${initialTab == 'backgrounds'} ? 'page' : null">Backgrounds</a>
        <a class="category-nav__tab"
           th:classappend="${initialTab == 'feats'} ? 'category-nav__tab--active'"
           th:href="@{/library(tab='feats')}" data-library-category="Feats"
           th:attr="aria-current=${initialTab == 'feats'} ? 'page' : null">Feats</a>
    </nav>

    <div id="section-monsters" class="compendium-section">
        <div class="search-bar">
            <div class="form-group">
                <label for="librarySearch">Search</label>
                <input type="text" name="search" id="librarySearch" placeholder="Search by name..."
                       hx-get="/library/statblocks"
                       hx-trigger="keyup changed delay:200ms"
                       hx-target="#library-results"
                       hx-include="#libraryCr,#libraryType,#librarySource"
                       hx-indicator="#library-results-loading">
            </div>
            <div class="form-group">
                <label for="libraryCr">CR</label>
                <select name="cr" id="libraryCr"
                        hx-get="/library/statblocks" hx-trigger="change"
                        hx-target="#library-results"
                        hx-include="#librarySearch,#libraryType,#librarySource"
                        hx-indicator="#library-results-loading">
                    <option value="">Any CR</option>
                    <option value="0">0</option>
                    <option value="1/8">1/8</option>
                    <option value="1/4">1/4</option>
                    <option value="1/2">1/2</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                </select>
            </div>
            <div class="form-group">
                <label for="libraryType">Type</label>
                <select name="type" id="libraryType"
                        hx-get="/library/statblocks" hx-trigger="change"
                        hx-target="#library-results"
                        hx-include="#librarySearch,#libraryCr,#librarySource"
                        hx-indicator="#library-results-loading">
                    <option value="">Any Type</option>
                    <option value="Aberration">Aberration</option>
                    <option value="Beast">Beast</option>
                    <option value="Celestial">Celestial</option>
                    <option value="Construct">Construct</option>
                    <option value="Dragon">Dragon</option>
                    <option value="Elemental">Elemental</option>
                    <option value="Fey">Fey</option>
                    <option value="Fiend">Fiend</option>
                    <option value="Giant">Giant</option>
                    <option value="Humanoid">Humanoid</option>
                    <option value="Monstrosity">Monstrosity</option>
                    <option value="Ooze">Ooze</option>
                    <option value="Plant">Plant</option>
                    <option value="Undead">Undead</option>
                </select>
            </div>
            <div class="form-group">
                <label for="librarySource">Source</label>
                <select name="source" id="librarySource"
                        hx-get="/library/statblocks" hx-trigger="change"
                        hx-target="#library-results"
                        hx-include="#librarySearch,#libraryCr,#libraryType"
                        hx-indicator="#library-results-loading">
                    <option value="">All</option>
                    <option value="SRD">SRD</option>
                    <option value="CUSTOM">Custom</option>
                </select>
            </div>
        </div>

        <div id="library-results" hx-get="/library/statblocks" hx-trigger="load" hx-swap="innerHTML"
             hx-indicator="#library-results-loading">
        </div>
        <div id="library-results-loading" class="loading-region" aria-hidden="true">
            <th:block th:replace="~{fragments/_states :: skeleton(count=4)}"></th:block>
        </div>
    </div>

        </div>
        <div id="spell-results" hx-get="/library/spells" hx-trigger="load" hx-swap="innerHTML"

    <!-- Statblock side sheet (§5.3): filled by ui-elevation.js when a card is clicked. -->
    <div id="statblock-sheet-backdrop" class="sheet-backdrop"></div>
    <div id="statblock-sheet-slot"></div>

    <script>
        function switchCompendiumTab(tab) {
            document.querySelectorAll('.compendium-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + tab)?.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const root = document.getElementById('library-root');
            const tab = root?.dataset.initialTab || 'monsters';
            const search = root?.dataset.initialSearch || '';
            switchCompendiumTab(tab);
            if (!search) return;
            const input = document.querySelector('#section-' + tab + ' input[name="search"]');
            if (!input) return;
            input.value = search;
            input.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, key: 'a' }));
        });
    </script>
