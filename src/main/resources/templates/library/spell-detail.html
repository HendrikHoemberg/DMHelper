<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper -- ' + ${spell.name}">DMHelper -- Spell</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
    <div class="app-shell">
        <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <a href="/library" class="btn btn-ghost">&larr; Back to Library</a>
                <div class="u-flex action-row">
                    <th:block th:replace="~{library/_scope-badge :: scope-badge(entity=${spell})}"></th:block>
                    <th:block th:if="${spell.source.name() == 'SRD'}">
                        <form th:hx-post="@{/library/spells/{id}/clone(id=${spell.id})}" hx-target="body">
                            <button type="submit" class="btn">Clone &amp; Edit</button>
                        </form>
                    </th:block>
                    <th:block th:if="${spell.source.name() == 'CUSTOM'}">
                        <a th:href="@{/library/spells/{id}/edit(id=${spell.id})}" class="btn btn-primary">Edit</a>
                        <span class="action-row__destructive">
                            <button class="btn btn-danger"
                                    th:hx-delete="@{/library/spells/{id}(id=${spell.id})}"
                                    hx-confirm="Delete this spell?"
                                    hx-target="body" hx-swap="outerHTML">Delete</button>
                        </span>
                    </th:block>
                </div>
            </div>
            <div class="detail-section">
                <h1 data-display-title th:text="${spell.name}">Spell Name</h1>
                <div class="detail-meta">
                    <span th:if="${spell.level == 0}" class="library-chip library-chip--accent">Cantrip</span>
                    <span th:unless="${spell.level == 0}" class="library-chip library-chip--accent" th:text="'Level ' + ${spell.level}"></span>
                    <span th:text="${spell.school}">School</span>
                    <span th:if="${spell.ritual}">Ritual</span>
                    <span th:if="${spell.concentration}">Concentration</span>
                </div>
                <div class="detail-grid">
                    <div><strong>Casting Time:</strong> <span th:text="${spell.castingTime}"></span></div>
                    <div><strong>Range:</strong> <span th:text="${spell.range}"></span></div>
                    <div><strong>Components:</strong> <span th:text="${spell.components}"></span></div>
                    <div><strong>Duration:</strong> <span th:text="${spell.duration}"></span></div>
                </div>
                <div class="detail-body" th:utext="${spell.description}"></div>
                <div th:if="${spell.higherLevel != null and !spell.higherLevel.isBlank()}">
                    <strong>At Higher Levels:</strong>
                    <span th:utext="${spell.higherLevel}"></span>
                </div>
            </div>
            <th:block th:if="${spell.source.name() == 'CUSTOM'}"><th:block th:replace="~{library/_provenance-fields :: provenance(entity=${spell})}"></th:block></th:block>
            <th:block th:if="${campaignId != null}">
                <div class="u-mt-lg">
                    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='SPELL', targetId=${spell.id})}"></th:block>
                </div>
            </th:block>
        </main>
    </div>
</body>
</html>
