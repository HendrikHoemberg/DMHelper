<th:block th:fragment="equipment-card(item)">
    <span th:text="${item.name}"></span>
</th:block>

<th:block th:fragment="equipment-card-list">
    <table class="equipment-table settle-in" th:if="${equipment != null and !equipment.isEmpty()}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Cost</th>
                <th>Weight</th>
                <th>Properties</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${equipment}">
                <td class="library-table__name" th:text="${e.name}">Name</td>
                <td class="library-table__meta" th:text="${e.category}">Category</td>
                <td th:text="${e.cost}">Cost</td>
                <td class="library-table__meta" th:text="${e.weight}">Weight</td>
                <td class="library-table__meta" th:text="${e.properties}">Properties</td>
            </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${equipment == null or equipment.isEmpty()}">
        <p class="empty-state__title">No equipment matches your search.</p>
    </div>
</th:block>
