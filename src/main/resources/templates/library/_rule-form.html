<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="rule-form" id="rule-form">
    <h2 th:text="${rule == null ? 'Create Custom Rule' : 'Edit ' + rule.name}">Create Rule</h2>
    <form th:action="${rule == null} ? '/library/rules' : '/library/rules/' + ${rule.id}"
          th:method="${rule == null ? 'post' : 'put'}"
          th:hx-target="${rule == null ? '#rule-results' : '#rule-form'}"
          th:hx-swap="${rule == null ? 'beforeend' : 'outerHTML'}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${rule?.name}" placeholder="e.g. Combat Rules">
        </div>
        <div class="form-group">
            <label>Ruleset</label>
            <input type="text" name="ruleset" th:value="${rule?.ruleset}" placeholder="CUSTOM">
        </div>
        <div class="form-group">
            <label>Body (Markdown)</label>
            <textarea name="body" rows="10" th:text="${rule?.body}"></textarea>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-ghost"
                    th:if="${rule != null}"
                    th:hx-get="@{/library/rules/{id}(id=${rule.id})}"
                    hx-target="#rule-form"
                    hx-swap="outerHTML">Cancel</button>
            <button type="submit" class="btn btn-primary" th:text="${rule == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
