<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="detail-section" th:fragment="class-form" id="class-form">
    <form th:action="${classDetail == null} ? '/library/classes' : '/library/classes/' + ${classDetail.id}"
          method="post">
        <!-- Browsers submit only GET and POST; HiddenHttpMethodFilter turns this into the PUT. -->
        <input type="hidden" name="_method" value="put" th:if="${classDetail != null}">
        <input type="hidden" name="campaignId" th:value="${campaignId}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required th:value="${classDetail?.name}" placeholder="e.g. Fighter">
        </div>
        <div class="form-group">
            <label>Hit Die</label>
            <input type="text" name="hitDie" th:value="${classDetail?.hitDie}" placeholder="d10">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="6" th:text="${classDetail?.description}"></textarea>
        </div>
        <div class="form-actions">
            <a th:if="${classDetail != null}" class="btn btn-ghost"
               th:href="@{/library/classes/id/{id}(id=${classDetail.id})}">Cancel</a>
            <a th:if="${classDetail == null}" class="btn btn-ghost"
               th:href="@{/library}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${classDetail == null ? 'Create' : 'Save'}">Create</button>
        </div>
    </form>
</div>
</html>
