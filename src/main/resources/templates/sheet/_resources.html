<div th:fragment="resources(sheet)" class="sheet-resources" data-change-state="applied">
    <div th:each="res : ${sheet.resources()}" class="sheet-resource">
        <span class="sheet-resource-name" th:text="${res.name()}">Rage</span>
        <span class="sheet-resource-uses u-num" th:text="${res.currentUses() + ' / ' + res.maxUses()}">3 / 3</span>
        <span class="badge" th:text="${#enums.labelOf(res.resetRule())}">Long Rest</span>
    </div>
    <p th:if="${sheet.resources().isEmpty()}" class="text-muted">No resources tracked</p>
</div>
