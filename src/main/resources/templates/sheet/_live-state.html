<div th:fragment="liveState(campaignId, member)" class="sheet-live-state">
    <form class="live-state-form" data-change-state="pending"
          th:hx-put="@{/api/v1/campaigns/{cid}/party/{mid}/live-state(cid=${campaignId}, mid=${member.id})}"
          hx-headers='{"Content-Type": "application/json"}'
          hx-vals='js:{
              tempHp: parseInt(document.getElementById("ls-tempHp").value) || 0,
              inspiration: document.getElementById("ls-inspiration").checked,
              exhaustion: parseInt(document.getElementById("ls-exhaustion").value) || 0,
               deathSaveSuccesses: document.querySelectorAll(".ls-dss:checked").length,
               deathSaveFailures: document.querySelectorAll(".ls-dsf:checked").length,
              concentratingOn: document.getElementById("ls-conc").value || null,
               conditionsJson: JSON.stringify(Array.from(document.querySelectorAll(".ls-condition:checked")).map(cb => cb.value)),
              currentHp: parseInt(document.getElementById("ls-currentHp").value) || 0
          }'
          hx-swap="none"
          hx-disabled-elt="find button[type='submit']"
          hx-on::after-request="if(event.detail.successful) location.reload()">
        <dl class="pm-stats">
            <div>
                <dt>Current HP</dt>
                <dd>
                    <input id="ls-currentHp" type="number" min="0" class="small-input"
                           th:value="${member.currentHp}">
                    / <span th:text="${member.maxHp}">10</span>
                </dd>
            </div>
            <div>
                <dt>Temp HP</dt>
                <dd>
                    <input id="ls-tempHp" type="number" min="0" class="small-input"
                           th:value="${member.tempHp}">
                </dd>
            </div>
            <div>
                <dt>Inspiration</dt>
                <dd>
                    <label>
                        <input id="ls-inspiration" type="checkbox"
                               th:checked="${member.inspiration}">
                        Yes
                    </label>
                </dd>
            </div>
            <div>
                <dt>Exhaustion</dt>
                <dd>
                    <input id="ls-exhaustion" type="number" min="0" max="6" class="small-input"
                           th:value="${member.exhaustion}">
                </dd>
            </div>
            <div>
                <dt>Death Saves</dt>
                <dd class="death-saves">
                    <span class="pip-group" title="Successes">
                        <input type="checkbox" class="ls-dss" th:each="i : ${#numbers.sequence(1,3)}"
                               th:checked="${member.deathSaveSuccesses >= i}"
                               th:aria-label="'Death save success ' + ${i}">
                    </span>
                    /
                    <span class="pip-group" title="Failures">
                        <input type="checkbox" class="ls-dsf" th:each="i : ${#numbers.sequence(1,3)}"
                               th:checked="${member.deathSaveFailures >= i}"
                               th:aria-label="'Death save failure ' + ${i}">
                    </span>
                </dd>
            </div>
            <div>
                <dt>Concentrating</dt>
                <dd>
                    <input id="ls-conc" type="text" class="small-input"
                           th:value="${member.concentratingOn}" placeholder="—">
                </dd>
            </div>
            <div style="flex-basis: 100%">
                <dt>Conditions</dt>
                <dd class="condition-picker"
                    th:with="activeConditions=${member.conditionsJson != null ? member.conditionsJson : '[]'}">
                    <label class="condition-chip"
                           th:each="cond : ${T(java.util.List).of('Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious')}">
                        <input type="checkbox" class="ls-condition" th:value="${cond}"
                               th:checked="${#strings.contains(activeConditions, '&quot;' + cond + '&quot;')}">
                        <span th:text="${cond}">Blinded</span>
                    </label>
                </dd>
            </div>
        </dl>
        <div class="form-actions" style="margin-top: var(--space-sm)">
            <button type="submit" class="btn btn-primary btn-xs">Save Live State</button>
        </div>
    </form>
</div>
