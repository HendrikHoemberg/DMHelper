<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- The fragment is the whole block, not just the <nav>: the dice roller panel and the
     script that registers it live outside the bar itself, and a fragment scoped to <nav>
     alone would silently leave them out of every page. -->
<th:block th:fragment="navbar">
<nav class="navbar">
    <a href="/campaigns" class="navbar-brand">DMHelper</a>
    <div class="navbar-right">
        <button class="btn btn-ghost u-text-sm palette-hint" onclick="window.dispatchEvent(new CustomEvent('command-palette-toggle'))" title="Search everything">⌘K</button>
        <!-- Rolls are logged to a campaign's history, so the roller only exists inside one.
             The panel is a sibling of the bar, not a child, so the two never share an Alpine
             scope; they talk through an event instead — same as the command palette. -->
        <button class="dice-toggle-btn" id="diceToggle"
                th:if="${campaignId != null}"
                onclick="window.dispatchEvent(new CustomEvent('dice-roller-toggle'))"
                title="Toggle Dice Roller (Ctrl+R)">&#x1F3B2;</button>
        <a href="/player" target="_blank" class="btn btn-ghost u-text-sm"
           title="Open player view in a new tab">Player View</a>
        <button class="btn btn-ghost u-text-sm" id="qrToggle"
                onclick="document.getElementById('qrPopover').classList.toggle('hidden')"
                title="Show QR code for player view">QR</button>
        <div id="qrPopover" class="hidden">
            <img th:src="@{/qr/player-view}" alt="Player View QR" width="180" height="180"
                 class="u-block">
            <div class="text-muted u-text-sm u-text-center u-mt-xs">
                Scan to join
            </div>
        </div>
        <span class="dm-shield-badge">PLAYER-SAFE</span>
        <label class="switch-control" title="DM Mode toggles player-safe projection">
            <input type="checkbox" id="dmModeCheckbox">
            <span class="switch-track"></span>
            <span class="switch-label">DM Mode</span>
        </label>
        <script th:inline="javascript">
        /*<![CDATA[*/
        document.body.dataset.campaignId = /*[[${campaignId}]]*/ '';
        /*]]>*/
        </script>
        <script>
        (function() {
            const checkbox = document.getElementById('dmModeCheckbox');

            checkbox.addEventListener('change', () => {
                const on = checkbox.checked;
                window.setDmMode(on);
                window.dispatchEvent(new CustomEvent('dm-mode-changed', { detail: { dmMode: on } }));
            });

            checkbox.checked = true;
            // setDmMode is defined by ui-elevation.js on DOM ready, which is after
            // this inline script parses.
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded',
                    () => window.setDmMode(true, { animate: false }));
            } else {
                window.setDmMode(true, { animate: false });
            }

            window.addEventListener('dm-mode-toggle', () => {
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
            window.addEventListener('tracker-dm-mode-grown', (e) => {
                checkbox.checked = e.detail.dmMode;
                checkbox.dispatchEvent(new Event('change'));
            });
        })();
        </script>
        <span class="pin-display" id="pinDisplay"
              th:text="${pinDisplay}">PIN: -----</span>
    </div>
    <th:block th:replace="~{fragments/_command-palette :: command-palette}"></th:block>
</nav>

<!-- The th:if must sit on an *enclosing* element: th:replace has higher precedence than
     th:if, so on the same tag the replacement happens first and the condition is thrown away
     along with the tag that carried it. -->
<th:block th:if="${campaignId != null}">
    <th:block th:replace="~{fragments/_dice-roller :: dice-roller}"></th:block>
</th:block>

<script>
document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-roll]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const expr = btn.dataset.roll;
    const tooltip = document.createElement('div');
    tooltip.className = 'roll-tooltip';
    tooltip.textContent = '...';
    document.body.appendChild(tooltip);

    const rect = btn.getBoundingClientRect();
    tooltip.style.left = rect.left + 'px';
    tooltip.style.top = (rect.top - 32) + 'px';

    try {
        const campId = document.body.dataset.campaignId;
        const body = { expression: expr, campaignId: campId };
        const activeEnc = document.body.dataset.activeEncounterId || null;
        if (activeEnc) body.encounterId = activeEnc;

        const resp = await fetch('/api/v1/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!resp.ok) {
            tooltip.textContent = 'Error';
            setTimeout(() => tooltip.remove(), 1500);
            return;
        }

        const result = await resp.json();
        tooltip.textContent = expr + ' = ' + result.total;
        window.dispatchEvent(new CustomEvent('dice-roll-result', { detail: result }));
    } catch (e) {
        tooltip.textContent = 'Error';
    }

    setTimeout(() => tooltip.remove(), 3000);
});

document.addEventListener('alpine:init', () => {
    Alpine.data('diceRoller', () => ({
        open: false,
        expression: '',
        advantage: false,
        disadvantage: false,
        result: null,
        history: [],
        loading: false,
        _encounterId: null,

        async init() {
            await this.loadHistory();
            window.addEventListener('tracker-encounter-state', (e) => {
                const encId = e.detail?.encounter?.id || null;
                this._encounterId = encId;
                document.body.dataset.activeEncounterId = encId || '';
            });

            window.addEventListener('dice-roller-toggle', () => { this.open = !this.open; });
            this.$watch('open', (isOpen) => {
                document.getElementById('diceToggle')?.classList.toggle('active', isOpen);
            });
        },

        async roll() {
            let expr = this.expression.trim();
            if (!expr) return;

            if (this.advantage && !expr.toLowerCase().includes('adv')) {
                expr = expr + ' adv';
            } else if (this.disadvantage && !expr.toLowerCase().includes('dis')) {
                expr = expr + ' dis';
            }

            this.loading = true;
            try {
                const campId = document.body.dataset.campaignId;
                const body = { expression: expr, campaignId: campId };
                if (this._encounterId) body.encounterId = this._encounterId;

                const resp = await fetch('/api/v1/roll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    window.showToast(err.detail || 'That expression did not parse. Try something like 2d6+4.', 'error', 5000);
                    return;
                }

                this.result = await resp.json();
                this.$nextTick(() => {
                  const el = this.$refs.resultBox;
                  if (el) {
                    el.classList.remove('bounce');
                    void el.offsetWidth;
                    el.classList.add('bounce');
                  }
                });
                window.dispatchEvent(new CustomEvent('dice-roll-result', {
                    detail: this.result
                }));
                await this.loadHistory();
                this.expression = '';
                this.advantage = false;
                this.disadvantage = false;
            } catch (e) {
                window.showToast('The dice never landed — the server did not answer.', 'error', 5000);
            } finally {
                this.loading = false;
            }
        },

        /* Natural 20 flashes gold, natural 1 flashes ember (§6.5). It is the die
           that has to be natural, not the total: a +7 modifier does not make a
           critical hit. With advantage or disadvantage the used value is the one
           the engine kept, so read the same end of the pair it did. */
        critClass(rolls, advantage, disadvantage) {
            const d20 = (rolls || []).find(r => r.die === 'd20');
            if (!d20 || !d20.values || !d20.values.length) return '';

            let used;
            if ((advantage || disadvantage) && d20.values.length === 2) {
                used = advantage ? Math.max(...d20.values) : Math.min(...d20.values);
            } else if (d20.values.length === 1) {
                used = d20.values[0];
            } else {
                return '';   // several independent d20s — no single natural roll to crow about
            }

            if (used === 20) return 'crit-high';
            if (used === 1) return 'crit-low';
            return '';
        },

        /* History rows come back from the API with `rolls` still a JSON string. */
        historyCritClass(item) {
            if (!item || !item.rolls) return '';
            let rolls = item.rolls;
            if (typeof rolls === 'string') {
                try { rolls = JSON.parse(rolls); } catch (e) { return ''; }
            }
            return this.critClass(rolls, item.advantage, item.disadvantage);
        },

        async loadHistory() {
            try {
                const campId = document.body.dataset.campaignId;
                const resp = await fetch('/api/v1/roll/history?campaignId=' + encodeURIComponent(campId));
                if (resp.ok) this.history = await resp.json();
            } catch (e) {
                // silently ignore
            }
        }
    }));
});

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        window.dispatchEvent(new CustomEvent('dice-roller-toggle'));
    }
});
</script>
</th:block>

</html>
