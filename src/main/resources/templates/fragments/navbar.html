<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- The fragment is the whole block, not just the <nav>: the dice roller panel and the
     script that registers it live outside the bar itself, and a fragment scoped to <nav>
     alone would silently leave them out of every page. -->
<th:block th:fragment="navbar">
<nav class="navbar">
    <a class="navbar-brand" data-display-title th:href="@{/}">DMHelper</a>
    <div class="navbar-right">
        <button class="btn btn-ghost u-text-sm palette-hint" onclick="window.dispatchEvent(new CustomEvent('command-palette-toggle'))" title="Search everything" aria-label="Search everything"><span class="palette-hint__icon" aria-hidden="true">⌕</span><span class="palette-hint__label">Search</span><kbd class="palette-hint__key" id="paletteHintKey">⌘K</kbd></button>
        <!-- Rolls are logged to a campaign's history, so the roller only exists inside one.
             The panel is a sibling of the bar, not a child, so the two never share an Alpine
             scope; they talk through an event instead — same as the command palette. -->
        <a href="/library/tables" class="btn btn-ghost u-text-sm"
           title="Rollable Tables" aria-label="Rollable Tables">📜</a>
        <button class="dice-toggle-btn" id="diceToggle"
                th:if="${campaignId != null}"
                onclick="window.dispatchEvent(new CustomEvent('dice-roller-toggle'))"
                title="Toggle Dice Roller (Ctrl+R)">&#x1F3B2;</button>
        <script th:inline="javascript">
        /*<![CDATA[*/
        document.body.dataset.campaignId = /*[[${campaignId}]]*/ '';
        /*]]>*/
        </script>
        <script>
        (function() {
            if (!/Mac|iP(hone|ad|od)/.test(navigator.platform)) {
                const kbd = document.getElementById('paletteHintKey');
                if (kbd) kbd.textContent = 'Ctrl K';
            }
        })();
        </script>
    </div>
    <th:block th:replace="~{fragments/_command-palette :: command-palette}"></th:block>
</nav>

<!-- The th:if must sit on an *enclosing* element: th:replace has higher precedence than
     th:if, so on the same tag the replacement happens first and the condition is thrown away
     along with the tag that carried it. -->
<th:block th:if="${campaignId != null}">
    <th:block th:replace="~{fragments/_dice-roller :: dice-roller}"></th:block>
</th:block>

<script th:src="@{/js/dice-roller.js}"></script>
<script>
document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-roll]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const expr = btn.dataset.roll;
    const tooltip = document.createElement('div');
    tooltip.className = 'roll-tooltip';
    tooltip.textContent = '...';
    document.body.appendChild(tooltip);

    const rect = btn.getBoundingClientRect();
    tooltip.style.left = rect.left + 'px';
    tooltip.style.top = (rect.top - 32) + 'px';

    try {
        const campId = document.body.dataset.campaignId;
        const body = { expression: expr, campaignId: campId };
        const activeEnc = document.body.dataset.activeEncounterId || null;
        if (activeEnc) body.encounterId = activeEnc;

        const resp = await window.dmRequest('/api/v1/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const result = await resp.json();
        tooltip.textContent = expr + ' = ' + result.total;
        window.dispatchEvent(new CustomEvent('dice-roll-result', { detail: result }));
    } catch (error) {
        tooltip.textContent = 'Roll failed';
        window.reportActionFailure('Could not roll the dice.', error,
            () => btn.click());
    }

    setTimeout(() => tooltip.remove(), 3000);
});

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        window.dispatchEvent(new CustomEvent('dice-roller-toggle'));
    }
});
</script>
</th:block>

</html>
