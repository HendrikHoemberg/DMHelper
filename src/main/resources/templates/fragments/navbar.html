<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav class="navbar" th:fragment="navbar">
    <a href="/campaigns" class="navbar-brand">DMHelper</a>
    <div class="navbar-right">
        <button class="btn btn-ghost u-text-sm palette-hint" onclick="window.dispatchEvent(new CustomEvent('command-palette-toggle'))" title="Search everything">⌘K</button>
        <button class="dice-toggle-btn" id="diceToggle"
                :class="{ active: open }"
                @click="open = !open"
                title="Toggle Dice Roller (Ctrl+R)">&#x1F3B2;</button>
        <a href="/player" target="_blank" class="btn btn-ghost u-text-sm"
           title="Open player view in a new tab">Player View</a>
        <button class="btn btn-ghost u-text-sm" id="qrToggle"
                onclick="document.getElementById('qrPopover').classList.toggle('hidden')"
                title="Show QR code for player view">QR</button>
        <div id="qrPopover" class="hidden">
            <img th:src="@{/qr/player-view}" alt="Player View QR" width="180" height="180"
                 class="u-block">
            <div class="text-muted u-text-sm u-text-center u-mt-xs">
                Scan to join
            </div>
        </div>
        <span class="dm-shield-badge">PLAYER-SAFE</span>
        <label class="dm-toggle switch-control" title="DM Mode toggles player-safe projection">
            <input type="checkbox" id="dmModeCheckbox">
            <span class="switch-track"></span>
            <span class="switch-label">DM Mode</span>
        </label>
        <script th:inline="javascript">
        /*<![CDATA[*/
        document.body.dataset.campaignId = /*[[${campaignId}]]*/ '';
        /*]]>*/
        </script>
        <script>
        (function() {
            const checkbox = document.getElementById('dmModeCheckbox');
            checkbox.addEventListener('change', () => {
                document.body.classList.toggle('dm-mode-off', !checkbox.checked);
            });
            checkbox.checked = true;
            window.addEventListener('dm-mode-toggle', () => {
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
            window.addEventListener('tracker-dm-mode-grown', (e) => {
                checkbox.checked = e.detail.dmMode;
                document.body.classList.toggle('dm-mode-off', !e.detail.dmMode);
                checkbox.dispatchEvent(new Event('change'));
            });
        })();
        </script>
        <span class="pin-display" id="pinDisplay"
              th:text="${pinDisplay}">PIN: -----</span>
    </div>
    <th:block th:replace="~{fragments/_command-palette :: command-palette}"></th:block>
</nav>

<th:block th:replace="~{fragments/_dice-roller :: dice-roller}"></th:block>

<script>
document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-roll]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const expr = btn.dataset.roll;
    const tooltip = document.createElement('div');
    tooltip.className = 'roll-tooltip';
    tooltip.textContent = '...';
    document.body.appendChild(tooltip);

    const rect = btn.getBoundingClientRect();
    tooltip.style.left = rect.left + 'px';
    tooltip.style.top = (rect.top - 32) + 'px';

    try {
        const campId = document.body.dataset.campaignId;
        const body = { expression: expr, campaignId: campId };
        const activeEnc = document.body.dataset.activeEncounterId || null;
        if (activeEnc) body.encounterId = activeEnc;

        const resp = await fetch('/api/v1/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!resp.ok) {
            tooltip.textContent = 'Error';
            setTimeout(() => tooltip.remove(), 1500);
            return;
        }

        const result = await resp.json();
        tooltip.textContent = expr + ' = ' + result.total;
        window.dispatchEvent(new CustomEvent('dice-roll-result', { detail: result }));
    } catch (e) {
        tooltip.textContent = 'Error';
    }

    setTimeout(() => tooltip.remove(), 3000);
});

document.addEventListener('alpine:init', () => {
    Alpine.data('diceRoller', () => ({
        open: false,
        expression: '',
        advantage: false,
        disadvantage: false,
        result: null,
        history: [],
        loading: false,
        _encounterId: null,

        async init() {
            await this.loadHistory();
            window.addEventListener('tracker-encounter-state', (e) => {
                const encId = e.detail?.encounter?.id || null;
                this._encounterId = encId;
                document.body.dataset.activeEncounterId = encId || '';
            });
        },

        async roll() {
            let expr = this.expression.trim();
            if (!expr) return;

            if (this.advantage && !expr.toLowerCase().includes('adv')) {
                expr = expr + ' adv';
            } else if (this.disadvantage && !expr.toLowerCase().includes('dis')) {
                expr = expr + ' dis';
            }

            this.loading = true;
            try {
                const campId = document.body.dataset.campaignId;
                const body = { expression: expr, campaignId: campId };
                if (this._encounterId) body.encounterId = this._encounterId;

                const resp = await fetch('/api/v1/roll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    alert(err.detail || 'Roll failed');
                    return;
                }

                this.result = await resp.json();
                window.dispatchEvent(new CustomEvent('dice-roll-result', {
                    detail: this.result
                }));
                await this.loadHistory();
                this.expression = '';
                this.advantage = false;
                this.disadvantage = false;
            } catch (e) {
                alert('Roll failed: ' + e.message);
            } finally {
                this.loading = false;
            }
        },

        async loadHistory() {
            try {
                const campId = document.body.dataset.campaignId;
                const resp = await fetch('/api/v1/roll/history?campaignId=' + encodeURIComponent(campId));
                if (resp.ok) this.history = await resp.json();
            } catch (e) {
                // silently ignore
            }
        }
    }));
});

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        const root = document.querySelector('[x-data="diceRoller()"]');
        if (root && root.__x) {
            const data = root.__x.getUnobservedData();
            data.open = !data.open;
            root.__x.updateElements(root);
        }
    }
});
</script>

</html>
