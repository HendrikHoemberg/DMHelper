<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="dice-roller"
     x-data="diceRoller()"
     x-show="open"
     x-cloak
     class="dice-panel"
     :class="{ closed: !open }"
     @keydown.escape.window="open = false">

    <div class="dice-panel-header">
        <span>&#x1F3B2; Dice Roller</span>
        <button class="btn btn-ghost dice-panel-close"
                @click="open = false">&times;</button>
    </div>

    <div class="dice-panel-body">
        <div class="dice-input-row">
            <input type="text"
                   x-model="expression"
                   placeholder="e.g. 2d6+4 or typed value"
                   @keydown.enter="roll()"
                   :disabled="loading"
                   autofocus>
            <button @click="roll()" :disabled="loading || !expression">
                <span class="die-icon" :class="{ tumbling: loading }">&#x2684;</span>
                <span x-show="!loading">Roll</span>
                <span x-show="loading">...</span>
            </button>
        </div>

        <div class="dice-options">
            <label>
                <input type="checkbox" x-model="advantage"
                       @change="if(advantage) disadvantage = false">
                Adv
            </label>
            <label>
                <input type="checkbox" x-model="disadvantage"
                       @change="if(disadvantage) advantage = false">
                Dis
            </label>
        </div>

        <div class="dice-result" x-show="result" x-transition x-ref="resultBox">
            <div class="dice-result-total"
                 :class="result ? critClass(result.rolls, result.advantage, result.disadvantage) : ''"
                 x-text="result ? result.total : ''"></div>
            <!-- x-show hides the element but still evaluates its children, so every expression
                 in here has to survive `result` being null — which it is until the first roll. -->
            <div class="dice-result-details" x-show="result && result.rolls && result.rolls.length > 0">
                <template x-for="dieRoll in (result?.rolls || [])" :key="dieRoll.die">
                    <div>
                        <span x-text="dieRoll.die + ': '"></span>
                        <span x-text="'[' + dieRoll.values.join('] [') + ']'"></span>
                    </div>
                </template>
                <div x-show="result && result.modifier != 0">
                    <span x-text="result ? (result.modifier >= 0 ? '+ ' + result.modifier : '- ' + Math.abs(result.modifier)) : ''"></span>
                </div>
                <div x-show="result?.advantage" class="dice-adv">(advantage — higher of 2)</div>
                <div x-show="result?.disadvantage" class="dice-dis">(disadvantage — lower of 2)</div>
            </div>
            <div class="dice-result-details" x-show="result && (!result.rolls || result.rolls.length == 0)">
                typed input
            </div>
        </div>

        <div class="dice-history-section">
            <h4>Recent Rolls</h4>
            <template x-if="history.length === 0">
                <div class="text-muted u-text-sm">No rolls yet</div>
            </template>
            <template x-for="item in history" :key="item.id">
                <template x-if="item.kind === 'TABLE'">
                    <div class="dice-history-item">
                        <span class="expr" x-text="item.tableName"></span>
                        <span class="value" x-text="item.outcomes ? item.outcomes.map(o => o.resultText).join(', ') : ''"></span>
                    </div>
                </template>
                <template x-if="item.kind === 'DICE' || !item.kind">
                    <div class="dice-history-item">
                        <span class="expr" x-text="item.expression"></span>
                        <span class="value"
                              :class="historyCritClass(item)"
                              x-text="item.total"></span>
                    </div>
                </template>
            </template>
        </div>
    </div>
</div>
</html>
