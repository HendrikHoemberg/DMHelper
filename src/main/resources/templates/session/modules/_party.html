<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body(view, mode)"
         data-cockpit-module-fragment="party"
         data-module-role="support"
         th:attr="data-module-mode=${mode}, data-module-empty=${view == null or view.members.isEmpty()}">
  <div data-module-content-root class="runtime-party"
       th:classappend="${view != null} ? |runtime-party--${#strings.toLowerCase(mode.name())}| : ''">
    <th:block th:if="${view == null or view.members.isEmpty()}">
      <div class="empty-state">No party members yet — add them in Party Preparation.</div>
    </th:block>
    <th:block th:if="${view != null and !view.members.isEmpty()}">
      <th:block th:replace="~{party/_summary-bar :: summary-bar(view=${view.members}, mode=${mode}, oob=${null})}"></th:block>
    </th:block>
  </div>
</section>
</html>
