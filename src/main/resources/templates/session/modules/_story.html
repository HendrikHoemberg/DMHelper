<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body(view, mode)"
         th:attr="data-cockpit-module-fragment='story', data-module-mode=${mode}, data-module-empty=${view == null}">
  <div data-module-content-root>
    <th:block th:if="${view == null}">
      <div class="empty-state">No current scene yet — pick one to begin.</div>
    </th:block>
    <th:block th:if="${view != null}">
      <div class="story-module" data-current-scene>
        <div class="story-module__header">
          <h3 th:text="${view.title}">Scene Title</h3>
        </div>
        <th:block th:if="${view.readAloud != null}">
          <div class="structured-block structured-read-aloud u-mb-xs">
            <span class="badge badge-info">Read Aloud</span>
            <p th:text="${view.readAloud}">Read aloud text</p>
          </div>
        </th:block>
        <th:block th:if="${view.sections != null and !view.sections.isEmpty()}">
          <div th:each="section : ${view.sections}" class="structured-block u-mb-xs" data-screen-sensitive>
            <span class="badge" th:text="${section.kind}">SECTION</span>
            <strong th:text="${section.label}">Label</strong>
            <p class="u-text-sm" th:text="${section.body}">Body</p>
          </div>
        </th:block>
        <th:block th:if="${view.participants != null and !view.participants.isEmpty()}">
          <div class="scene-participants u-mt-sm" data-screen-sensitive>
            <h5 class="u-text-sm">Participants</h5>
            <div th:each="p : ${view.participants}" class="participant-row u-mb-xs">
              <strong th:text="${p.displayName}">Name</strong>
              <span class="badge" th:if="${p.quantity > 1}" th:text="|x${p.quantity}|">Qty</span>
              <span class="badge" th:if="${p.disposition != null}" th:text="${p.disposition}">Disp</span>
              <div th:if="${p.statBlockName != null}" class="participant-statblock">
                <span th:text="${p.statBlockName}">Statblock</span>
                <span class="u-text-xs" th:if="${p.statBlockAc != null}" th:text="|AC ${p.statBlockAc}|">AC</span>
                <span class="u-text-xs" th:if="${p.statBlockHp != null}" th:text="|HP ${p.statBlockHp}|">HP</span>
              </div>
              <div th:if="${p.placementHint}" class="u-text-xs text-muted" th:text="${p.placementHint}">Placement</div>
            </div>
          </div>
        </th:block>
        <th:block th:if="${view.transitions != null and !view.transitions.isEmpty()}">
          <div class="scene-transitions u-mt-sm" data-screen-sensitive>
            <h5 class="u-text-sm">Transitions</h5>
            <div th:each="t : ${view.transitions}">
              <span class="u-text-xs text-muted" th:text="|${t.kind}: ${t.label ?: t.targetSceneTitle ?: t.externalDestination ?: 'Unknown'}|">Transition</span>
            </div>
          </div>
        </th:block>
      </div>
    </th:block>
  </div>
</section>
</html>
