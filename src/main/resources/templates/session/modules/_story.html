<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body"
         data-cockpit-module-fragment="story"
         th:attr="data-module-mode=${mode}, data-module-empty=${view == null}">
  <div data-module-content-root class="runtime-story"
       th:classappend="${view != null} ? |runtime-story--${#strings.toLowerCase(mode.name())}| : ''">
    <th:block th:if="${view == null}">
      <div class="empty-state">No current scene yet — pick one to begin.</div>
      <th:block th:replace="~{session/_scene-picker :: scenePicker(campaignId=${campaignId}, currentSceneId=${null})}"></th:block>
    </th:block>
    <th:block th:if="${view != null}">
      <th:block th:if="${mode.name() != 'COMPACT'}" th:replace="~{session/_scene-picker :: scenePicker(campaignId=${campaignId}, currentSceneId=${view.sceneId})}"></th:block>
      <th:block th:replace="~{session/_story-rail :: story(view=${view}, mode=${mode}, campaignId=${campaignId})}"></th:block>
    </th:block>
  </div>
</section>
</html>
