<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body(view, mode)"
         th:attr="data-cockpit-module-fragment='reference', data-module-mode=${mode}, data-module-empty=${view == null}">
  <div data-module-content-root>
    <div class="reference-module-body" x-data="cockpitReference">
      <div class="reference-search-form u-flex u-gap-xs u-mb-sm">
        <input type="search" class="form-input" x-model="query"
               placeholder="Search rules, statblocks, conditions…"
               aria-label="Search reference"
               @input.debounce.250ms="search()" />
      </div>
      <div class="reference-empty-hint u-text-sm text-muted"
           x-show="!query && !errorMessage && results.length === 0">
        <p class="empty">Type at least 2 characters to search the compendium.</p>
        <p class="hint u-text-xs">Search covers rules, statblocks, and conditions.</p>
      </div>
      <div class="reference-error text-danger u-text-sm" x-show="errorMessage"
           x-text="errorMessage" role="alert"></div>
      <div class="reference-no-results u-text-sm text-muted"
           x-show="query && query.length >= 2 && results.length === 0 && !errorMessage && !loading">
        <p>No results found. Try different search terms.</p>
      </div>
      <div class="reference-results" x-show="results.length > 0 && !statblock">
        <template x-for="group in results" :key="group.label">
          <div class="reference-group u-mb-sm">
            <h4 class="u-text-xs text-muted u-mb-xs" x-text="group.label"></h4>
            <template x-for="item in group.items" :key="item.id">
              <div class="reference-item u-text-sm u-px-xs u-py-xs" data-reference-result
                   @click="selectItem(item)">
                <span class="reference-item__title" x-text="item.title"></span>
                <span class="reference-item__qualifier u-text-xs text-muted"
                      x-text="item.subtype || item.type"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- x-if, not x-show: x-show keeps the bindings live, so every x-text below would
           evaluate against a null statblock on first paint and throw. -->
      <template x-if="statblock">
        <div class="reference-detail" x-transition:enter>
          <button class="btn btn-ghost u-text-xs u-mb-sm" @click="clearStatblock()" type="button">&larr; Back to results</button>
          <div class="statblock-render">
            <h2 x-text="statblock.name"></h2>
            <div class="sb-subtitle u-text-sm text-muted">
              <span x-text="statblock.size"></span
              ><span x-show="statblock.size && statblock.type"> </span
              ><span x-text="statblock.type"></span
              ><span x-show="statblock.type && statblock.alignment">, </span
              ><span x-text="statblock.alignment"></span>
              <span x-show="statblock.cr"> &mdash; CR <span x-text="statblock.cr"></span></span>
            </div>
            <hr class="sb-rule">
            <div class="sb-stat-row">
              <div><span>Armor Class</span> <span x-text="statblock.ac"></span></div>
              <div><span>Hit Points</span> <span x-text="statblock.hp"></span></div>
              <div><span>Speed</span> <span x-text="statblock.speed"></span></div>
              <div><span>XP</span> <span x-text="statblock.xp"></span></div>
            </div>

            <div class="u-mt-xs" x-show="statblock.abilityScores">
              <strong class="u-text-xs">Abilities</strong>
              <div class="u-flex u-flex-wrap u-gap-xs" style="margin-top: 2px;">
                <template x-for="(score, key) in statblock.abilityScores" :key="key">
                  <span class="badge" x-text="key.toUpperCase() + ' ' + score"></span>
                </template>
              </div>
            </div>

            <div class="u-mt-xs" x-show="statblock.savingThrows && statblock.savingThrows.length">
              <strong class="u-text-xs">Saving Throws</strong>
              <div class="u-flex u-flex-wrap u-gap-xs" style="margin-top: 2px;">
                <template x-for="st in statblock.savingThrows" :key="st.ability">
                  <span class="badge" x-text="st.ability.toUpperCase() + ' +' + st.modifier"></span>
                </template>
              </div>
            </div>

            <div class="u-mt-xs" x-show="statblock.skills">
              <span class="u-text-xs"><strong>Skills</strong> <span x-text="statblock.skills"></span></span>
            </div>

            <div class="u-mt-xs" x-show="statblock.damageResistances">
              <span class="u-text-xs"><strong>Damage Resistances</strong> <span x-text="statblock.damageResistances"></span></span>
            </div>
            <div class="u-mt-xs" x-show="statblock.damageImmunities">
              <span class="u-text-xs"><strong>Damage Immunities</strong> <span x-text="statblock.damageImmunities"></span></span>
            </div>
            <div class="u-mt-xs" x-show="statblock.conditionImmunities">
              <span class="u-text-xs"><strong>Condition Immunities</strong> <span x-text="statblock.conditionImmunities"></span></span>
            </div>

            <div class="u-mt-xs" x-show="statblock.senses">
              <span class="u-text-xs"><strong>Senses</strong> <span x-text="statblock.senses"></span></span>
            </div>
            <div class="u-mt-xs" x-show="statblock.languages">
              <span class="u-text-xs"><strong>Languages</strong> <span x-text="statblock.languages"></span></span>
            </div>

            <template x-for="section in statblockSections()" :key="section.key">
              <div class="u-mt-sm" x-show="section.entries && section.entries.length">
                <strong class="u-text-xs" x-text="section.label"></strong>
                <template x-for="entry in section.entries" :key="entry.name">
                  <div style="margin-top: 2px;">
                    <span class="u-text-sm" style="font-weight: 600;" x-text="entry.name + '.'"></span>
                    <span class="u-text-xs" x-text="entry.description"></span>
                    <span class="badge" x-show="entry.attackBonus != null" x-text="'Atk +' + entry.attackBonus"></span>
                    <span class="badge" x-show="entry.damageExpression" x-text="entry.damageExpression"></span>
                    <button type="button" class="btn btn-sm btn-ghost"
                            style="padding: 0 4px;"
                            x-show="entry.damageExpression"
                            @click="prefill(entry)">
                      Prefill damage
                    </button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
      <div class="reference-error text-danger u-text-sm" x-show="statblockError"
           x-text="statblockError" role="alert"></div>
    </div>
  </div>
</section>
</html>
