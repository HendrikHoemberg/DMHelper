<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body(view, mode)"
         th:attr="data-cockpit-module-fragment='reference', data-module-mode=${mode}, data-module-empty=${view == null}">
  <div data-module-content-root>
    <div class="reference-module-body" x-data="cockpitReference">
      <div class="reference-search-form u-flex u-gap-xs u-mb-sm">
        <input type="search" class="form-input" x-model="query"
               placeholder="Search rules, statblocks, conditions…"
               aria-label="Search reference"
               @input.debounce.250ms="search()" />
      </div>
      <div class="reference-empty-hint u-text-sm text-muted"
           x-show="!query && !errorMessage && results.length === 0">
        <p class="empty">Type at least 2 characters to search the compendium.</p>
        <p class="hint u-text-xs">Search covers rules, statblocks, and conditions.</p>
      </div>
      <div class="reference-error text-danger u-text-sm" x-show="errorMessage"
           x-text="errorMessage" role="alert"></div>
      <div class="reference-no-results u-text-sm text-muted"
           x-show="query && query.length >= 2 && results.length === 0 && !errorMessage && !loading">
        <p>No results found. Try different search terms.</p>
      </div>
      <div class="reference-results" x-show="results.length > 0 && !statblock">
        <template x-for="group in results" :key="group.label">
          <div class="reference-group u-mb-sm">
            <h4 class="u-text-xs text-muted u-mb-xs" x-text="group.label"></h4>
            <template x-for="item in group.items" :key="item.id">
              <div class="reference-item u-text-sm u-px-xs u-py-xs" data-reference-result
                   @click="selectItem(item)">
                <span x-text="item.name"></span>
                <span class="u-text-xs text-muted" x-text="item.source"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- x-if, not x-show: x-show keeps the bindings live, so every x-text below would
           evaluate against a null statblock on first paint and throw. -->
      <template x-if="statblock">
        <div class="reference-detail" x-transition:enter>
          <button class="btn btn-ghost u-text-xs u-mb-sm" @click="clearStatblock()" type="button">&larr; Back to results</button>
          <div class="statblock-render">
            <h2 x-text="statblock.name"></h2>
            <div class="sb-subtitle" x-text="statblock.type ? (statblock.cr ? statblock.type + ', CR ' + statblock.cr : statblock.type) : ''"></div>
            <hr class="sb-rule">
            <div class="sb-stat-row">
              <div><span>Armor Class</span> <span x-text="statblock.ac"></span></div>
              <div><span>Hit Points</span> <span x-text="statblock.hp"></span></div>
              <div><span>XP</span> <span x-text="statblock.xp"></span></div>
            </div>
          </div>
        </div>
      </template>
      <div class="reference-error text-danger u-text-sm" x-show="statblockError"
           x-text="statblockError" role="alert"></div>
    </div>
  </div>
</section>
</html>
