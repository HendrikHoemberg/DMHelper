<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body(view, mode)"
         th:attr="data-cockpit-module-fragment='session-plan', data-module-mode=${mode}, data-module-empty=${view == null or view.title == null}">
  <div data-module-content-root>
    <div class="session-plan-module-inner">
      <th:block th:if="${view != null and view.title != null}">
        <h3 class="u-text-sm" th:text="${view.title}">Session Plan</h3>
        <div class="plan-beats">
          <th:block th:if="${view.beats != null and !view.beats.isEmpty()}">
            <div th:each="beat : ${view.beats}" class="plan-beat"
                 th:classappend="${beat.current} ? 'beat-current' : (${beat.upcoming} ? 'beat-upcoming' : '')">
              <span class="beat-position" th:text="${beat.position + 1}">1</span>
              <span class="beat-type" th:text="${beat.type}">Scene</span>
              <span class="beat-label" th:text="${beat.label}">Label</span>
              <th:block th:if="${!beat.resolved}">
                <span class="beat-broken-label">Broken link</span>
              </th:block>
            </div>
          </th:block>
          <th:block th:if="${view.beats == null or view.beats.isEmpty()}">
            <p class="text-muted u-text-sm">No beats in this plan.</p>
          </th:block>
        </div>
        <th:block th:if="${mode != null and mode.name() == 'COMPACT'}">
          <div class="plan-upcoming" th:if="${view.upcoming != null}">
            <h4 class="u-text-xs text-muted">Upcoming</h4>
            <div th:each="beat : ${view.upcoming}" class="plan-upcoming-beat u-text-xs">
              <span th:text="${beat.type}">Type</span>
              <span th:text="${beat.label}">Label</span>
            </div>
          </div>
        </th:block>
      </th:block>
      <th:block th:if="${view == null or view.title == null}">
        <div class="empty-state">
          <p class="text-muted">No session plan yet. Create one from a note.</p>
          <span class="u-text-xs text-muted">Capture ideas in quick notes or use the command bar to start planning.</span>
        </div>
      </th:block>
      <th:block th:if="${view != null and view.questProgress != null and !view.questProgress.isEmpty()}">
        <div class="quest-progress-summary quest-progress-panel" data-quest-progress>
          <h4 class="u-text-xs text-muted">Quest Progress</h4>
          <div th:each="qp : ${view.questProgress}" class="quest-progress-item u-text-sm">
            <span class="badge" th:text="${qp.status}">STATUS</span>
            <span th:text="${qp.title}">Quest</span>
          </div>
        </div>
      </th:block>
    </div>
  </div>
</section>
</html>
