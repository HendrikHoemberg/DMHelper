<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body"
         data-cockpit-module-fragment="map"
         data-module-role="primary"
         th:attr="data-module-mode=${mode}, data-module-empty=${view == null}">
  <div data-module-content-root>
    <th:block th:if="${view == null}">
      <div class="empty-state">No map selected. Choose a map to display or create one.</div>
    </th:block>
    <th:block th:if="${view != null}">
      <th:block th:replace="~{session/_map-module :: map-module-runtime}"></th:block>
    </th:block>
  </div>
</section>
</html>
