<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="body"
         data-cockpit-module-fragment="encounter"
         th:attr="data-module-mode=${mode}, data-module-empty=${view == null or (view.activeEncounterId == null and view.planned.isEmpty())}">
  <div data-module-content-root class="runtime-encounter"
       th:attr="data-encounter-id=${view != null ? view.activeEncounterId : null}">
    <th:block th:if="${view == null or (view.activeEncounterId == null and view.planned.isEmpty())}">
      <div class="empty-state" style="padding: var(--space-lg);">
        <p>No active encounter</p>
        <span style="color: var(--color-text-muted);">Link or create an encounter</span>
      </div>
    </th:block>
    <th:block th:if="${view != null and (view.activeEncounterId != null or !view.planned.isEmpty())}">
      <th:block th:replace="~{session/_encounter-rail :: encounters(view=${view}, mode=${mode})}"></th:block>
    </th:block>
  </div>
</section>
</html>
