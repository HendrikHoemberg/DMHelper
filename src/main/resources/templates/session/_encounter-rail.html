<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="encounters(view, mode)">
<div class="encounter-rail-inner" th:attr="data-module-mode=${mode}">
  <div class="sidebar-section">
    <h3>Active Encounter</h3>
    <th:block th:replace="~{encounter/_tracker :: tracker(mode=${mode})}"></th:block>
  </div>
  <div class="sidebar-section">
    <!-- The tracker owns the rail mid-fight, so this list collapses while an encounter is
         active. `encounter` lives inside the tracker's own Alpine scope, not this one, so the
         state is seeded from the server view and kept current from tracker-encounter-state. -->
    <details class="planned-encounters"
             x-data="{ hasActive: false }"
             th:attr="data-has-active=${view.activeEncounterId != null}"
             x-init="hasActive = $el.dataset.hasActive === 'true';
                     window.addEventListener('tracker-encounter-state',
                       e => hasActive = !!e.detail?.encounter)"
             :open="!hasActive">
      <summary>Planned encounters</summary>
      <div x-data="{ plannedFilter: '' }">
        <input type="search" class="form-input" x-model="plannedFilter"
               placeholder="Filter encounters..." style="margin-bottom: var(--space-sm);">
        <th:block th:if="${!view.planned.isEmpty()}">
          <th:block th:each="enc : ${view.planned}">
            <div class="planned-encounter-row"
                 th:attr="data-name=${enc.name}"
                 x-show="!plannedFilter || $el.dataset.name.toLowerCase().includes(plannedFilter.toLowerCase())">
              <span>
                <strong th:text="${enc.name}">Goblin Ambush</strong>
                <small>
                  <span th:text="${enc.mapName + ' · ' + enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants') + ' · '}">Map · 6 combatants · </span>
                  <span th:text="${enc.ready ? 'Ready' : 'Not ready'}"
                        th:title="${enc.ready ? 'Every combatant has a statblock and a map placement' : 'Assign a map and place all combatants'}">Ready</span>
                </small>
              </span>
              <button class="btn btn-ghost encounter-rail__action" style="padding: 2px 8px;"
                      th:attr="data-encounter-id=${enc.id}"
                      @click="runEncounter($el.dataset.encounterId)">Run encounter</button>
            </div>
          </th:block>
        </th:block>
        <th:block th:if="${view.planned.isEmpty()}">
          <div class="empty-state encounter-rail__empty" style="color: var(--color-text-muted);">No planned encounters</div>
        </th:block>
      </div>
    </details>
  </div>
  <div class="sidebar-section" th:if="${!view.suspended.isEmpty()}">
    <h3>Suspended Encounters</h3>
    <th:block th:each="enc : ${view.suspended}">
      <div class="planned-encounter-row">
        <span>
          <strong th:text="${enc.name}">Goblin Ambush</strong>
          <small th:text="${enc.mapName + ' · ' + enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants')}">Map · 6 combatants</small>
        </span>
        <button class="btn btn-ghost encounter-rail__action" style="padding: 2px 8px;"
                th:attr="data-encounter-id=${enc.id}"
                @click="runEncounter($el.dataset.encounterId)">Resume encounter</button>
      </div>
    </th:block>
  </div>
</div>
</th:block>
</html>
