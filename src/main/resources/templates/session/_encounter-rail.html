<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="encounters(view, mode)">
<div class="encounter-rail-inner" th:attr="data-module-mode=${mode}">
  <div class="sidebar-section" data-runtime-state="active-encounter">
    <h3>Active Encounter</h3>
    <th:block th:replace="~{encounter/_tracker :: tracker(mode=${mode})}"></th:block>
  </div>
  <div class="sidebar-section">
    <details class="planned-encounters"
             x-data="{ hasActive: false }"
             th:attr="data-has-active=${view.activeEncounterId != null}"
             x-init="hasActive = $el.dataset.hasActive === 'true';
                     window.addEventListener('tracker-encounter-state',
                       e => hasActive = !!e.detail?.encounter)"
             :open="!hasActive">
      <summary>Planned encounters</summary>
      <div x-data="{ plannedFilter: '' }">
        <label class="sr-only" for="plannedEncounterFilter">Filter planned encounters</label>
        <input type="search" id="plannedEncounterFilter" class="form-input" x-model="plannedFilter"
               placeholder="Filter encounters..." style="margin-bottom: var(--space-sm);">
        <th:block th:if="${!view.currentScenePlanned.isEmpty()}">
          <div class="planned-encounter-section-label">This scene</div>
          <th:block th:each="enc : ${view.currentScenePlanned}">
            <div class="planned-encounter-row"
                 th:attr="data-name=${enc.name}"
                 x-show="!plannedFilter || $el.dataset.name.toLowerCase().includes(plannedFilter.toLowerCase())">
              <span class="planned-encounter-row__title" th:text="${enc.name}">Goblin Ambush</span>
              <span class="planned-encounter-row__meta">
                <span th:text="${enc.mapName != null ? enc.mapName : 'No map'}">Map</span>
                <span aria-hidden="true">·</span>
                <span th:text="${enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants')}">6 combatants</span>
              </span>
              <span class="encounter-chip"
                    th:classappend="${enc.verdict.name() == 'RUNNABLE'} ? 'encounter-chip--ready'
                                  : (${enc.verdict.name() == 'BLOCKED'} ? 'encounter-chip--blocked' : 'encounter-chip--notes')"
                    th:text="${enc.verdict.name() == 'RUNNABLE'} ? 'Ready'
                           : (${enc.verdict.name() == 'BLOCKED'} ? 'Blocked' : 'Needs setup')"
                    th:title="${enc.verdict.name() == 'BLOCKED'} ? 'Assign a map before running this encounter'
                            : 'Runnable now; placement happens on activation'">Ready</span>
              <button class="btn btn-ghost encounter-rail__action" data-runtime-action
                      th:attr="data-encounter-id=${enc.id}"
                      @click="runEncounter($el.dataset.encounterId)">Run</button>
            </div>
          </th:block>
        </th:block>
        <th:block th:if="${!view.planned.isEmpty()}">
          <div class="planned-encounter-section-label" th:if="${!view.currentScenePlanned.isEmpty()}">All planned encounters</div>
          <th:block th:each="enc : ${view.planned}">
            <div class="planned-encounter-row"
                 th:attr="data-name=${enc.name}"
                 x-show="!plannedFilter || $el.dataset.name.toLowerCase().includes(plannedFilter.toLowerCase())">
              <span class="planned-encounter-row__title" th:text="${enc.name}">Goblin Ambush</span>
              <span class="planned-encounter-row__meta">
                <span th:text="${enc.mapName != null ? enc.mapName : 'No map'}">Map</span>
                <span aria-hidden="true">·</span>
                <span th:text="${enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants')}">6 combatants</span>
              </span>
              <span class="encounter-chip"
                    th:classappend="${enc.verdict.name() == 'RUNNABLE'} ? 'encounter-chip--ready'
                                  : (${enc.verdict.name() == 'BLOCKED'} ? 'encounter-chip--blocked' : 'encounter-chip--notes')"
                    th:text="${enc.verdict.name() == 'RUNNABLE'} ? 'Ready'
                           : (${enc.verdict.name() == 'BLOCKED'} ? 'Blocked' : 'Needs setup')"
                    th:title="${enc.verdict.name() == 'BLOCKED'} ? 'Assign a map before running this encounter'
                            : 'Runnable now; placement happens on activation'">Ready</span>

              <button class="btn btn-ghost encounter-rail__action" data-runtime-action
                      th:attr="data-encounter-id=${enc.id}"
                      @click="runEncounter($el.dataset.encounterId)">Run</button>
            </div>
          </th:block>
        </th:block>
        <th:block th:if="${view.planned.isEmpty() && view.currentScenePlanned.isEmpty()}">
          <div class="empty-state encounter-rail__empty" style="color: var(--text-secondary);">No planned encounters</div>
        </th:block>
      </div>
    </details>
  </div>
  <div class="sidebar-section" th:if="${!view.suspended.isEmpty()}">
    <h3>Suspended Encounters</h3>
    <th:block th:each="enc : ${view.suspended}">
      <div class="planned-encounter-row">
        <span class="planned-encounter-row__title" th:text="${enc.name}">Goblin Ambush</span>
        <span class="planned-encounter-row__meta">
          <span th:text="${enc.mapName != null ? enc.mapName : 'No map'}">Map</span>
          <span aria-hidden="true">·</span>
          <span th:text="${enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants')}">6 combatants</span>
        </span>
        <button class="btn btn-ghost encounter-rail__action" data-runtime-action
                th:attr="data-encounter-id=${enc.id}"
                @click="runEncounter($el.dataset.encounterId)">Resume</button>
      </div>
    </th:block>
  </div>
  <div class="sidebar-section" th:if="${!view.finished.isEmpty()}">
    <h3>Finished this session</h3>
    <th:block th:each="enc : ${view.finished}">
      <div class="planned-encounter-row">
        <span class="planned-encounter-row__title" th:text="${enc.name}">Goblin Ambush</span>
        <span class="planned-encounter-row__meta">
          <span th:text="${enc.mapName != null ? enc.mapName : 'No map'}">Map</span>
          <span aria-hidden="true">·</span>
          <span th:text="${enc.combatantCount + (enc.combatantCount == 1 ? ' combatant' : ' combatants')}">6 combatants</span>
        </span>
        <button class="btn btn-ghost encounter-rail__action" data-runtime-action
                th:attr="data-encounter-id=${enc.id}"
                @click="runEncounter($el.dataset.encounterId)">Reopen</button>
      </div>
    </th:block>
  </div>
</div>
</th:block>
</html>
