<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="encounters(view, mode)">
<div class="encounter-rail-inner" th:attr="data-module-mode=${mode}">
  <div class="sidebar-section">
    <h3>Active Encounter</h3>
    <th:block th:replace="~{encounter/_tracker :: tracker(mode=${mode})}"></th:block>
  </div>
  <div class="sidebar-section">
    <h3>Planned Encounters</h3>
    <th:block th:if="${!view.planned.isEmpty()}">
      <th:block th:each="enc : ${view.planned}">
        <div class="planned-encounter-row">
          <span th:text="${enc.name}">Encounter name</span>
          <button class="btn btn-ghost" style="padding: 2px 8px;"
                  th:attr="data-encounter-id=${enc.id}"
                  @click="activateEncounter($el.dataset.encounterId)">Activate</button>
          <button class="btn btn-ghost" style="padding: 2px 8px;"
                  th:if="${enc.mapId != null}"
                  th:attr="data-map-id=${enc.mapId}"
                  @click="switchMap($el.dataset.mapId)"
                  title="Switch to encounter map">Map</button>
        </div>
      </th:block>
    </th:block>
    <th:block th:if="${view.planned.isEmpty()}">
      <div class="empty-state" style="color: var(--color-text-muted);">No planned encounters</div>
    </th:block>
  </div>
</div>
</th:block>
</html>
