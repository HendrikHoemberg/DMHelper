<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="plan(workspace)">
<div class="session-plan-inner" th:if="${workspace.sessionPlan != null}">
  <h3 class="session-plan__heading" style="margin: 0 var(--space-md); text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted);"
      th:text="${workspace.sessionPlan.title}">Session Plan</h3>
  <div class="plan-beats">
    <th:block th:each="beat : ${workspace.sessionPlan.beats()}">
      <div class="plan-beat" th:classappend="${!beat.resolved()} ? 'beat-broken' : ''">
        <span class="beat-position" th:text="${beat.position() + 1}">1</span>
        <span class="beat-type" th:text="${#enums.labelOf(beat.type())}">Scene</span>
        <span class="beat-label" th:text="${beat.label()}">Label</span>
        <th:block th:if="${beat.resolved()}">
          <a class="btn btn-ghost session-plan__action" style="padding: 2px 8px;"
             th:href="${beat.url()}" target="_blank">Open</a>
          <button class="btn btn-ghost session-plan__action" style="padding: 2px 8px;"
                  th:if="${beat.mapId() != null}"
                  th:attr="data-map-id=${beat.mapId()}"
                  @click="switchMap($el.dataset.mapId)">Switch map</button>
          <button class="btn btn-ghost session-plan__action" style="padding: 2px 8px;"
                  th:if="${beat.mapId() != null}"
                  th:attr="data-map-id=${beat.mapId()}"
                  @click="sendToTableWithMap($el.dataset.mapId)">Present</button>
          <button class="btn btn-ghost session-plan__action" style="padding: 2px 8px;"
                  th:if="${beat.type() == 'HANDOUT'}"
                  th:attr="data-handout-id=${beat.targetId()}"
                  @click="presentHandout($el.dataset.handoutId)">Present handout</button>
        </th:block>
        <th:block th:unless="${beat.resolved()}">
          <span class="beat-broken-label">Broken link</span>
        </th:block>
      </div>
    </th:block>
  </div>
</div>
<div class="session-plan-inner" th:if="${workspace.sessionPlan == null}">
  <p style="margin: 0 var(--space-md); color: var(--color-text-muted);">No session plan yet. Create one from a note.</p>
</div>
<!-- Quest progress is always available alongside an optional session plan -->
<div class="session-plan-inner quest-progress-panel" data-quest-progress data-screen-sensitive>
  <h3 class="quest-progress__heading" style="margin: 0 var(--space-md); text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted);">Quest Progress</h3>
  <div th:if="${workspace.questProgressViews != null and !workspace.questProgressViews.isEmpty()}" class="quest-progress-list">
    <div th:each="qpv : ${workspace.questProgressViews}" class="quest-progress-card u-mb-sm"
         th:attr="data-quest-id=${qpv.quest.id}">
      <div class="u-flex u-gap-xs u-items-center">
        <span class="badge" th:text="${#enums.label(qpv.quest.status)}">STATUS</span>
        <strong th:text="${qpv.quest.title}">Quest Title</strong>
      </div>
      <div th:if="${qpv.objectives != null and !qpv.objectives.isEmpty()}" class="objective-list u-mt-xs">
        <div th:each="obj : ${qpv.objectives}" class="objective-row u-text-sm"
             th:attr="data-objective-id=${obj.id}">
          <span class="badge"
                th:classappend="${obj.status.name() == 'COMPLETED'} ? 'badge-success' : (${obj.status.name() == 'ACTIVE'} ? 'badge-warning' : '')"
                th:text="${#enums.label(obj.status)}">STATUS</span>
          <span th:text="${obj.title}">Objective</span>
          <select class="form-input objective-status-select"
                  th:attr="data-objective-id=${obj.id}"
                  @change="setObjectiveStatus($el.dataset.objectiveId, $el.value)">
            <option value="NOT_STARTED" th:selected="${obj.status.name() == 'NOT_STARTED'}">Not started</option>
            <option value="ACTIVE" th:selected="${obj.status.name() == 'ACTIVE'}">Active</option>
            <option value="COMPLETED" th:selected="${obj.status.name() == 'COMPLETED'}">Completed</option>
            <option value="FAILED" th:selected="${obj.status.name() == 'FAILED'}">Failed</option>
            <option value="SKIPPED" th:selected="${obj.status.name() == 'SKIPPED'}">Skipped</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${workspace.questProgressViews == null or workspace.questProgressViews.isEmpty()}" class="empty-state u-mt-sm">
    <p style="margin: 0 var(--space-md); color: var(--color-text-muted);">No quests yet.</p>
  </div>
</div>
</th:block>
</html>
