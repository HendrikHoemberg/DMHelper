<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Honest B1 transitional bodies: useful exits into existing session actions, not fake B2 UIs. -->

<th:block th:fragment="quick-notes">
  <div class="cockpit-deferred-body">
    <p>Capture a quick note without leaving the session.</p>
    <button type="button" class="btn btn-ghost" data-open-quick-notes>
      Open quick-note capture
    </button>
  </div>
</th:block>

<th:block th:fragment="presentation">
  <div class="cockpit-deferred-body">
    <p data-presentation-summary>
      Table output is controlled by the current presentation status.
      <span class="badge" th:attr="data-presentation-mode=${workspace.session.presentationMode}"
            :data-presentation-mode="presentationMode"
            x-text="presentationMode === 'CURTAIN' ? 'Table: Curtain' : (presentationMode === 'MAP' ? 'Table: Map' : 'Table: Handout')">
        Table: Curtain
      </span>
    </p>
    <button type="button" class="btn btn-ghost" data-open-presentation-preview
            @click="window.open('/player', '_blank', 'noopener')">
      Preview table output
    </button>
  </div>
</th:block>

<th:block th:fragment="reference">
  <div class="cockpit-deferred-body">
    <p>Search rules and compendium entries from the cockpit.</p>
    <button type="button" class="btn btn-ghost" data-open-reference-search
            @click="openSearch()">
      Open search
    </button>
  </div>
</th:block>

<th:block th:fragment="session-log">
  <div class="cockpit-deferred-body">
    <p>Review the current session timeline and completed-session note.</p>
    <button type="button" class="btn btn-ghost" data-open-session-review
            @click="openLifecycle()">
      Open session review
    </button>
  </div>
</th:block>
</html>
