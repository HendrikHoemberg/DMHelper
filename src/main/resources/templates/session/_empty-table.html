<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="empty(workspace)">
<div class="empty-table" style="padding: var(--space-lg); text-align: center;">
  <p style="color: var(--text-secondary); margin-bottom: var(--space-md);">No map selected. Choose a map to display or create one.</p>
  <th:block th:if="${!workspace.maps.isEmpty()}">
    <select id="empty-map-selector" class="empty-map-selector" style="padding: 4px 8px; background: var(--surface-canvas); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 4px;"
            @change="switchMap($event.target.value)">
      <option value="">-- Select a map --</option>
      <option th:each="m : ${workspace.maps}" th:value="${m.id}" th:text="${m.name}">Map name</option>
    </select>
  </th:block>
  <div style="margin-top: var(--space-md); display: flex; gap: var(--space-sm); justify-content: center;">
    <a class="btn btn-ghost" th:href="@{/campaigns/{id}/maps/new(id=${workspace.campaign.id})}">Create Map</a>
    <a class="btn btn-ghost" th:href="@{/campaigns/{id}/adventures(id=${workspace.campaign.id})}">Create Adventure</a>
  </div>
</div>
</th:block>
</html>
