<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/book.css}">
    <link rel="stylesheet" th:href="@{/css/cockpit.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <script th:src="@{/js/dm-request.js}"></script>
    <script th:src="@{/js/keyboard.js}"></script>
    <script th:src="@{/js/command-palette.js}"></script>
    <script th:src="@{/js/quicknotes.js}"></script>
    <script th:src="@{/js/ui-elevation.js}"></script>
    <script th:src="@{/js/campaign-import.js}" defer></script>
    <script th:src="@{/js/session-cockpit.js}"></script>
    <script th:src="@{/js/rollable-table-roll.js}"></script>
    <script th:src="@{/js/dice-roller.js}"></script>
    <script th:src="@{/js/audio-provider-registry.js}"></script>
    <script th:src="@{/js/audio-provider-youtube.js}"></script>
    <script th:src="@{/js/audio-widget.js}"></script>
    <script th:src="@{/vendor/alpine.min.js}" defer></script>
    <title th:text="${workspace.campaign.name + ' — Session'}">Campaign — Session</title>
</head>
<body th:attr="data-campaign-id=${campaignId}">
<main class="session-cockpit"
      x-data="sessionCockpit(window.sessionCockpitConfig)"
      @session-next-turn.window="nextTurn()"
      @session-scene-step.window="stepScene($event.detail.direction)"
      @keydown.window="handleKeyboard($event)">
  <header class="cockpit-topbar">
    <h1 style="font-family: var(--font-display); font-size: var(--text-lg); margin: 0;" th:text="${workspace.campaign.name}">Campaign</h1>
    <span class="badge" x-text="sessionStatus" th:attr="data-session-status=${workspace.session.status}">IDLE</span>
    <span th:text="${workspace.currentDate.year + '-' + (workspace.currentDate.month + 1) + '-' + workspace.currentDate.day}">1492-7-12</span>
    <span style="flex: 1"></span>
    <button class="btn btn-ghost" @click="openSearch()">Search</button>
    <button class="btn btn-ghost" @click="openDice()">Dice</button>
    <a class="btn btn-ghost" target="_blank"
       th:href="@{/campaigns/{id}/handouts(id=${campaignId})}">Handouts</a>
    <select id="cockpitHandoutPicker" class="form-input" aria-label="Present handout"
            :disabled="sessionStatus === 'IDLE'"
            @change="presentHandout($event.target.value); $event.target.value = ''">
      <option value="">Present handout…</option>
      <option th:each="handout : ${workspace.handouts}" th:unless="${handout.dmOnly}"
              th:value="${handout.id}" th:text="${handout.title}">Handout</option>
    </select>
    <select id="cockpitTablePicker" class="form-input" aria-label="Roll linked table"
            @change="openLinkedTable($event.target.value, $event.target.options[$event.target.selectedIndex]?.text || ''); $event.target.value = ''">
      <option value="">Roll linked table…</option>
      <option th:each="t : ${workspace.linkedTables}" th:value="${t.tableId}" th:text="${t.name}">Table</option>
    </select>
    <a class="btn btn-ghost" target="_blank" href="/library?tab=rules">Rules</a>
    <a class="btn btn-ghost" target="_blank"
       th:href="@{/campaigns/{id}/calendar(id=${campaignId})}">Calendar</a>
    <button class="btn btn-ghost" x-ref="sessionButton" @click="openLifecycle()">Session</button>
  </header>
  <th:block th:replace="~{rollable-table/_roll-panel :: roll-panel(tableId=${null}, compact=${true})}"></th:block>
  <section class="cockpit-grid">
    <aside class="cockpit-story" aria-label="Story rail"
           th:replace="~{session/_story-rail :: story(workspace=${workspace})}"></aside>
    <section class="cockpit-table" aria-label="Table surface"
             th:attr="data-selection-source=${workspace.selectionSource}">
      <div class="battle-toolbar" aria-label="Battle map controls">
        <div class="tool-group map-switcher">
          <label for="cockpitMapPicker" class="sr-only">Workspace map</label>
          <select id="cockpitMapPicker" aria-label="Workspace map" :value="currentMapId"
                  @change="switchMap($event.target.value)">
            <option value="" :disabled="sessionStatus === 'IDLE' && !!currentMapId">No map</option>
            <template x-for="m in maps" :key="m.id">
              <option :value="m.id" x-text="m.name"></option>
            </template>
          </select>
        </div>
        <div class="tool-group">
          <button class="tool-btn" :class="{ active: tool === 'select' }"
                  @click="setTool('select')" :disabled="!currentMapId">Select</button>
          <button class="tool-btn" :class="{ active: tool === 'measure' }"
                  @click="setTool('measure')" :disabled="!currentMapId">Measure</button>
          <button class="tool-btn" @click="addToken()" :disabled="!currentMapId">+ Token</button>
          <button class="tool-btn" @click="addParty()" :disabled="!currentMapId">Add Party</button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" :class="{ active: movementMode === 'GRID' }"
                  @click="toggleMovementMode()" :disabled="!currentMapId"
                  x-text="movementMode === 'GRID' ? 'Grid movement' : 'Free movement'">Grid movement</button>
          <button class="tool-btn" :class="{ active: showGrid }"
                  @click="toggleShowGrid()" :disabled="!currentMapId">Grid lines</button>
        </div>
        <div class="tool-group table-presentation-controls">
          <span class="badge" th:attr="data-presentation-mode=${workspace.session.presentationMode}"
                :data-presentation-mode="presentationMode"
                x-text="presentationMode === 'CURTAIN' ? 'Table: Curtain' : (presentationMode === 'MAP' ? 'Table: Map' : 'Table: Handout')">
            Table: Curtain
          </span>
          <button class="tool-btn" :class="{ active: presentingMap }" @click="sendToTable()"
                  :disabled="sessionStatus === 'IDLE' || !currentMapId">Present current map</button>
          <button class="tool-btn" @click="curtain()" :disabled="sessionStatus === 'IDLE'">Curtain</button>
          <a class="tool-btn" href="/player" target="_blank">Preview table</a>
        </div>
      </div>
      <div class="battle-body">
        <div th:if="${workspace.workspaceMap != null}" id="battleCanvasWrap"></div>
        <th:block th:unless="${workspace.workspaceMap != null}"
                  th:replace="~{session/_empty-table :: empty(workspace=${workspace})}"></th:block>
        <aside class="battle-sidebar" th:if="${workspace.workspaceMap != null}" aria-label="Map tokens">
          <section class="sidebar-section">
            <h3>From Library</h3>
            <div class="statblock-search">
              <input type="search" placeholder="Search statblocks…" aria-label="Search statblocks"
                     x-model="sbSearch" @input="searchStatblocks()">
              <div class="sb-results" x-show="sbResults.length > 0 && sbSearch.length > 0" x-cloak>
                <template x-for="sb in sbResults" :key="sb.id">
                  <button type="button" class="sb-result-item" @click="addStatblockToken(sb.id)">
                    <strong x-text="sb.name"></strong>
                    <span class="sb-cr" x-text="'CR ' + sb.cr"></span>
                  </button>
                </template>
              </div>
            </div>
          </section>
          <section class="sidebar-section threat-pin-section" data-threat-pins>
            <h3>Threat pins</h3>
            <p class="text-muted u-text-xs">DM-only. Click a diamond marker on the map to open the card.</p>
            <label class="u-block u-text-sm">Type
              <select x-model="threatPinKind" class="u-w-full">
                <option value="TRAP">Trap</option>
                <option value="HAZARD">Hazard</option>
              </select>
            </label>
            <label class="u-block u-text-sm">Search
              <input type="search" x-model="threatPinQuery" @input.debounce.300ms="searchThreatPins()"
                     placeholder="Find trap/hazard…" class="u-w-full">
            </label>
            <div x-show="threatPinResults.length" x-cloak>
              <template x-for="item in threatPinResults" :key="item.id">
                <button type="button" class="btn btn-ghost u-w-full" style="justify-content:flex-start"
                        @click="selectThreatForPin(item)" x-text="item.name"></button>
              </template>
            </div>
            <label class="u-block u-text-sm">Label <input type="text" x-model="threatPinLabel" class="u-w-full"></label>
            <div class="u-flex u-gap-sm">
              <label class="u-text-sm">X <input type="number" x-model.number="threatPinX" class="u-w-full"></label>
              <label class="u-text-sm">Y <input type="number" x-model.number="threatPinY" class="u-w-full"></label>
            </div>
            <button type="button" class="btn btn-primary u-w-full" style="margin-top:4px"
                    @click="createThreatPin()" :disabled="!selectedThreatForPin">Create pin</button>
            <template x-for="pin in threatPins" :key="pin.id">
              <div class="u-flex u-items-center u-gap-xs" style="font-size:var(--text-sm);margin-top:4px">
                <span style="flex:1" x-text="pin.title || pin.key"></span>
                <button type="button" class="btn btn-ghost" @click="deleteThreatPin(pin.id)">×</button>
              </div>
            </template>
          </section>
          <section class="sidebar-section">
            <h3>Tokens (<span x-text="tokens.length">0</span>)</h3>
            <template x-for="t in tokens" :key="t.id">
              <div class="token-list-item" @click="focusToken(t.id)">
                <span class="token-swatch" :style="{ background: t.color }"></span>
                <span :class="{ 'token-dead': t.dead }" x-text="t.name" style="flex: 1;"></span>
                <span x-show="t.currentHp != null && t.maxHp != null"
                      x-text="t.currentHp + '/' + t.maxHp"></span>
                <button type="button" class="btn btn-ghost" title="Duplicate token"
                        @click.stop="duplicateToken(t.id)">Copy</button>
                <button type="button" class="btn btn-ghost" title="Delete token"
                        @click.stop="deleteToken(t.id)">Delete</button>
              </div>
            </template>
          </section>
          <template x-if="selectedToken">
            <section class="sidebar-section">
              <h3>Selected token</h3>
              <label>Name <input type="text" x-model="selectedToken.name" @change="updateToken()"></label>
              <label>Current HP <input type="number" class="hp-input"
                                       x-model="selectedToken.currentHp" @change="updateToken()"></label>
              <label>Max HP <input type="number" class="hp-input"
                                   x-model="selectedToken.maxHp" @change="updateToken()"></label>
              <label><input type="checkbox" x-model="selectedToken.hidden" @change="updateToken()"> Hidden</label>
              <label><input type="checkbox" x-model="selectedToken.dead" @change="toggleDead()"> Dead</label>
            </section>
          </template>
        </aside>
      </div>
      <div class="battle-statusbar" aria-live="polite">
        <span id="battleStatusMessage">Ready</span>
        <span id="battleCursorInfo"></span>
        <span id="battleSaveIndicator" class="save-indicator save-saved">Saved</span>
      </div>
    </section>
    <aside class="cockpit-encounter" aria-label="Encounter rail"
           th:replace="~{session/_encounter-rail :: encounters(workspace=${workspace})}"></aside>
  </section>
  <section class="cockpit-plan" aria-label="Session plan"
           th:replace="~{session/_session-plan :: plan(workspace=${workspace})}"></section>
  <th:block th:replace="~{audio/_cockpit-widget :: cockpit-widget-config(campaignId=${campaignId}, sessionId=${workspace.session.id})}"></th:block>
  <section class="cockpit-audio-section" aria-label="Audio playback"
           th:replace="~{audio/_cockpit-widget :: cockpit-widget(campaignId=${campaignId}, sessionId=${workspace.session.id})}"></section>
  <footer class="cockpit-partybar">
    <th:block th:replace="~{party/_summary-bar :: summary-bar(members=${workspace.partyMembers}, oob=null)}"></th:block>
  </footer>
  <th:block th:replace="~{session/_lifecycle-dialog :: lifecycle-dialog}"></th:block>
</main>
<th:block th:replace="~{fragments/_command-palette :: command-palette}"></th:block>
    <th:block th:replace="~{fragments/_dice-roller :: dice-roller}"></th:block>
<script th:src="@{/vendor/konva.min.js}"></script>
<script th:inline="javascript">
window.sessionCockpitConfig = {
    campaignId: /*[[${campaignId}]]*/ '',
    sessionId: /*[[${workspace.session.id}]]*/ null,
    mapId: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.id : null}]]*/ null,
    sessionStatus: /*[[${workspace.session.status}]]*/ 'IDLE',
    presentationMode: /*[[${workspace.session.presentationMode}]]*/ 'CURTAIN',
    presentedMapId: /*[[${workspace.session.presentedMap != null ? workspace.session.presentedMap.id : null}]]*/ null,
    attendeeIds: /*[[${attendeeIds}]]*/ [],
    draftBody: /*[[${workspace.session.draftBody}]]*/ null
};
// DM-only threat map pins: open library detail when a pin is clicked on the battle map.
window.addEventListener('threat-card-open', (event) => {
    const detail = event.detail || {};
    if (!detail.threatId || !detail.threatKind) return;
    const base = detail.threatKind === 'HAZARD' ? '/library/hazards/' : '/library/traps/';
    const title = detail.title ? ` (${detail.title})` : '';
    if (window.showToast) {
        window.showToast('Opening threat card' + title, 'info');
    }
    window.open(base + detail.threatId, '_blank', 'noopener');
});
</script>
</body>
</html>
