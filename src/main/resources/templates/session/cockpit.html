<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-test-audio-provider=${testAudioProvider ? 'FAKE' : null}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1510'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23c9a24a' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/book.css}">
    <link rel="stylesheet" th:href="@{/css/cockpit.css}">
    <link rel="stylesheet" th:href="@{/css/cockpit-layout.css}">
    <link rel="stylesheet" th:href="@{/css/cockpit-modules.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <script th:src="@{/js/dm-request.js}"></script>
    <script th:src="@{/js/keyboard.js}"></script>
    <script th:src="@{/js/runtime-status.js}" defer></script>
    <script th:src="@{/js/command-palette.js}"></script>
    <script th:src="@{/js/quicknotes.js}"></script>
    <script th:src="@{/js/cockpit-reference.js}"></script>
    <script th:src="@{/js/ui-elevation.js}"></script>
    <script th:src="@{/js/campaign-import.js}" defer></script>
    <script th:src="@{/js/session-cockpit.js}"></script>
    <script th:src="@{/js/combat-tracker.js}"></script>
    <script th:src="@{/js/rollable-table-roll.js}"></script>
    <script th:src="@{/js/dice-roller.js}"></script>
    <script th:src="@{/js/audio-provider-registry.js}"></script>
    <script th:src="@{/js/audio-provider-youtube.js}"></script>
    <script th:if="${testAudioProvider}" th:src="@{/js/audio-provider-fake.js}"></script>
    <script th:src="@{/js/audio-widget.js}"></script>
    <script th:src="@{/js/cockpit-layout.js}" defer></script>
    <script th:src="@{/js/cockpit-modules.js}" defer></script>
    <script th:src="@{/vendor/alpine.min.js}" defer></script>
    <title th:text="${workspace.campaign.name + ' — Session'}">Campaign — Session</title>
</head>
<body th:attr="data-campaign-id=${campaignId}">
<main class="session-cockpit" data-surface="run"
      x-data="sessionCockpit(window.sessionCockpitConfig)"
      @session-next-turn.window="nextTurn()"
      @session-scene-step.window="stepScene($event.detail.direction)"
      @request-encounter-end.window="openEncounterEndDialog()"
      @cockpit-encounter-ended.window="refreshModules(['story', 'encounter'], 'encounter-ended')"
      @keydown.window="handleKeyboard($event)">
  <header class="cockpit-topbar">
    <h1 class="cockpit-topbar__title" data-display-title
        th:text="${workspace.campaign.name}">Campaign</h1>
    <span class="badge" x-text="sessionStatus" th:attr="data-session-status=${workspace.session.status}">IDLE</span>
    <span class="u-nowrap cockpit-topbar__date"
          th:text="${@calendarService.formatDate(campaignId, workspace.currentDate)}">12 July 1492</span>
    <span id="runtimeStatus" class="cockpit-status" role="status" aria-live="polite">
      <span class="cockpit-status__atom" data-status-save data-state="idle">Up to date</span>
    </span>
    <label class="u-nowrap" for="cockpitPresetPicker">
      <span class="sr-only">Layout preset</span>
      <select id="cockpitPresetPicker" class="form-input" disabled aria-disabled="true"
              th:attr="data-default-preset=${cockpitDefaultPresetKey}">
        <option th:each="preset : ${cockpitPresets}"
                th:value="${preset.key}"
                th:text="${preset.name}"
                th:selected="${preset.key == cockpitDefaultPresetKey}">Exploration</option>
      </select>
    </label>
    <details id="cockpitPresetOverflow" class="cockpit-preset-overflow" hidden>
      <summary class="btn btn-ghost" aria-label="Preset actions">Preset</summary>
      <div class="cockpit-preset-overflow__panel" role="menu" aria-label="Preset actions">
        <button type="button" class="btn btn-ghost" role="menuitem"
                data-preset-action="duplicate" disabled aria-disabled="true">Duplicate preset</button>
        <button type="button" class="btn btn-ghost" role="menuitem"
                data-preset-action="rename" disabled aria-disabled="true">Rename preset</button>
        <button type="button" class="btn btn-ghost" role="menuitem"
                data-preset-action="delete" disabled aria-disabled="true">Delete preset</button>
        <button type="button" class="btn btn-ghost" role="menuitem"
                data-preset-action="restore" disabled aria-disabled="true">Restore built-in</button>
      </div>
    </details>
    <button type="button" id="cockpitLayoutModeButton" class="btn btn-ghost"
            disabled aria-disabled="true">Edit layout</button>
    <button type="button" id="cockpitAddModuleButton" class="btn btn-ghost"
            data-layout-edit-only hidden disabled aria-disabled="true">Add module</button>
    <button type="button" id="cockpitBottomUtilityToggle" class="btn btn-ghost"
            data-bottom-utility-toggle data-layout-edit-only hidden disabled
            aria-disabled="true" aria-expanded="false"
            aria-controls="cockpitBottomUtility">Show utilities</button>
    <span style="flex: 1"></span>
    <button class="btn btn-ghost" @click="openSearch()">Search</button>
    <button class="btn btn-ghost" @click="openDice()">Dice</button>
    <button class="btn btn-ghost" x-ref="sessionButton" @click="openLifecycle()">Session</button>
        <details class="cockpit-topbar__overflow">
      <summary class="btn btn-ghost">More</summary>
      <div class="cockpit-topbar__overflow-panel">
        <select id="cockpitTablePicker" class="form-input" aria-label="Roll linked table"
                @change="openLinkedTable($event.target.value, $event.target.options[$event.target.selectedIndex]?.text || ''); $event.target.value = ''">
          <option value="">Roll linked table…</option>
          <option th:each="t : ${workspace.linkedTables}" th:value="${t.tableId}" th:text="${t.name}">Table</option>
        </select>
        <a class="btn btn-ghost" target="_blank" href="/library?tab=rules">Rules</a>
        <a class="btn btn-ghost" target="_blank"
           th:href="@{/campaigns/{id}/calendar(id=${campaignId})}">Calendar</a>
        <a class="btn btn-ghost" th:href="@{/campaigns/{id}(id=${campaignId})}">Leave cockpit</a>
      </div>
    </details>
  </header>
  <th:block th:replace="~{rollable-table/_roll-panel :: roll-panel(tableId=${null}, compact=${true})}"></th:block>

  <th:block th:replace="~{audio/_cockpit-widget :: cockpit-widget-config(campaignId=${campaignId}, sessionId=${workspace.session.id})}"></th:block>

  <th:block th:replace="~{session/_cockpit-workbench :: workbench(
      workspace=${workspace},
      campaignId=${campaignId},
      cockpitModuleByKey=${cockpitModuleByKey})}"></th:block>

  <th:block th:replace="~{session/_lifecycle-dialog :: lifecycle-dialog}"></th:block>
  <dialog class="cockpit-dialog" data-encounter-end-dialog
          aria-labelledby="encounterEndDialogTitle"
          @cancel.prevent="closeEncounterEndDialog()">
    <h2 id="encounterEndDialogTitle">End active encounter?</h2>
    <p>This stops initiative tracking for the active encounter. The session itself remains open.</p>
    <div class="cockpit-dialog__actions">
      <button type="button" class="btn btn-danger action-row__destructive" @click="confirmEncounterEnd()">End encounter</button>
      <button type="button" class="btn btn-ghost" @click="closeEncounterEndDialog()">Cancel</button>
    </div>
  </dialog>

  <dialog class="cockpit-dialog" id="encounterReplacementDialog"
          aria-labelledby="encounterReplacementTitle"
          @cancel.prevent="closeReplacementDialog()">
    <h2 id="encounterReplacementTitle">Another encounter is running</h2>
    <p x-text="(_replacementActiveName || 'Another encounter') + ' is currently active. Choose how to proceed:'"></p>
    <div class="cockpit-dialog__actions">
      <button type="button" class="btn btn-primary" @click="confirmSuspendCurrent()">Suspend current and run</button>
      <button type="button" class="btn btn-danger action-row__destructive" @click="confirmEndCurrent()">End current and run</button>
      <button type="button" class="btn btn-ghost" @click="closeReplacementDialog()">Cancel</button>
    </div>
  </dialog>

  <dialog class="cockpit-dialog" id="encounterReadinessDialog"
          aria-labelledby="encounterReadinessTitle"
          @cancel.prevent="closeReadinessDialog()">
    <h2 id="encounterReadinessTitle">Encounter readiness</h2>
    <template x-if="_readinessData">
      <div>
        <p x-show="_readinessData.canRun === false">The encounter has blocking issues:</p>
        <ul>
          <template x-for="issue in _readinessData.issues || []" :key="issue.code">
            <li x-text="issue.severity + ': ' + issue.message"></li>
          </template>
        </ul>
      </div>
    </template>
    <div class="cockpit-dialog__actions">
      <button type="button" class="btn btn-ghost" @click="openEncounterSetup()">Open setup</button>
      <button type="button" class="btn btn-ghost" x-show="readinessCanRun"
              @click="confirmRunReady()">Run anyway</button>
      <button type="button" class="btn btn-ghost" @click="closeReadinessDialog()">Cancel</button>
    </div>
  </dialog>
</main>
<th:block th:replace="~{fragments/_command-palette :: command-palette}"></th:block>
    <th:block th:replace="~{fragments/_dice-roller :: dice-roller}"></th:block>
<script th:src="@{/vendor/konva.min.js}"></script>
<script th:inline="javascript">
window.sessionCockpitConfig = {
    campaignId: /*[[${campaignId}]]*/ '',
    sessionId: /*[[${workspace.session.id}]]*/ null,
    mapId: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.id : null}]]*/ null,
    gridWidth: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.gridWidth : null}]]*/ null,
    gridHeight: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.gridHeight : null}]]*/ null,
    cellSizePx: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.cellSizePx : null}]]*/ null,
    movementMode: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.movementMode : null}]]*/ null,
    showGrid: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.showGrid : true}]]*/ true,
    sessionStatus: /*[[${workspace.session.status}]]*/ 'IDLE',
    attendeeIds: /*[[${attendeeIds}]]*/ [],
    draftBody: /*[[${workspace.session.draftBody}]]*/ null,
    encounterMapId: null
};
window.cockpitLayoutConfig = {
    campaignId: /*[[${campaignId}]]*/ '',
    modules: /*[[${cockpitModules}]]*/ [],
    presets: /*[[${cockpitPresets}]]*/ [],
    defaultPresetKey: /*[[${cockpitDefaultPresetKey}]]*/ 'builtin:exploration',
    runtimeModulesEnabled: true,
    mapId: /*[[${workspace.workspaceMap != null ? workspace.workspaceMap.id : null}]]*/ null
};
// DM-only threat map pins: open library detail when a pin is clicked on the battle map.
window.addEventListener('threat-card-open', (event) => {
    const detail = event.detail || {};
    if (!detail.threatId || !detail.threatKind) return;
    const base = detail.threatKind === 'HAZARD' ? '/library/hazards/' : '/library/traps/';
    const title = detail.title ? ` (${detail.title})` : '';
    if (window.showToast) {
        window.showToast('Opening threat card' + title, 'info');
    }
    window.open(base + detail.threatId, '_blank', 'noopener');
});
</script>
</body>
</html>
