<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="story(view, mode, campaignId)">
<div class="story-rail-inner">
  <div class="sidebar-section">
    <h3>Story</h3>
    <div class="scene-card" data-runtime-state="current-scene">
      <div class="scene-card__state">
        <svg th:replace="~{common/_icon :: icon-sized(name='map', size='14')}"></svg>
        <span>Current scene</span>
      </div>
      <h4 data-current-scene th:text="${view.title}">Scene Title</h4>
      <th:block th:if="${view.readAloud != null}">
        <div class="structured-block structured-read-aloud u-mb-xs">
          <span class="badge badge--info">Read Aloud</span>
          <p th:text="${view.readAloud}">Read aloud text</p>
        </div>
      </th:block>
      <div class="structured-block scene-summary u-mb-xs"
           th:if="${view.summary != null and mode.name() != 'COMPACT'}"
           th:text="${view.summary}">Scene summary</div>
      <div class="structured-block scene-body u-mb-xs"
           th:if="${view.body != null and mode.name() != 'COMPACT'}"
           th:text="${view.body}">Scene notes</div>
      <th:block th:if="${view.sections != null and !view.sections.isEmpty() and mode.name() != 'COMPACT'}">
        <div th:each="section : ${view.sections}" th:if="${section.kind != 'READ_ALOUD'}" class="structured-block u-mb-xs">
          <span class="badge" th:text="${T(dev.hendrikhoemberg.dmhelper.common.web.DisplayLabels).humanize(section.kind)}">SECTION</span>
          <strong th:text="${section.label}">Label</strong>
          <p class="u-text-sm" th:text="${section.body}">Body</p>
          <div th:if="${view.sectionThreatCards != null and view.sectionThreatCards[section.id] != null}"
               class="u-mt-xs"
               th:with="card=${view.sectionThreatCards[section.id]}">
            <th:block th:if="${card.trap != null}">
              <th:block th:replace="~{threat/_mechanics-card :: mechanics-card(threat=${card.trap}, kind=${card.kind})}"></th:block>
            </th:block>
            <th:block th:if="${card.hazard != null}">
              <th:block th:replace="~{threat/_mechanics-card :: mechanics-card(threat=${card.hazard}, kind=${card.kind})}"></th:block>
            </th:block>
          </div>
        </div>
      </th:block>
      <th:block th:if="${view.participants != null and !view.participants.isEmpty() and mode.name() != 'COMPACT'}">
        <div class="scene-participants u-mt-sm">
          <h5 class="u-text-sm">Participants</h5>
          <div th:each="p : ${view.participants}" class="participant-row u-mb-xs">
            <strong th:text="${p.displayName}">Name</strong>
            <span class="badge" th:if="${p.quantity > 1}" th:text="|x${p.quantity}|">Qty</span>
            <span class="badge" th:if="${p.disposition != null}" th:text="${T(dev.hendrikhoemberg.dmhelper.common.web.DisplayLabels).humanize(p.disposition)}">Disp</span>
            <div th:if="${p.statBlockName != null}" class="participant-statblock">
              <span th:text="${p.statBlockName}">Statblock</span>
              <span class="u-text-xs" th:if="${p.statBlockAc != null}" th:text="|AC ${p.statBlockAc}|">AC</span>
              <span class="u-text-xs" th:if="${p.statBlockHp != null}" th:text="|HP ${p.statBlockHp}|">HP</span>
            </div>
            <div th:if="${p.placementHint}" class="u-text-xs text-muted" th:text="${p.placementHint}">Placement</div>
          </div>
        </div>
      </th:block>
      <th:block th:if="${view.checks != null and !view.checks.isEmpty() and mode.name() != 'COMPACT'}">
        <div class="scene-checks u-mt-sm">
          <h5 class="u-text-sm">Checks</h5>
          <div th:each="check : ${view.checks}" class="check-row u-mb-xs">
            <strong th:text="${check.label}">Check</strong>
            <span class="badge" th:if="${check.dc != null}" th:text="|DC ${check.dc}|">DC</span>
            <span th:if="${check.ability}" class="u-text-xs" th:text="|${check.ability} ${check.skill}|">Ability</span>
            <div th:if="${check.success}" class="u-text-xs">Success: <span th:text="${check.success}"></span></div>
            <div th:if="${check.failure}" class="u-text-xs">Failure: <span th:text="${check.failure}"></span></div>
          </div>
        </div>
      </th:block>
      <th:block th:if="${view.transitions != null and !view.transitions.isEmpty() and mode.name() != 'COMPACT'}">
        <div class="scene-transitions u-mt-sm">
          <h5 class="u-text-sm">Transitions</h5>
          <div th:each="t : ${view.transitions}">
            <div th:if="${t.kind == 'CHOICE' and t.targetSceneTitle != null}"
                 class="transition-choice u-mb-xs">
              <button class="btn btn-sm" data-scene-transition
                      data-runtime-action
                      th:attr="data-transition-id=${t.id}"
                      @click="followTransition($el.dataset.transitionId)"
                      th:text="${t.label ?: t.targetSceneTitle}">Follow</button>
            </div>
            <div th:if="${t.kind != 'CHOICE' or t.targetSceneTitle == null}"
                 class="transition-text u-text-xs text-muted u-mb-xs">
              <span th:text="|${t.kind}: ${t.label ?: t.externalDestination ?: 'Unknown'}|">Transition</span>
            </div>
          </div>
        </div>
      </th:block>
      <div class="scene-editorial">
        <button class="btn btn-ghost" th:if="${view.hasPrevious}"
                @click="stepScene(-1)" title="Previous scene">&larr; Prev</button>
        <button class="btn btn-ghost" th:if="${view.hasNext}"
                @click="stepScene(1)" title="Next scene">Next &rarr;</button>
      </div>
      <div class="scene-actions">
        <a class="btn scene-actions__control" target="_blank"
           th:if="${view.adventureId != null}"
           th:href="@{/campaigns/{cid}/adventures/{aid}/scenes/{sid}(cid=${campaignId},aid=${view.adventureId},sid=${view.sceneId})}"
           title="Open scene details">Open</a>
        <button class="btn scene-actions__control"
                th:if="${view.mapId != null}"
                th:attr="data-map-id=${view.mapId}"
                @click="switchMap($el.dataset.mapId)"
                title="Switch to scene map">Map</button>
        <button class="btn scene-actions__control" data-seed-scene-encounter
                th:if="${view.canSeedEncounter}"
                th:attr="data-scene-id=${view.sceneId}"
                :disabled="seedingSceneEncounter"
                :aria-busy="seedingSceneEncounter"
                @click="seedCurrentScene($el.dataset.sceneId)">
          <span x-text="seedingSceneEncounter ? 'Creating encounter…' : 'Create an encounter here'">
            Create an encounter here
          </span>
        </button>
        <button class="btn btn-primary scene-actions__control"
                data-runtime-action
                th:if="${view.linkedEncounterId != null}"
                th:attr="data-encounter-id=${view.linkedEncounterId}"
                @click="runEncounter($el.dataset.encounterId)">
          Run the prepared encounter
        </button>
      </div>
      <div th:if="${view.links != null and !view.links.isEmpty()}" class="scene-links">
        <div th:each="link : ${view.links}">
          <span th:text="${link.label}">Link</span>
          <span th:if="${link.role}" class="u-text-xs text-muted" th:text="|(${link.role})|">Role</span>
        </div>
      </div>
    </div>
  </div>
</div>
</th:block>
</html>
