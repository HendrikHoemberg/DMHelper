<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMHelper — Player View</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1510'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23c9a24a' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/player-projection.css}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--color-bg); color: var(--color-text);
               font-family: var(--font-ui);
               display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #playerContent { display: flex; flex: 1; min-height: 0; }
        .pv-canvas-wrap { flex: 1; overflow: hidden; position: relative; background: color-mix(in srgb, var(--color-bg), var(--color-accent) 5%); }
        .pv-initiative { display: flex; gap: 8px; padding: 8px 16px; background: var(--color-surface);
                         border-top: 1px solid var(--color-border); min-height: 48px; align-items: center; overflow-x: auto; }
        .pv-initiative .combatant-chip { padding: 4px 12px; border-radius: 4px;
                  border: 1px solid var(--color-border); font-size: 0.875rem;
                  display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .pv-initiative .combatant-chip.active { border-color: var(--color-accent); background: rgba(201,163,92,0.15); }
        .pv-initiative .combatant-chip.defeated { opacity: 0.4; text-decoration: line-through; }
        .pv-curtain { display: flex; align-items: center; justify-content: center; flex: 1;
                      background: var(--color-bg); color: var(--color-text-muted); font-size: 1.5rem; }
        .cond-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--color-accent);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 0.625rem; color: var(--color-bg); }
    </style>
    <style th:if="${!embedded}">
        .pv-status { position: absolute; bottom: 8px; right: 8px; font-size: 0.7rem;
                     color: var(--color-text-muted); }
    </style>
</head>
<body th:classappend="${embedded} ? 'pv-embedded' : null">
    <div id="playerContent">
        <div class="pv-curtain" id="pvCurtain">
            <div style="text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 16px;">🎲</div>
                <div>Waiting for the DM...</div>
            </div>
        </div>
    </div>
    <div class="pv-status" id="pvStatus" th:if="${!embedded}">Disconnected</div>

    <script th:src="@{/vendor/konva.min.js}"></script>
    <script type="module" th:src="@{/js/player/player-view.js}"></script>
</body>
</html>
