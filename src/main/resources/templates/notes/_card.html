<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<article class="card note-card" th:fragment="card(note)"
         th:attr="data-note-search=${note.title + ' ' + note.body + ' ' + note.tags},
                   data-note-type=${note.type.name()}">
    <div class="note-card__header">
        <h3 class="note-card__title">
            <a th:href="@{/campaigns/{cid}/notes/{nid}(cid=${note.campaign.id}, nid=${note.id})}"
               th:text="${note.title}">Title</a>
        </h3>
        <div class="u-flex u-gap-xs">
            <span class="badge" th:text="${#enums.label(note.type)}">TYPE</span>
            <th:block th:if="${!note.dmOnly}">
                <span th:replace="~{fragments/_badge :: badge(tone='shield', icon='shield', label='Player-safe')}"></span>
            </th:block>
        </div>
    </div>
    <p th:if="${note.body != null and !note.body.isBlank()}"
       class="note-card__body u-text-sm text-muted"
       th:text="${#strings.abbreviate(note.body, 150)}">Snippet</p>
    <div class="u-flex u-gap-xs u-mb-xs">
        <th:block th:if="${note.tags != null and !note.tags.isBlank()}">
            <span th:each="tag : ${#strings.arraySplit(note.tags, ',')}"
                  class="badge badge-tag"
                  th:if="${!#strings.isEmpty(tag.trim())}"
                  th:text="${tag.trim()}">tag</span>
        </th:block>
    </div>
    <div class="note-card__footer u-flex u-gap-sm">
        <span class="u-text-xs text-muted u-flex-1"
              th:text="'Created ' + ${#temporals.format(note.createdAt, 'yyyy-MM-dd')}">Date</span>
        <a th:href="@{/campaigns/{cid}/notes/{nid}/edit(cid=${note.campaign.id}, nid=${note.id})}"
           class="btn btn-ghost btn-xs">Edit</a>
        <button class="btn btn-danger btn-xs action-row__destructive"
                th:hx-delete="@{/campaigns/{cid}/notes/{nid}(cid=${note.campaign.id}, nid=${note.id})}"
                hx-target="#notes-list" hx-swap="outerHTML"
                th:hx-confirm="|Delete ${note.title}?|"
                data-confirm-consequence="The note and every backlink to it are deleted permanently."
                hx-disabled-elt="this">
            &times;
        </button>
    </div>
</article>
</html>
