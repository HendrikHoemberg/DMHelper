<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Notes',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Notes',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" th:href="@{/campaigns/{id}/notes/new(id=${campaignId})}" class="btn btn-primary">+ New Note</a>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
    <div class="search-bar">
        <div class="form-group">
            <label for="noteSearch">Search</label>
            <input type="text" id="noteSearch" name="search"
                   th:value="${search}"
                   th:hx-get="@{/campaigns/{id}/notes(id=${campaignId})}"
                   hx-trigger="keyup changed delay:200ms"
                   hx-include="#noteTypeFilter"
                   hx-target="#notes-list"
                   hx-swap="outerHTML"
                   hx-indicator="#notes-list-loading"
                   placeholder="Search notes...">
        </div>
        <div class="form-group">
            <label for="noteTypeFilter">Type</label>
            <select id="noteTypeFilter" name="type"
                    th:hx-get="@{/campaigns/{id}/notes(id=${campaignId})}"
                    hx-trigger="change"
                    hx-include="#noteSearch"
                    hx-target="#notes-list"
                    hx-swap="outerHTML"
                    hx-indicator="#notes-list-loading">
                <option value="" th:selected="${selectedType == null}">All Types</option>
                <option th:each="t : ${noteTypes}"
                        th:value="${t.name()}"
                        th:text="${#enums.label(t)}"
                        th:selected="${selectedType != null and selectedType.name() == t.name()}">Type</option>
            </select>
        </div>
    </div>

    <div id="notes-list" class="card-grid">
        <th:block th:if="${notes.isEmpty()}"><th:block th:replace="~{common/_empty-state :: empty-state('No notes yet', 'Create your first note', @{/campaigns/{id}/notes/new(id=${campaignId})}, null)}"></th:block></th:block>
        <th:block th:each="note : ${notes}">
            <th:block th:replace="~{notes/_card :: card(note=${note})}"></th:block>
        </th:block>
    </div>
    <div id="notes-list-loading" class="loading-region" aria-hidden="true">
        <th:block th:replace="~{fragments/_states :: skeleton(count=4)}"></th:block>
    </div>
</div>
</body>
</html>
