<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="'DMHelper — ' + ${campaign.name} + ' — Notes'">DMHelper — Notes</title>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="app-shell">
            <th:block th:replace="~{fragments/_appnav :: appnav}"></th:block>
        <main class="app-main">
            <div class="page-header">
                <div>
                    <div class="page-header-eyebrow" th:text="${campaign.name}">Notes</div>
                    <h1 data-display-title>Notes</h1>
                    <div class="rule-taper rule-taper--gold"></div>
                </div>
                <div class="page-header-actions">
                    <a th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>
                    <a th:href="@{/campaigns/{id}/notes/new(id=${campaignId})}" class="btn btn-primary">+ New Note</a>
                </div>
            </div>

            <div class="search-bar">
                <div class="form-group">
                    <label for="noteSearch">Search</label>
                    <input type="text" id="noteSearch" name="search"
                           th:value="${search}"
                           th:hx-get="@{/campaigns/{id}/notes(id=${campaignId})}"
                           hx-trigger="keyup changed delay:200ms"
                           hx-include="#noteTypeFilter"
                           hx-target="#notes-list"
                           hx-swap="outerHTML"
                           placeholder="Search notes...">
                </div>
                <div class="form-group">
                    <label for="noteTypeFilter">Type</label>
                    <select id="noteTypeFilter" name="type"
                            th:hx-get="@{/campaigns/{id}/notes(id=${campaignId})}"
                            hx-trigger="change"
                            hx-include="#noteSearch"
                            hx-target="#notes-list"
                            hx-swap="outerHTML">
                        <option value="" th:selected="${selectedType == null}">All Types</option>
                        <option th:each="t : ${noteTypes}"
                                th:value="${t.name()}"
                                th:text="${#enums.label(t)}"
                                th:selected="${selectedType != null and selectedType.name() == t.name()}">Type</option>
                    </select>
                </div>
            </div>

            <div id="notes-list" class="card-grid">
                <th:block th:if="${notes.isEmpty()}"><th:block th:replace="~{common/_empty-state :: empty-state('No notes yet', 'Create your first note', @{/campaigns/{id}/notes/new(id=${campaignId})}, null)}"></th:block></th:block>
                <th:block th:each="note : ${notes}">
                    <th:block th:replace="~{notes/_card :: card(note=${note})}"></th:block>
                </th:block>
            </div>
        </main>

    </div>
</body>
</html>
