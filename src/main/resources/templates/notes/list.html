<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle='Notes',
          archetype='index',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title='Notes',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{::#primaryAction},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="primaryAction" th:href="@{/campaigns/{id}/notes/new(id=${campaignId})}" class="btn btn-primary">+ New Note</a>
<a id="secondaryActions" th:href="@{/campaigns/{id}(id=${campaignId})}" class="btn btn-ghost">&larr; Campaign</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{fragments/_toolbar :: toolbar(
        action=@{/campaigns/{id}/notes(id=${campaignId})},
        searchValue=${search},
        searchPlaceholder='Filter notes by title, tags, or body…',
        filters=~{::#noteTypeFilter},
        actions=~{})}"></th:block>

    <div id="noteTypeFilter">
        <label class="sr-only" for="noteTypeSelect">Filter by type</label>
        <select id="noteTypeSelect" class="form-input" data-note-type-filter>
            <option value="">All types</option>
            <option th:each="t : ${noteTypes}"
                    th:value="${t.name()}"
                    th:text="${#enums.label(t)}"
                    th:selected="${selectedType != null and selectedType.name() == t.name()}">Type</option>
        </select>
    </div>

    <th:block th:if="${notes.isEmpty()}">
        <th:block th:replace="~{fragments/_states :: empty(
            icon='file-text',
            title='No notes yet',
            description='Capture sessions, plans, and world lore. Wiki-links such as [[Gundren]] build backlinks automatically.',
            cta=~{})}"></th:block>
    </th:block>

    <div id="notes-list" class="card-grid note-grid" th:unless="${notes.isEmpty()}">
        <th:block th:each="note : ${notes}">
            <th:block th:replace="~{notes/_card :: card(note=${note})}"></th:block>
        </th:block>
    </div>
</div>

<script>
    window.dmHelperFilterNotes = function (query, type) {
        var needle = (query || '').trim().toLowerCase();
        var typeNeedle = (type || '').trim();
        document.querySelectorAll('.note-card').forEach(function (card) {
            var haystack = (card.getAttribute('data-note-search') || '').toLowerCase();
            var matchesQuery = needle === '' || haystack.indexOf(needle) !== -1;
            var matchesType = typeNeedle === ''
                || card.getAttribute('data-note-type') === typeNeedle;
            card.hidden = !matchesQuery || !matchesType;
        });
    };
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('.page--index .toolbar__input');
        var type = document.querySelector('[data-note-type-filter]');
        if (input) {
            input.addEventListener('input', function () {
                window.dmHelperFilterNotes(this.value, type?.value || '');
            });
        }
        if (type) {
            type.addEventListener('change', function () {
                window.dmHelperFilterNotes(
                    document.querySelector('.page--index .toolbar__input')?.value || '',
                    this.value);
            });
        }
        window.dmHelperFilterNotes(
            document.querySelector('.page--index .toolbar__input')?.value || '',
            type?.value || '');
    });
</script>
</body>
</html>
