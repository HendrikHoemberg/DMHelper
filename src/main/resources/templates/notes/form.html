<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${note != null} ? 'Edit Note' : 'New Note',
          archetype='form',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${note != null} ? 'Edit Note' : 'New Note',
        summary=${campaign.name},
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<a id="secondaryActions" th:href="@{/campaigns/{id}/notes(id=${campaignId})}"
   class="btn btn-ghost">&larr; Back to Notes</a>

<div id="page-content" class="page-content">
    <th:block th:replace="~{notes/_form :: form(
        note=${note}, noteTypes=${noteTypes}, campaignId=${campaignId})}"></th:block>
</div>
</body>
</html>
