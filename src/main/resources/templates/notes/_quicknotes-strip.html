<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="strip(campaignId, targetType, targetId)">
<div x-data="quicknotes"
     th:attr="data-campaign-id=${campaignId},data-target-type=${targetType},data-target-id=${targetId}"
     class="quicknotes-strip">
    <h3>
        Quick Notes
    </h3>

    <form @submit.prevent="add()" class="quicknotes-form">
        <input type="text" x-model="newBody" placeholder="Jot a quick note...">
        <button type="submit" class="btn btn-primary btn-xs">
            Add
        </button>
    </form>

    <div class="quicknotes-list">
        <template x-for="qn in items" :key="qn.id">
            <div class="quicknote-row">
                <div>
                    <span x-text="qn.body" class="quicknote-body"></span>
                    <div class="quicknote-time" x-text="formatTime(qn.createdAt)"></div>
                </div>
                <div class="quicknote-actions">
                    <button @click="promote(qn)" class="btn btn-ghost btn-2xs"
                            title="Promote to full note">&#8593;</button>
                    <button @click="remove(qn.id)" class="btn btn-ghost btn-2xs u-text-danger"
                            title="Delete">&times;</button>
                </div>
            </div>
        </template>
        <div x-show="items.length === 0" class="quicknotes-empty">
            No quick notes yet.
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('quicknotes', () => ({
        items: [],
        newBody: '',
        campaignId: '',
        targetType: '',
        targetId: '',

        async init() {
            this.campaignId = this.$el.dataset.campaignId;
            this.targetType = this.$el.dataset.targetType;
            this.targetId = this.$el.dataset.targetId;
            await this.load();
        },

        async request(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response;
        },

        reportFailure(message, error) {
            console.error(message, error);
            window.showToast?.(message, 'error', 5000);
        },

        async load() {
            try {
                const resp = await this.request(
                    '/api/v1/campaigns/' + this.campaignId + '/quicknotes?targetType='
                    + this.targetType + '&targetId=' + this.targetId);
                this.items = await resp.json();
            } catch (error) {
                this.reportFailure('Could not load quick notes.', error);
            }
        },

        async add() {
            const body = this.newBody.trim();
            if (!body) return;
            try {
                const formData = new FormData();
                formData.append('targetType', this.targetType);
                formData.append('targetId', this.targetId);
                formData.append('body', body);
                const response = await this.request(
                    '/api/v1/campaigns/' + this.campaignId + '/quicknotes',
                    { method: 'POST', body: formData });
                this.items.push(await response.json());
                this.newBody = '';
            } catch (error) {
                this.newBody = body;
                this.reportFailure('Could not save the quick note. Your text has been kept.', error);
            }
        },

        async remove(id) {
            try {
                await this.request(
                    '/api/v1/campaigns/' + this.campaignId + '/quicknotes/' + id,
                    { method: 'DELETE' });
                this.items = this.items.filter(i => i.id !== id);
            } catch (error) {
                this.reportFailure('Could not delete the quick note. Nothing was changed.', error);
            }
        },

        async promote(qn) {
            try {
                const resp = await this.request(
                    '/api/v1/campaigns/' + this.campaignId + '/quicknotes/' + qn.id + '/promote',
                    { method: 'POST' });
                const result = await resp.json();
                this.items = this.items.filter(i => i.id !== qn.id);
                window.location = result.url;
            } catch (error) {
                this.reportFailure('Could not promote the quick note. Nothing was changed.', error);
            }
        },

        formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString();
        }
    }));
});
</script>
</th:block>
</html>
