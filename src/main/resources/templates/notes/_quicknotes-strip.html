<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="strip(campaignId, targetType, targetId)">
<div x-data="quicknotes"
     th:attr="data-campaign-id=${campaignId},data-target-type=${targetType},data-target-id=${targetId}"
     class="quicknotes-strip">
    <h3>
        Quick Notes
    </h3>

    <form @submit.prevent="add()" class="quicknotes-form">
        <input type="text" x-model="newBody" placeholder="Jot a quick note...">
        <button type="submit" class="btn btn-primary btn-xs">
            Add
        </button>
    </form>

    <div class="quicknotes-list">
        <template x-for="qn in items" :key="qn.id">
            <div class="quicknote-row">
                <div>
                    <span x-text="qn.body" class="quicknote-body"></span>
                    <div class="quicknote-time" x-text="formatTime(qn.createdAt)"></div>
                </div>
                <div class="quicknote-actions">
                    <button @click="promote(qn)" class="btn btn-ghost btn-2xs"
                            title="Promote to full note">&#8593;</button>
                    <button @click="remove(qn.id)" class="btn btn-ghost btn-2xs u-text-danger"
                            title="Delete">&times;</button>
                </div>
            </div>
        </template>
        <div x-show="items.length === 0" class="quicknotes-empty">
            No quick notes yet.
        </div>
    </div>
</div>
</th:block>
</html>
