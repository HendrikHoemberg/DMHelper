<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_shell :: page(
          pageTitle=${note.title},
          archetype='detail',
          surface=null,
          header=~{::#page-header},
          content=~{::#page-content},
          rail=~{::#page-rail})}">
<body>
<div id="page-header" class="page-header-slot">
    <th:block th:replace="~{fragments/_page-header :: page-header(
        title=${note.title},
        summary='Note',
        breadcrumb=~{},
        primary=~{},
        secondary=~{::#secondaryActions})}"></th:block>
</div>
<div id="secondaryActions" class="u-flex u-gap-xs">
    <a th:href="@{/campaigns/{id}/notes(id=${campaignId})}" class="btn btn-ghost">&larr; Notes</a>
    <a th:href="@{/campaigns/{cid}/notes/{nid}/edit(cid=${campaignId}, nid=${note.id})}"
       class="btn btn-ghost">Edit</a>
</div>

<div id="page-content" class="page-content">
    <div class="detail-meta u-mb-md">
        <span class="badge" th:text="${#enums.label(note.type)}">Type</span>
        <span class="badge" th:text="'Created ' + ${#temporals.format(note.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
        <th:block th:if="${!note.dmOnly}">
            <span th:replace="~{fragments/_badge :: badge(tone='shield', icon='shield', label='Player-safe')}"></span>
        </th:block>
        <th:block th:if="${note.tags != null and !note.tags.isBlank()}">
            <span th:each="tag : ${#strings.arraySplit(note.tags, ',')}"
                  class="badge badge-tag"
                  th:if="${!#strings.isEmpty(tag.trim())}"
                  th:text="${tag.trim()}">tag</span>
        </th:block>
    </div>

    <div class="prose note-body" th:utext="${renderedBody}">
        Rendered body here
    </div>

    <div class="u-mt-lg surface-danger-zone">
        <h2>Danger zone</h2>
        <p class="text-muted u-text-sm">This action cannot be undone.</p>
        <button class="btn btn-danger action-row__destructive"
                th:hx-delete="@{/campaigns/{cid}/notes/{nid}(cid=${campaignId}, nid=${note.id})}"
                hx-confirm="Delete this note?"
                hx-target="body" hx-swap="outerHTML"
                hx-disabled-elt="this">
            Delete
        </button>
    </div>
</div>

<div id="page-rail" class="page-rail-slot">
    <th:block th:replace="~{fragments/_context-rail :: rail(body=~{::#railBody})}"></th:block>
    <th:block th:replace="~{notes/_quicknotes-strip :: strip(campaignId=${campaignId}, targetType='NOTE', targetId=${note.id})}"></th:block>
</div>
<!-- The rail's source markup lives outside #page-rail, the same way #primaryAction
     lives outside #page-content. Inside the slot it renders twice: once where the
     shared fragment pulls it in, and again as the slot's own content. -->
<div id="railBody">
    <th:block th:replace="~{fragments/_context-rail :: rail-section(title='Referenced By', body=~{::#backlinkList})}"></th:block>
</div>
<div id="backlinkList">
    <p th:if="${#lists.isEmpty(backlinks)}" class="u-text-sm text-muted">No notes link to this one.</p>
    <ul th:unless="${#lists.isEmpty(backlinks)}" class="u-list-none">
        <li th:each="bl : ${backlinks}" class="u-mb-xs">
            <a th:href="@{/campaigns/{cid}/notes/{nid}(cid=${campaignId}, nid=${bl.id})}"
               th:text="${bl.title}">Backlink</a>
            <span class="badge backlink-type" th:text="${#enums.label(bl.type)}">Type</span>
        </li>
    </ul>
</div>
</body>
</html>
