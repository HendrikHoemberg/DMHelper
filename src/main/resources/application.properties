spring.application.name=dmhelper
server.port=8081

spring.datasource.url=jdbc:h2:file:${user.home}/.dmhelper/data/dmhelper;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Best-effort browser open on startup (SPEC 2.1); disable for headless/server runs.
dmhelper.open-browser=true
 