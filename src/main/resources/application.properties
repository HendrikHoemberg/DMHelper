spring.application.name=dmhelper
server.port=8081

spring.datasource.url=jdbc:h2:file:${user.home}/.dmhelper/data/dmhelper;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (db/migration). Hibernate only checks that the entities
# match what the migrations built, and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Databases created by the old ddl-auto=update already carry the V1 schema, so stamp
# them as baselined instead of re-running it. Fresh installs execute V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.h2.console.enabled=false

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Best-effort browser open on startup (SPEC 2.1); disable for headless/server runs.
dmhelper.open-browser=true

# PIN protection (disable for development)
dmhelper.pin-enabled=false
 