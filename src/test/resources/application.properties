dmhelper.pin-enabled=false
dmhelper.audio.test-provider=true

# Tests must never touch the user's real database at ~/.dmhelper/data.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Match production transaction boundaries so MVC tests cannot hide detached lazy access.
spring.jpa.open-in-view=false

dmhelper.open-browser=false

# This file shadows src/main/resources/application.properties, so the schema settings must be
# mirrored here — otherwise the suite runs on create-drop and never proves the migrations work.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
